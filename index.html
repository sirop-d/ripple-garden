<!DOCTYPE html>
<!--
  ripple-garden — 波紋の庭
  触れた水面が音と模様を生む生成楽器（単一HTML / 外部ライブラリなし）

  @version v019
  担当AI名: Codex / コウ

  更新履歴:
  - v019_20260618_071646: SCENEごとに波紋エンジンを分岐。RAIN GLASSは縦に滴る雨窓波、SHOREは帯状の岸波、
    DEEP WATERは広く遅い深水波、SILVER CURRENTは波紋より群泳流れ場を主役にする。タップ注入形状も円形固定を
    やめ、波面エネルギーの局所最大から泡・光・群れ分離の衝突FXを発生。SCENE切替時は水面・粒子・魚群を再シードし、
    スクリーンショットを切り替えるような別世界化を狙う。音は不変。
  - v018_20260618_060213: SURFACEを「環境シーン(SCENE)」へ拡張しUI名もSURFACE→SCENEへ改名。RAIN GLASS /
    SHORE / DEEP WATER に固有の背景レイヤー（夜窓・浅瀬・深海）と粒子（雨・泡・浮遊粒）・衝突FXを実装し、波頭の
    白化と擬似normal方向光で円形エフェクト感を低減。新シーン SILVER CURRENT（群泳・水中）を追加＝渦の流れ場で銀の
    魚群が回りタップで割れて戻る。環境シーンはUIテーマに依らず自前の背景を描く。CLASSIC等は無変更で後方互換・音は不変。
  - v017_20260618_044956: 水面テーマ「SURFACE」を新設（WATER直下のドロップダウン）。CLASSIC（標準）に加え
    POND / STREAM / RAIN GLASS / DEEP WATER / SHORE / GLASS WATER / INK WATER の7種を追加。各テーマは
    物理（波速・減衰・反射）×描画（ハイライト・さざ波・深度・煌めき・前ボケ・暖寒）×自律演出（自然ドロップ・
    雨粒）のプリセットを持ち、音モード(MODES)・PREFSのTHEME(light/dark/system)からは独立。選択はlocalStorageへ
    保存。録音 / CRUISE / 音浴 / 言語切替 / WATER ECO は不変。
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="ripple-garden — 触れた水面が音と模様を生む生成楽器。a generative water instrument.">
<meta property="og:type" content="website">
<meta property="og:title" content="ripple-garden — 波紋の庭">
<meta property="og:description" content="触れた水面が音と模様を生む生成楽器。波動方程式の水面、イベント駆動の音、WAV書き出し。A generative water instrument.">
<meta property="og:url" content="https://sirop-d.github.io/ripple-garden/">
<meta property="og:image" content="https://sirop-d.github.io/ripple-garden/assets/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="assets/favicon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>ripple-garden — 波紋の庭</title>
<style>
  /* ---------- 基調（ダーク既定 / html[data-theme=light] で上書き） ---------- */
  :root{
    --bg: #04070c;
    --ink: rgba(196, 214, 230, .78);
    --ink-dim: rgba(168, 190, 212, .42);
    --ink-faint: rgba(160, 185, 210, .22);
    --hairline: rgba(170, 200, 230, .14);
    --panel-bg: rgba(7, 11, 17, .58);
    --accent: rgba(165, 210, 250, .9);
    --rec: rgba(235, 130, 110, .9);
    --veil: rgba(2, 4, 8, .55);
    --reader-bg: rgba(4, 7, 12, .74);
    --opt-bg: #0a0f16;
    --serif: "Didot", "Bodoni 72", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
    --sans: "Avenir Next", "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  html[data-theme="light"]{
    --bg: #dde6ed;
    --ink: rgba(38, 58, 78, .85);
    --ink-dim: rgba(52, 78, 104, .55);
    --ink-faint: rgba(52, 78, 104, .3);
    --hairline: rgba(40, 70, 110, .18);
    --panel-bg: rgba(240, 246, 250, .6);
    --accent: rgba(22, 92, 170, .85);
    --rec: rgba(196, 66, 46, .9);
    --veil: rgba(150, 168, 186, .4);
    --reader-bg: rgba(226, 234, 241, .8);
    --opt-bg: #eef4f8;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:var(--bg);
    font-family:var(--sans);
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #view{
    position:fixed; inset:0; width:100%; height:100%;
    display:block; cursor:crosshair; touch-action:none;
  }
  /* 周辺減光 — 水面に奥行きを与える */
  #vignette{
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, transparent 52%, var(--veil) 100%);
  }

  /* ---------- 銘 ---------- */
  #brand{
    position:fixed; top:24px; left:30px; line-height:1; z-index:30;
    background:none; border:none; cursor:pointer; text-align:left;
  }
  #brand h1{
    font-family:var(--serif); font-weight:400; font-style:italic; font-size:17px;
    letter-spacing:.3em; color:var(--ink);
  }
  #brand .sub{
    display:block; margin-top:9px;
    font-size:8.5px; letter-spacing:.3em; color:var(--ink-dim); font-style:normal;
  }

  /* ---------- タブ ---------- */
  #tabs{
    position:fixed; top:30px; left:50%; transform:translateX(-50%); z-index:30;
    display:flex; gap:26px;
  }
  #tabs .tab{
    background:none; border:none; padding:4px 1px 7px; cursor:pointer;
    font-family:var(--sans); font-size:10px; letter-spacing:.28em;
    color:var(--ink-faint); border-bottom:1px solid transparent;
    transition:color .3s, border-color .3s;
  }
  #tabs .tab:hover{ color:var(--ink-dim); }
  #tabs .tab.on{ color:var(--ink); border-bottom-color:var(--accent); }

  /* ---------- パネル開閉ボタン ---------- */
  #panelToggle{
    position:fixed; top:22px; right:22px; z-index:32;
    width:34px; height:34px;
    background:var(--panel-bg); border:1px solid var(--hairline);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:border-color .3s;
  }
  #panelToggle:hover{ border-color:var(--ink-faint); }
  #panelToggle i{
    position:relative; width:12px; height:1px; background:var(--ink-dim);
    transition:transform .35s, background .3s;
  }
  #panelToggle i::before{
    content:""; position:absolute; left:0; top:-4px; width:12px; height:1px;
    background:inherit; transition:transform .35s, top .35s;
  }
  #panelToggle i::after{
    content:""; position:absolute; left:0; top:4px; width:12px; height:1px;
    background:inherit; transition:transform .35s, top .35s;
  }
  body.panel-open #panelToggle i{ background:var(--ink); transform:rotate(45deg); }
  body.panel-open #panelToggle i::before{ top:0; transform:rotate(-90deg); }
  body.panel-open #panelToggle i::after{ top:0; opacity:0; }

  /* ---------- コントロールパネル ---------- */
  #panel{
    position:fixed; top:70px; right:22px; z-index:31;
    width:218px; padding:20px 18px calc(16px + env(safe-area-inset-bottom));
    background:var(--panel-bg); border:1px solid var(--hairline);
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
    color:var(--ink);
    opacity:0; transform:translateX(12px); pointer-events:none;
    transition:opacity .35s, transform .35s;
    /* iOSのSafariはvhがアドレスバーやホームバーの裏まで伸び、下部(LANG/THEME)が隠れてスクロールも止まる。
       dvh(動的ビューポート)対応ブラウザでは下行が優先され、下端まで確実にスクロールできる。 */
    max-height:calc(100vh - 92px);
    max-height:calc(100dvh - 92px);
    overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin;
  }
  body.panel-open #panel{ opacity:1; transform:translateX(0); pointer-events:auto; }

  .sec-label{
    font-size:8px; letter-spacing:.3em; color:var(--ink-faint);
    margin-bottom:10px;
  }
  .sec + .sec{ margin-top:18px; padding-top:16px; border-top:1px solid var(--hairline); }

  /* モード選択: NORMAL / NOISEの境界を明示し、13行の縦長リストを圧縮する */
  .mode-segments{ display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:9px; }
  .mode-segments button{
    border:1px solid var(--hairline); background:transparent; color:var(--ink-faint);
    font:8px var(--sans); letter-spacing:.22em; padding:7px 4px; cursor:pointer;
    transition:color .25s, border-color .25s, background .25s;
  }
  .mode-segments button.active{ color:var(--ink); border-color:var(--accent); background:var(--hairline); }
  .mode-select{ transition:opacity .25s; }
  .mode-select + .mode-select{ margin-top:6px; }
  .mode-select.disabled{ opacity:.32; }
  .mode-select.disabled select{ cursor:not-allowed; }

  /* セレクト（ジャンル / テーマ / 言語 共通） */
  .sel-wrap{ position:relative; }
  .sel-wrap::after{
    content:""; position:absolute; right:11px; top:50%;
    width:5px; height:5px; pointer-events:none;
    border-right:1px solid var(--ink-dim); border-bottom:1px solid var(--ink-dim);
    transform:translateY(-70%) rotate(45deg);
  }
  .sel-wrap select{
    -webkit-appearance:none; appearance:none; width:100%;
    background:transparent; border:1px solid var(--hairline);
    color:var(--ink); font-family:var(--sans);
    font-size:9px; letter-spacing:.18em;
    padding:8px 26px 8px 10px; cursor:pointer;
  }
  .sel-wrap select:focus{ outline:none; border-color:var(--ink-faint); }
  .sel-wrap select option{ background:var(--opt-bg); color:var(--ink); letter-spacing:normal; }
  .prefs-row{ display:flex; align-items:center; gap:12px; padding:5px 0; }
  .prefs-row label{ font-size:8px; letter-spacing:.24em; color:var(--ink-dim); width:46px; flex:none; }
  .prefs-row .sel-wrap{ flex:1; }

  /* トグル行（ASSIST / LOOP / SHUFFLE） */
  .trow{
    display:flex; align-items:center; gap:10px;
    margin-top:10px; padding:2px 0; cursor:pointer;
  }
  .trow .a-lbl{ font-size:8px; letter-spacing:.24em; color:var(--ink-dim); }
  .trow .a-line{ flex:1; height:1px; background:var(--hairline); }
  .trow .a-state{ font-size:8px; letter-spacing:.2em; color:var(--accent); }
  .trow.off .a-state{ color:var(--ink-faint); }
  .trow.dim{ opacity:.35; cursor:not-allowed; }

  /* スライダー */
  .ctl{ display:flex; align-items:center; gap:12px; padding:6px 0; }
  .ctl label{
    font-size:8px; letter-spacing:.24em; color:var(--ink-dim); width:58px; flex:none;
  }
  .ctl .val{
    font-size:8px; letter-spacing:.1em; color:var(--ink-faint); width:30px;
    text-align:right; flex:none; font-variant-numeric:tabular-nums;
  }
  .ctl input[type=range]{
    -webkit-appearance:none; appearance:none; flex:1; min-width:0; height:18px;
    background:transparent; cursor:pointer;
  }
  .ctl input[type=range]::-webkit-slider-runnable-track{
    height:1px; background:var(--ink-faint);
  }
  .ctl input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:9px; height:9px; margin-top:-4px;
    border-radius:50%; background:var(--bg); border:1px solid var(--accent);
  }
  .ctl input[type=range]::-moz-range-track{ height:1px; background:var(--ink-faint); }
  .ctl input[type=range]::-moz-range-thumb{
    width:7px; height:7px; border-radius:50%;
    background:var(--bg); border:1px solid var(--accent);
  }
  .ctl.dim{ opacity:.35; pointer-events:none; }

  /* ボタン行 */
  .btn-row{ display:flex; border:1px solid var(--hairline); }
  .btn-row button{
    flex:1; padding:9px 0; background:transparent; border:none;
    border-right:1px solid var(--hairline);
    font-family:var(--sans); font-size:8.5px; letter-spacing:.22em;
    color:var(--ink-dim); cursor:pointer;
    transition:color .25s, background .25s, opacity .25s;
  }
  .btn-row button:last-child{ border-right:none; }
  .btn-row button:hover:not(:disabled){ color:var(--ink); background:rgba(128,160,190,.07); }
  .btn-row button:disabled{ opacity:.28; cursor:default; }
  #btnRec.recording{ color:var(--rec); }
  #btnRec.recording::before{
    content:"●"; font-size:7px; margin-right:5px;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.25} }

  /* CRUISEプレイヤー: ▶/■・次の曲・リピート・シャッフルのアイコンボタン */
  .transport{ display:flex; align-items:center; gap:10px; margin:2px 0 12px; }
  .tp-btn{
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:50%;
    border:1px solid var(--hairline); background:transparent;
    color:var(--ink-dim); cursor:pointer;
    transition:color .2s, background .2s, border-color .2s, opacity .2s;
  }
  .tp-btn:hover:not([disabled]){ color:var(--ink); }
  .tp-btn[disabled]{ opacity:.3; cursor:not-allowed; }
  .tp-btn[aria-pressed="true"]{ color:var(--accent); border-color:var(--accent); background:var(--hairline); }
  .tp-play{ width:44px; height:44px; border-color:var(--accent); color:var(--accent); background:rgba(128,160,190,.06); }
  .tp-play.running{ background:var(--hairline); }

  .keys{
    margin-top:14px; font-size:7.5px; letter-spacing:.16em;
    color:var(--ink-faint); text-align:center;
  }

  /* ---------- バッジ類 ---------- */
  #recBadge, #cruiseBadge{
    position:fixed; left:30px; z-index:20;
    font-size:9px; letter-spacing:.28em;
    font-variant-numeric:tabular-nums;
    opacity:0; transition:opacity .4s; pointer-events:none;
  }
  #recBadge{ bottom:26px; color:var(--rec); }
  #cruiseBadge{ bottom:48px; color:var(--accent); }
  #recBadge.on, #cruiseBadge.on{ opacity:1; }
  #recBadge::before, #cruiseBadge::before{
    content:"●"; font-size:7px; margin-right:8px;
    animation:pulse 1.6s ease-in-out infinite;
  }

  /* ---------- コードネーム / トースト ---------- */
  #chordName{
    position:fixed; right:30px; bottom:24px; z-index:20;
    font-family:var(--serif); font-size:14px; font-style:italic;
    letter-spacing:.22em; color:var(--ink-dim);
    opacity:0; transition:opacity .9s; pointer-events:none;
  }
  #chordName.on{ opacity:.85; transition:opacity .25s; }
  #toast{
    position:fixed; left:50%; bottom:84px; transform:translateX(-50%); z-index:20;
    font-family:var(--serif); font-style:italic; font-size:12px;
    letter-spacing:.3em; color:var(--ink-dim); white-space:nowrap;
    opacity:0; transition:opacity 1.2s; pointer-events:none;
  }
  #toast.on{ opacity:.9; transition:opacity .4s; }

  /* ---------- 誘い文・フッター ---------- */
  #hint{
    position:fixed; left:50%; bottom:52px; transform:translateX(-50%);
    font-size:9px; letter-spacing:.42em; color:var(--ink-dim);
    white-space:nowrap; pointer-events:none;
    animation:breathe 5s ease-in-out infinite;
    transition:opacity 1.6s;
  }
  #hint.gone{ animation:none; opacity:0; }
  @keyframes breathe{ 0%,100%{opacity:.55} 50%{opacity:.95} }

  #footerBtn{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:20;
    background:none; border:none; cursor:pointer;
    font-family:var(--sans); font-size:8.5px; letter-spacing:.3em;
    color:var(--ink-faint); transition:color .3s;
  }
  #footerBtn:hover{ color:var(--ink); }

  /* ---------- 版情報ダイアログ ---------- */
  #verModal, #modeConfirm{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.35);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  #verModal[hidden], #modeConfirm[hidden]{ display:none; }
  .vm-card{
    width:min(420px, calc(100vw - 48px));
    max-height:calc(100vh - 48px); max-height:calc(100dvh - 48px);
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:var(--panel-bg); border:1px solid var(--hairline);
    -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px);
    padding:28px 26px 22px; color:var(--ink);
  }
  .vm-card h3{
    font-family:var(--serif); font-style:italic; font-weight:400;
    font-size:16px; letter-spacing:.28em;
  }
  .vm-ver{ margin-top:8px; font-size:9px; letter-spacing:.24em; color:var(--ink-dim); }
  .vm-hist{ margin-top:18px; list-style:none; }
  .vm-hist li{
    padding:9px 0; border-top:1px solid var(--hairline);
    font-size:10.5px; line-height:1.8; color:var(--ink-dim); letter-spacing:.04em;
  }
  .vm-hist li b{ color:var(--ink); font-weight:500; letter-spacing:.12em; margin-right:8px; }
  .vm-close{
    margin-top:18px; width:100%; padding:9px 0;
    background:transparent; border:1px solid var(--hairline);
    font-family:var(--sans); font-size:8.5px; letter-spacing:.26em;
    color:var(--ink-dim); cursor:pointer; transition:color .25s;
  }
  .vm-close:hover{ color:var(--ink); }
  .vm-more{
    width:100%; padding:7px 0; background:transparent; border:none;
    font-family:var(--sans); font-size:8px; letter-spacing:.24em;
    color:var(--ink-faint); cursor:pointer; transition:color .25s;
  }
  .vm-more:hover{ color:var(--ink); }
  .mc-card{
    width:min(360px, calc(100vw - 48px));
    background:var(--panel-bg); border:1px solid var(--hairline);
    -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px);
    padding:25px 24px 20px; color:var(--ink);
  }
  .mc-card p{ font-size:12px; line-height:1.9; letter-spacing:.08em; text-align:center; }
  .mc-actions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:20px; }
  .mc-actions button{
    padding:9px 0; background:transparent; border:1px solid var(--hairline);
    font-family:var(--sans); font-size:9px; letter-spacing:.24em;
    color:var(--ink-dim); cursor:pointer; transition:color .25s, border-color .25s;
  }
  .mc-actions button:hover{ color:var(--ink); border-color:var(--ink-faint); }

  /* ---------- 読み物オーバーレイ（journal / about） ---------- */
  .reader{
    position:fixed; inset:0; z-index:15;
    background:var(--reader-bg);
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    -webkit-user-select:text; user-select:text;
  }
  .reader[hidden]{ display:none; }
  /* スクロールは内側のラッパーで行い、上下端をフェードして
     ヘッダー（タブ）・フッター（by sirop）と本文が重ならないようにする。
     mask は要素ボックス基準＝画面上で固定なので、スクロールしても帯位置は動かない。 */
  .reader-scroll{
    position:absolute; inset:0; overflow-y:auto;
    padding:112px 26px 90px;
    -webkit-overflow-scrolling:touch;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, transparent 72px, #000 116px, #000 calc(100% - 96px), transparent calc(100% - 60px), transparent 100%);
    mask-image:linear-gradient(to bottom, transparent 0, transparent 72px, #000 116px, #000 calc(100% - 96px), transparent calc(100% - 60px), transparent 100%);
  }
  .paper{ max-width:620px; margin:0 auto; }
  .paper h2{
    font-family:var(--serif); font-weight:400; font-size:17px;
    letter-spacing:.24em; color:var(--ink); margin:44px 0 16px;
  }
  .paper h2:first-child{ margin-top:0; }
  .paper p{
    font-size:12.5px; line-height:2.15; color:var(--ink);
    letter-spacing:.04em; margin-bottom:14px;
  }
  .paper .lead{
    font-family:var(--serif); font-style:italic; font-size:13.5px;
    color:var(--ink-dim); line-height:2.2;
  }
  .paper .note{ font-size:10.5px; color:var(--ink-dim); line-height:2; }
  .paper ul{ margin:0 0 14px 1.2em; }
  .paper li{
    font-size:12px; line-height:2.1; color:var(--ink); letter-spacing:.04em;
  }
  .paper a{ color:var(--accent); text-decoration:none; border-bottom:1px solid var(--hairline); }

  @media (max-width:640px){
    #brand{ top:18px; left:18px; }
    #brand h1{ font-size:13px; }
    #brand .sub{ display:none; }
    #tabs{ top:64px; gap:18px; }
    #tabs .tab{ font-size:9px; letter-spacing:.2em; }
    #panel{ width:202px; right:16px; top:100px; max-height:calc(100vh - 120px); max-height:calc(100dvh - 120px); }
    #panelToggle{ top:16px; right:16px; }

    journal: `
<h2>journal — 水音と環境音の小さな研究</h2>
<p class="lead">なぜ人は、雨の音や川のせせらぎを何時間も流しておくのだろう。ripple-garden の背景にある「鳴り続ける水」の文化を、短く辿る。</p>
<h2>ノイズには色がある</h2>
<p>すべての周波数を均等に含む音はホワイトノイズと呼ばれる。低い周波数ほど強くなるよう傾けたものがピンクノイズ、さらに深く沈めたものがブラウンノイズ。滝や豪雨、飛行機の機内のような重く柔らかい響きはブラウンノイズに近い。ripple-garden の BOWL モードは、このブラウンノイズを高い共鳴フィルタに通して「擦られたガラスの鉢」の声を作っている。</p>
<h2>環境音はなぜ心地よいのか</h2>
<p>一定の環境音が突発的な物音を覆い隠すこと（マスキング）で、集中や入眠を保ちやすくなると報告されている。また自然音の多くは、規則と不規則のあいだ——いわゆる 1/f ゆらぎ——を持ち、予測できそうでできない刺激が注意をやわらかく解放するとも言われる。効果には個人差があり、万能ではない。それでも「水の音で部屋を満たす」という習慣が世界中にあることは確かだ。</p>
<h2>クリスタルボウルの音と落ち着き ― 研究では</h2>
<p>シンギングボウル（金属製・クリスタル製）の音とリラックスの関係は、査読論文やシステマティックレビューでも調べられている。販売目的のサイトも多く玉石混交だが、信頼度の高い学術ソースに限ると、いくつかの方向がくり返し報告されている。あくまで研究上の傾向で、効果には個人差があり、医学的な助言ではない。</p>
<ul>
<li><strong>脳波のうつろい</strong> — 音の干渉が生む低い「うなり」が、覚醒・緊張に関わる速い脳波を抑え、深いリラックスに関わる遅い脳波を増やす方向が報告されている。</li>
<li><strong>自律神経のかたむき</strong> — 心拍変動の解析で、副交感神経（休息側）の指標が増え、安静時の心拍が下がる傾向が複数の研究で示されている。</li>
<li><strong>不安・緊張の低下</strong> — 対照試験や観察研究で、状態不安や気分のスコアが改善したという報告がある。</li>
<li><strong>努力のいらない受動性</strong> — 意識的な集中を要する弛緩法と違い、聴くだけで受動的にリラックス反応が起きやすいと考えられている。</li>
</ul>
<p class="note">※ ripple-garden の音はボウルそのものではなく、その重低音に着想した合成音です。上記は一般的な研究傾向であり、効果を保証するものではありません。</p>
<h2>水音のクロニクル</h2>
<ul>
<li>江戸期 — 日本庭園の鹿威しと水琴窟。水滴の反響を愛でる装置が園芸の中に生まれる。</li>
<li>1917 — サティ「家具の音楽」。聴くためでなく、そこに在るための音楽という発想。</li>
<li>1978 — ブライアン・イーノ『Music for Airports』。アンビエントという名前が与えられる。</li>
<li>1980年代 — 日本の環境音楽。吉村弘らが空間のための静かな音を作る。</li>

</ul>
<h2>長尺という発明</h2>
<p>環境音の動画は「終わらないこと」に価値がある。5分の美しさより、90分の気配。ripple-garden のクルーズモードはその自家生成版で、5分から120分、あるいは無限に、水面がひとりで演奏を続ける。シャッフルを灯せば、モードと進行が頃合いでゆっくり入れ替わる。</p>

<h2>ripple-garden とは</h2>
<p class="lead">夜の水面をひとつの楽器にした庭。波は本物の物理（波動方程式）で広がり、音はその出来事——着水・反射・干渉——から生まれる。触れる環境音楽。</p>
<h2>ふたつのモード ― NORMAL と 音浴（BATH）</h2>
<p>この庭にはふたつの性格があります。<strong>NORMAL</strong> は、水面に触れて音と波紋を奏でる楽器。<strong>音浴（BATH）</strong> は、途切れない音の層に身を浸して過ごすモードです。</p>
<p>音浴（BATH）は、集中やリラックスのためだけのものではありません。一定の音が<strong>生活音・話し声・外の工事の喧噪などをやわらかく覆い隠す</strong>はたらき（サウンドマスキング）を持ちます。不安やイライラからくる動悸に意識が持っていかれそうなとき、その音の層に身をあずけると、気がそれて少し和らぐことがあります（<strong>感じ方には個人差があります</strong>）。</p>
<h2>使い方</h2>
<ul>
<li>クリック / タップ — 一滴。縦の位置が音高、横の位置が音の左右とコードを決める。</li>
<li>ドラッグ — 水面を撫でる。スペースキー — ポインタの位置に一滴。連打でリズムが刻める。</li>
<li>スペースを押し込みながらポインタを動かす — 弓奏。分散和音が移動方向に沿って歩く。</li>
<li>MODE — NORMAL と 音浴（BATH）を切り替え、それぞれのリストから選ぶ。NORMAL は CALM / GLASS / STORM / RESONANCE / ZEN と木琴・鉄琴（硬いバチ・毛糸のバチ）。音浴（BATH）は BOWL（低音浴）／ホワイト／ピンク／ブラウン。</li>
<li>CRUISE — 自動演奏のプレイヤー。▶ で再生・■ で停止、リピート（∞ループ）、シャッフル、そのとなりの「次の曲」、TIME（5〜120分）と VOLUME を備える。環境音動画のように流しておける。</li>
<li>HARMONY — NORMAL のときのコード進行（王道・カノン・小室…）。ASSIST ON で反射音まで心地良く最適化、OFF で違和感がたまに混じる。SUSTAIN でロングトーン。</li>
<li>TONE — 音の低・中・高を整える3バンド。常に表示され、NORMAL では全体の音に、NOISE では持続ノイズに効く。とくに BASS は BOWL の重低音を探る要のつまみ。</li>
<li>WATER — 動く水面の表示トグル。OFF にすると描画と反射・干渉・きらめきを止める低電力モード（音は鳴り続ける）。出先やバッテリー節約に。LIFE / SPEED / REFLECT で水面の質感を整える。</li>
<li>REC → STOP → WAV — 演奏を16bitステレオWAVで保存。SUNO などの素材にどうぞ。CLEAR で波面をリセット。</li>
<li>テーマ / 言語 — 画面下の PREFS で、ライト・ダーク・システム、日本語・English・Français を切り替え。</li>
</ul>
<h2>音浴（BATH）の低音浴 ― BOWL</h2>
<p>BOWL（低音浴）は、<strong>アルケミークリスタルボウルの重低音だけを抽出した低音浴</strong>です。きらびやかな高い倍音をそぎ落とし、お腹に響く超低音にしぼり込んでいます。ひとつひとつの仕組みを知ると、より深く沈み込めます。</p>
<ul>
<li><strong>触れると超低音が立ち上がる</strong> — 水面に触れた瞬間からふわりと低音のドローンが立ち上がり、0.5秒ほどでリッチな響きになります。約10秒そのまま持続し、そこから約10秒かけて、ゆっくりした揺らぎ（うねり）を伴いながら静かに消えていきます。</li>
<li><strong>長い余韻と芯のある打音</strong> — 触れた音は長く美しい余韻を引きます。鳴り始めには、マレットで「コン…」と叩いたような芯がほんの一瞬だけ混じります。</li>
<li><strong>濃密なうねり</strong> — わずかに高さをずらした複数の低音が重なり、「ぶわんぶわん」「シュワシュワ」とした空気のうねりを生みます。ヘッドホンだと左右に広がって感じられます。</li>
<li><strong>TONE の BASS で重低音を追い込む</strong> — TONE の BASS を上げるほど低音が増します。<strong>上げすぎると音が割れて「バリバリ」とノイズになります。</strong>割れる手前のいちばん豊かに鳴る一点（スイートスポット）を、BASS をゆっくり動かしながら探してください。</li>
</ul>
<p class="note">※ この超低音は小さなスピーカーやスマホの内蔵スピーカーではほとんど鳴りません。<strong>ヘッドホンやサブウーファーのある環境を強くおすすめします。</strong>低音を限界まで追い込んでいるぶん音割れしやすいので、音量は控えめから始めてください。</p>
<h2>音浴（BATH）の3つのノイズ</h2>
<p>ブラウン・ピンク・ホワイトの3つは、波紋を奏でる楽器というより<strong>持続する環境音</strong>。音浴（BATH）で選んで CRUISE の START を押すと、途切れない音の層が流れ続け、生活音をやわらかく覆います。TONE の低・中・高つまみで、自分の夜に合わせて音色を整えられる。</p>
<ul>
<li><strong>WHITE（ホワイト）</strong> — 全周波数を均等に含む「シャー」。集中と、外の物音の遮断に。慣れると眠りにも。刺さると感じたら TREBLE を下げて。</li>
<li><strong>PINK（ピンク）</strong> — 低い方へ傾いた「ザー」。雨や滝のような自然な厚み。ホワイトより柔らかく、集中・遮断・睡眠に。</li>
<li><strong>BROWN（ブラウン）</strong> — 低音の塊「ゴー」。包まれるような重低音で、集中・睡眠に加えて、不安や動悸が気になるときに気持ちを落ち着けてくれる。BASS つまみを上げると 48Hz のサブ低音と合わさって芯が出る（ヘッドホン推奨）。</li>
</ul>
<p class="note">※ ノイズを選ぶと音量は自動で約10%まで絞られます（通常モードからの音量差で驚かないため）。そこから VOLUME で好みに上げてください。シャッフルではノイズは選ばれません。効果には個人差があります。</p>
<h2>おまけ — この庭から生まれた曲</h2>
<p>ripple-garden で録音した音から生まれた曲です♪</p>
<p class="note">Where Ripples Wake — 水底で目覚める ／ 歌詞: sirop ／ 音楽: SUNO</p>
<iframe src="https://suno.com/embed/6c88c634-d980-47f5-909b-fecef6e78b3a" width="100%" height="240" frameborder="0" allow="encrypted-media; fullscreen" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Where Ripples Wake — Suno" style="max-width:760px; border:1px solid var(--hairline); border-radius:4px;"><a href="https://suno.com/song/6c88c634-d980-47f5-909b-fecef6e78b3a" target="_blank" rel="noopener">Listen on Suno</a></iframe>
<h2>about sirop</h2>
<p>sirop（シロップ）。外部記憶OSを育てながら、4つのAIエージェント（コウ/Codex・ソル/Cursor・クー/Claude Code・ラビ/Antigravity）と小さなwebの遊び場を作っている。単一HTMLで動く「触れる小宇宙」シリーズ — gem-cosmos、shima-shima、そして ripple-garden。本作の初回実装はクー/Claude Fable 5 (Ultracode)。</p>
<p>この庭は、ひとつの考え方から生まれている。情報やひらめきを使い捨てにせず、種のように蒔いて寝かせ、AIと一緒に育てていく——「外部記憶OS」という試み。答えを急がず問いのまま置いておくこと、敵や怒りを燃料にせず静かな場所を守ること、知識を読むだけのものではなく<strong>触れて遊べる小宇宙</strong>に変えること。ripple-garden は、その考え方が手で触れられる形になった小さな結晶のひとつ。</p>

    journal: `
<h2>journal — small notes on water & ambient sound</h2>
<p class="lead">Why do we leave rain sounds playing for hours? A short walk through the culture of endlessly sounding water behind ripple-garden.</p>
<h2>Noise has colours</h2>
<p>Sound containing all frequencies equally is white noise. Tilt the spectrum toward the lows and you get pink noise; sink it deeper and it becomes brown noise — the heavy, soft wash of waterfalls, downpours and aircraft cabins. The BOWL mode of ripple-garden feeds brown noise through high-resonance filters to create the voice of a rubbed glass bowl.</p>
<h2>Why ambient sound feels good</h2>
<p>Steady ambient sound is reported to mask sudden noises, which can help focus and sleep. Many natural sounds also live between order and chance — the so-called 1/f fluctuation — gently releasing attention. Effects vary from person to person; nothing here is universal. Yet the habit of filling a room with water sound exists everywhere.</p>
<h2>Singing bowls and calm — what research says</h2>
<p>The link between singing-bowl sound (metal and crystal) and relaxation has been studied in peer-reviewed papers and systematic reviews. Many sources are sales-driven, so quality varies; but limiting to higher-trust academic sources, a few directions are reported repeatedly. These are research tendencies only — effects vary between people, and none of this is medical advice.</p>
<ul>
<li><strong>Shifting brainwaves</strong> — the low "beats" from acoustic interference are reported to reduce the faster waves tied to arousal and tension while increasing the slower waves tied to deep relaxation.</li>
<li><strong>A tilt in the autonomic balance</strong> — heart-rate-variability analyses show parasympathetic (rest) indices rising and resting heart rate falling across several studies.</li>
<li><strong>Lower anxiety and tension</strong> — controlled and observational studies report improved state-anxiety and mood scores.</li>
<li><strong>Effortless, passive relaxation</strong> — unlike methods that need conscious focus, simply listening seems to trigger a relaxation response passively.</li>
</ul>
<p class="note">※ ripple-garden's sound is not an actual bowl but a synthesis inspired by its deep bass. The above are general research tendencies and do not guarantee any effect.</p>
<h2>A chronicle of water sound</h2>
<ul>
<li>Edo period — shishi-odoshi and suikinkutsu in Japanese gardens: devices built to admire the echo of a drop.</li>
<li>1917 — Satie's “furniture music”: music to exist in, not to listen to.</li>
<li>1978 — Brian Eno, <i>Music for Airports</i>. Ambient gets its name.</li>
<li>1980s — Japanese kankyō ongaku; Hiroshi Yoshimura and quiet music for spaces.</li>
<li>2010s — eight-hour rain, ten-hour waves on YouTube. Long-form ambience becomes a companion.</li>
<li>2017 — lo-fi hip hop radio: music that never stops becomes everyday furniture.</li>
</ul>
<h2>The invention of length</h2>
<p>Ambient videos are valuable because they do not end. Not five beautiful minutes, but ninety minutes of presence. Cruise mode is a self-generating version of that: from five minutes to two hours, or forever, the water plays itself. Light up shuffle and modes and progressions slowly trade places.</p>
<p class="note">※ Keep the volume low. Effects vary; this is cultural history, not medical advice.</p>`,
    about: `
<h2>what is ripple-garden</h2>
<p class="lead">A garden where a night water surface becomes an instrument. Waves spread by real physics (the wave equation); sound is born from its events — drops, reflections, interferences. Ambient music you can touch.</p>
<h2>two modes — NORMAL and BATH</h2>
<p>This garden has two characters. <strong>NORMAL</strong> is an instrument you play by touching the water for sound and ripples. <strong>BATH</strong> is a mode for soaking in an unbroken layer of sound.</p>
<p>BATH isn't only for focus and relaxation. A steady sound <strong>softly masks household noise, voices and outside construction din</strong> (sound masking). When anxiety or irritation pulls your attention toward a racing heartbeat, letting yourself sink into that layer of sound can draw your attention away and ease it a little (<strong>this varies from person to person</strong>).</p>
<h2>how to play</h2>
<ul>
<li>Click / tap — one drop. Vertical position sets pitch, horizontal sets pan and chord.</li>
<li>Drag — stroke the water. Spacebar — a drop at the pointer; tap it rhythmically.</li>
<li>Hold space and move the pointer — bowing: an arpeggio walks along your movement.</li>
<li>MODE — switch between NORMAL and BATH, then pick from each list. NORMAL has CALM / GLASS / STORM / RESONANCE / ZEN plus xylophone and glockenspiel (hard & yarn mallets). BATH has BOWL (bass bath) / white / pink / brown.</li>
<li>CRUISE — a self-playing transport: ▶ play, ■ stop, repeat (∞ loop), shuffle, a “next” button beside it, plus TIME (5–120 min) and VOLUME. Leave it on like an ambient video.</li>
<li>HARMONY — the chord progression in NORMAL (royal road, canon, 50s…). ASSIST ON optimises everything — even reflections — toward pleasant chords, OFF lets a little friction in; SUSTAIN for long tones.</li>
<li>TONE — a three-band bass / mid / treble shaper, always visible. In NORMAL it shapes the whole sound, in NOISE the sustained noise. BASS in particular is the key to dialing in BOWL's deep low end.</li>
<li>WATER — a toggle for the moving surface. Turn it OFF for a low-power mode that stops the visuals plus reflections, interference and shimmer (the sound keeps playing) — handy on the go or to save battery. LIFE / SPEED / REFLECT tune the water.</li>
<li>REC → STOP → WAV — save your take as 16-bit stereo WAV, ready for SUNO and friends. CLEAR resets the surface.</li>
<li>Theme / language — at the bottom in PREFS: light, dark, system, and 日本語 / English / Français.</li>
</ul>
<h2>BATH's bass bath — BOWL</h2>
<p>BOWL (bass bath) is <strong>only the deep bass of an alchemy crystal singing bowl, extracted</strong>. The bright high overtones are stripped away, leaving a sub-bass you feel in your body. Knowing each piece lets you sink in deeper.</p>
<ul>
<li><strong>A sub-bass swells when you touch</strong> — the moment you touch the water, a low drone fades in and turns rich within about half a second. It holds for roughly ten seconds, then fades away over another ten with a slow, wavering shimmer.</li>
<li><strong>Long tails with a core</strong> — each touch rings with a long, beautiful tail, and a faint mallet-like "tok" gives the onset a pleasant core.</li>
<li><strong>Dense undulation</strong> — several slightly detuned low tones overlap into a "wobble" of moving air; on headphones it spreads left and right.</li>
<li><strong>Dial in the low end with TONE BASS</strong> — raising TONE's BASS adds weight. <strong>Push it too far and the sound breaks up into a crackly distortion.</strong> Move BASS slowly to find the single richest point just before it breaks — its sweet spot.</li>
</ul>
<p class="note">※ This sub-bass barely sounds on small or phone speakers. <strong>Headphones or a subwoofer are strongly recommended.</strong> Because the low end is pushed to its limit it distorts easily, so start at a low volume.</p>
<h2>BATH's three noises</h2>
<p>Brown, pink and white are less instruments than <strong>continuous ambience</strong>. Choose one in BATH and press START in CRUISE: an unbroken layer of sound keeps flowing and softly covers household noise. Shape it to your night with the TONE bass / mid / treble knobs.</p>
<ul>
<li><strong>WHITE</strong> — an even “shhh” across all frequencies. For focus and masking outside noise; for sleep once you're used to it. If it feels sharp, lower TREBLE.</li>
<li><strong>PINK</strong> — a softer “shhh” tilted toward the lows, like rain or a waterfall. Gentler than white, for focus, masking and sleep.</li>
<li><strong>BROWN</strong> — a low “rrr”, a wrap-around rumble. Beyond focus and sleep, it can settle the mind when anxiety or a racing heartbeat pulls at your attention. Raise BASS to bring in the 48 Hz sub for real body (headphones recommended).</li>
</ul>
<p class="note">※ Choosing a noise mode auto-dips the volume to ~10% (so the jump from normal modes doesn't startle). Raise it from there with VOLUME. Shuffle never picks a noise mode. Effects vary from person to person.</p>

<h2>about sirop</h2>
<p>sirop grows an external-memory OS and builds small web playgrounds with four AI agents (Kou/Codex, Sol/Cursor, Kuu/Claude Code, Rabi/Antigravity). A series of single-file “touchable little worlds”: gem-cosmos, shima-shima, and ripple-garden. The first implementation was by Kuu / Claude Fable 5 (Ultracode).</p>

<h2>Le bruit a des couleurs</h2>
<p>Un son contenant toutes les fréquences à égalité est un bruit blanc. Incliné vers les graves, il devient rose ; enfoncé plus profond, brun — la rumeur lourde et douce des cascades et des averses. Le mode BOWL de ripple-garden fait passer un bruit brun dans des filtres très résonants pour créer la voix d'un bol de verre frotté.</p>

<p>On rapporte qu'un fond sonore stable masque les bruits soudains, ce qui peut aider la concentration et le sommeil. Beaucoup de sons naturels vivent entre ordre et hasard — la fameuse fluctuation en 1/f — et relâchent doucement l'attention. Les effets varient selon les personnes ; rien d'universel ici. Pourtant, l'habitude d'emplir une pièce du son de l'eau existe partout.</p>

<h2>qu'est-ce que ripple-garden</h2>
<p class="lead">Un jardin où la surface nocturne de l'eau devient un instrument. Les ondes se propagent par une vraie physique (l'équation d'onde) ; le son naît de ses événements — gouttes, réflexions, interférences. Une musique ambiante que l'on touche.</p>
<h2>deux modes — NORMAL et BAIN</h2>
<p>Ce jardin a deux caractères. <strong>NORMAL</strong> est un instrument dont on joue en touchant l'eau pour créer son et ondulations. <strong>BAIN</strong> est un mode où l'on se plonge dans une couche de son ininterrompue.</p>
<p>Le BAIN n'est pas seulement pour la concentration et la détente. Un son régulier <strong>masque doucement les bruits domestiques, les voix et le vacarme des travaux extérieurs</strong> (masquage sonore). Quand l'anxiété ou l'irritation attire l'attention vers un cœur qui s'emballe, se laisser couler dans cette couche de son peut en détourner l'attention et l'apaiser un peu (<strong>cela varie selon les personnes</strong>).</p>
<h2>comment jouer</h2>
<ul>
<li>Clic / toucher — une goutte. La hauteur règle la note, l'horizontale le panoramique et l'accord.</li>

const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
const ladderCache = new Map();

/* FREE時: モード固有のペンタトニック梯子（2オクターブ） */
function modeLadder(m){
  const key = "mode:" + m.id;
  if (ladderCache.has(key)) return ladderCache.get(key);
  const out = [];
  for (let oct = 0; oct < 2; oct++)
    for (const s of m.scale) out.push(midiHz(m.root + s + oct * 12));
  out.push(midiHz(m.root + 24));
  ladderCache.set(key, out);
  return out;
}

/* 和声時: 画面X位置のコードを ±1オクターブに展開した梯子 */
function chordLadder(g, col, shift){
  const key = g.id + ":" + col + ":" + shift;
  if (ladderCache.has(key)) return ladderCache.get(key);
  const set = new Set();
  for (const o of [-12, 0, 12])
    for (const n of g.prog[col]) set.add(n + o + shift);
  const out = [...set].sort((a, b) => a - b).map(midiHz);
  ladderCache.set(key, out);
  return out;
}
