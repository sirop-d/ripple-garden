<!DOCTYPE html>
<!--
  ripple-garden — 波紋の庭
  触れた水面が音と模様を生む生成楽器（単一HTML / 外部ライブラリなし）

  @version v010
  担当AI名: Codex / コウ

  更新履歴:
  - v010_20260613_185659: MODEを縦13行からNORMAL / NOISEセグメント＋各ドロップダウンへ再編。
    NORMAL↔NOISEの境界を音が鳴っている時だけ確認し、NOISE中はSHUFFLEを自動OFF・無効化、
    通常音へ戻ると直前状態を復元 / iPhoneのメニュー下端までスクロール可能にするdvh・safe-area対応 /
    ノイズモード中の音程付き反射音を停止。
  - v009_20260613_173751: 長時間運用の安定化。①発音が終わった声部（voiceOutのゲイン/
    パンナー）をリバーブ残響ぶん待ってから切断・解放し、dryへ繋ぎっぱなしのAudioNode蓄積
    （長時間でページが固まる一因）を防止 / ②一定時間ごと（既定120分）に自動クリーンアップ。
    clearWaterのフェードアウト→掃除→フェードインを再利用し、聴感を途切れさせず波面・波紋・
    グローをリセット。手弾きが途切れている時だけ実行（クルーズ中は常時対象）。
  - v008_20260613_130442: ノイズ3モード（ブラウン/ピンク/ホワイト）に持続ノイズベッドを追加。
    従来は波紋ごとの減衰音のみで音圧が出なかったため、CRUISE中にノイズモードを選ぶと
    連続ドローンが鳴るようにした / 高・中・低の3バンドつまみ（NOISE TONE = ローシェルフ/
    ピーキング/ハイシェルフ）でトーン調整 / ブラウンには48Hzのサブ低音を薄く重ねて
    お腹に響く芯を補強 / 通常音→ノイズで音量を約10%へ自動で絞り爆音を防止（戻すと復帰）/
    シャッフルはノイズ3モードを選ばないよう除外 / ripple-gardenタブにノイズ3種の使用法と
    効用を3言語で追記 / ページ離脱時に音を確実に止めるteardownを追加 /
    集中・睡眠・不安鎮静のリラックス音響を強化。
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="ripple-garden — 触れた水面が音と模様を生む生成楽器。a generative water instrument.">
<meta property="og:type" content="website">
<meta property="og:title" content="ripple-garden — 波紋の庭">
<meta property="og:description" content="触れた水面が音と模様を生む生成楽器。波動方程式の水面、イベント駆動の音、WAV書き出し。A generative water instrument.">
<meta property="og:url" content="https://sirop-d.github.io/ripple-garden/">
<meta property="og:image" content="https://sirop-d.github.io/ripple-garden/assets/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2304070c'/%3E%3Cg fill='none' stroke='%23a5d2fa'%3E%3Ccircle cx='32' cy='34' r='7' stroke-opacity='.95' stroke-width='2'/%3E%3Ccircle cx='32' cy='34' r='15' stroke-opacity='.55' stroke-width='1.6'/%3E%3Ccircle cx='32' cy='34' r='23' stroke-opacity='.28' stroke-width='1.3'/%3E%3C/g%3E%3Ccircle cx='32' cy='34' r='2.2' fill='%23cfe6fb'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="assets/favicon.png">
<title>ripple-garden — 波紋の庭</title>
<style>
  /* ---------- 基調（ダーク既定 / html[data-theme=light] で上書き） ---------- */
  :root{
    --bg: #04070c;
    --ink: rgba(196, 214, 230, .78);
    --ink-dim: rgba(168, 190, 212, .42);
    --ink-faint: rgba(160, 185, 210, .22);
    --hairline: rgba(170, 200, 230, .14);
    --panel-bg: rgba(7, 11, 17, .58);
    --accent: rgba(165, 210, 250, .9);
    --rec: rgba(235, 130, 110, .9);
    --veil: rgba(2, 4, 8, .55);
    --reader-bg: rgba(4, 7, 12, .74);
    --opt-bg: #0a0f16;
    --serif: "Didot", "Bodoni 72", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
    --sans: "Avenir Next", "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  html[data-theme="light"]{
    --bg: #dde6ed;
    --ink: rgba(38, 58, 78, .85);
    --ink-dim: rgba(52, 78, 104, .55);
    --ink-faint: rgba(52, 78, 104, .3);
    --hairline: rgba(40, 70, 110, .18);
    --panel-bg: rgba(240, 246, 250, .6);
    --accent: rgba(22, 92, 170, .85);
    --rec: rgba(196, 66, 46, .9);
    --veil: rgba(150, 168, 186, .4);
    --reader-bg: rgba(226, 234, 241, .8);
    --opt-bg: #eef4f8;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:var(--bg);
    font-family:var(--sans);
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #view{
    position:fixed; inset:0; width:100%; height:100%;
    display:block; cursor:crosshair; touch-action:none;
  }
  /* 周辺減光 — 水面に奥行きを与える */
  #vignette{
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, transparent 52%, var(--veil) 100%);
  }

  /* ---------- 銘 ---------- */
  #brand{
    position:fixed; top:24px; left:30px; line-height:1; z-index:30;
    background:none; border:none; cursor:pointer; text-align:left;
  }
  #brand h1{
    font-family:var(--serif); font-weight:400; font-style:italic; font-size:17px;
    letter-spacing:.3em; color:var(--ink);
  }
  #brand .sub{
    display:block; margin-top:9px;
    font-size:8.5px; letter-spacing:.3em; color:var(--ink-dim); font-style:normal;
  }

  /* ---------- タブ ---------- */
  #tabs{
    position:fixed; top:30px; left:50%; transform:translateX(-50%); z-index:30;
    display:flex; gap:26px;
  }
  #tabs .tab{
    background:none; border:none; padding:4px 1px 7px; cursor:pointer;
    font-family:var(--sans); font-size:10px; letter-spacing:.28em;
    color:var(--ink-faint); border-bottom:1px solid transparent;
    transition:color .3s, border-color .3s;
  }
  #tabs .tab:hover{ color:var(--ink-dim); }
  #tabs .tab.on{ color:var(--ink); border-bottom-color:var(--accent); }

  /* ---------- パネル開閉ボタン ---------- */
  #panelToggle{
    position:fixed; top:22px; right:22px; z-index:32;
    width:34px; height:34px;
    background:var(--panel-bg); border:1px solid var(--hairline);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:border-color .3s;
  }
  #panelToggle:hover{ border-color:var(--ink-faint); }
  #panelToggle i{
    position:relative; width:12px; height:1px; background:var(--ink-dim);
    transition:transform .35s, background .3s;
  }
  #panelToggle i::before{
    content:""; position:absolute; left:0; top:-4px; width:12px; height:1px;
    background:inherit; transition:transform .35s, top .35s;
  }
  #panelToggle i::after{
    content:""; position:absolute; left:0; top:4px; width:12px; height:1px;
    background:inherit; transition:transform .35s, top .35s;
  }
  body.panel-open #panelToggle i{ background:var(--ink); transform:rotate(45deg); }
  body.panel-open #panelToggle i::before{ top:0; transform:rotate(-90deg); }
  body.panel-open #panelToggle i::after{ top:0; opacity:0; }

  /* ---------- コントロールパネル ---------- */
  #panel{
    position:fixed; top:70px; right:22px; z-index:31;
    width:218px; padding:20px 18px calc(16px + env(safe-area-inset-bottom));
    background:var(--panel-bg); border:1px solid var(--hairline);
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
    color:var(--ink);
    opacity:0; transform:translateX(12px); pointer-events:none;
    transition:opacity .35s, transform .35s;
    /* iOSのSafariはvhがアドレスバーやホームバーの裏まで伸び、下部(LANG/THEME)が隠れてスクロールも止まる。
       dvh(動的ビューポート)対応ブラウザでは下行が優先され、下端まで確実にスクロールできる。 */
    max-height:calc(100vh - 92px);
    max-height:calc(100dvh - 92px);
    overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin;
  }
  body.panel-open #panel{ opacity:1; transform:translateX(0); pointer-events:auto; }

  .sec-label{
    font-size:8px; letter-spacing:.3em; color:var(--ink-faint);
    margin-bottom:10px;
  }
  .sec + .sec{ margin-top:18px; padding-top:16px; border-top:1px solid var(--hairline); }

  /* モード選択: NORMAL / NOISEの境界を明示し、13行の縦長リストを圧縮する */
  .mode-segments{ display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:9px; }
  .mode-segments button{
    border:1px solid var(--hairline); background:transparent; color:var(--ink-faint);
    font:8px var(--sans); letter-spacing:.22em; padding:7px 4px; cursor:pointer;
    transition:color .25s, border-color .25s, background .25s;
  }
  .mode-segments button.active{ color:var(--ink); border-color:var(--accent); background:var(--hairline); }
  .mode-select{ transition:opacity .25s; }
  .mode-select + .mode-select{ margin-top:6px; }
  .mode-select.disabled{ opacity:.32; }
  .mode-select.disabled select{ cursor:not-allowed; }

  /* セレクト（ジャンル / テーマ / 言語 共通） */
  .sel-wrap{ position:relative; }
  .sel-wrap::after{
    content:""; position:absolute; right:11px; top:50%;
    width:5px; height:5px; pointer-events:none;
    border-right:1px solid var(--ink-dim); border-bottom:1px solid var(--ink-dim);
    transform:translateY(-70%) rotate(45deg);
  }
  .sel-wrap select{
    -webkit-appearance:none; appearance:none; width:100%;
    background:transparent; border:1px solid var(--hairline);
    color:var(--ink); font-family:var(--sans);
    font-size:9px; letter-spacing:.18em;
    padding:8px 26px 8px 10px; cursor:pointer;
  }
  .sel-wrap select:focus{ outline:none; border-color:var(--ink-faint); }
  .sel-wrap select option{ background:var(--opt-bg); color:var(--ink); letter-spacing:normal; }
  .prefs-row{ display:flex; align-items:center; gap:12px; padding:5px 0; }
  .prefs-row label{ font-size:8px; letter-spacing:.24em; color:var(--ink-dim); width:46px; flex:none; }
  .prefs-row .sel-wrap{ flex:1; }

  /* トグル行（ASSIST / LOOP / SHUFFLE） */
  .trow{
    display:flex; align-items:center; gap:10px;
    margin-top:10px; padding:2px 0; cursor:pointer;
  }
  .trow .a-lbl{ font-size:8px; letter-spacing:.24em; color:var(--ink-dim); }
  .trow .a-line{ flex:1; height:1px; background:var(--hairline); }
  .trow .a-state{ font-size:8px; letter-spacing:.2em; color:var(--accent); }
  .trow.off .a-state{ color:var(--ink-faint); }
  .trow.dim{ opacity:.35; cursor:not-allowed; }

  /* スライダー */
  .ctl{ display:flex; align-items:center; gap:12px; padding:6px 0; }
  .ctl label{
    font-size:8px; letter-spacing:.24em; color:var(--ink-dim); width:58px; flex:none;
  }
  .ctl .val{
    font-size:8px; letter-spacing:.1em; color:var(--ink-faint); width:30px;
    text-align:right; flex:none; font-variant-numeric:tabular-nums;
  }
  .ctl input[type=range]{
    -webkit-appearance:none; appearance:none; flex:1; min-width:0; height:18px;
    background:transparent; cursor:pointer;
  }
  .ctl input[type=range]::-webkit-slider-runnable-track{
    height:1px; background:var(--ink-faint);
  }
  .ctl input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:9px; height:9px; margin-top:-4px;
    border-radius:50%; background:var(--bg); border:1px solid var(--accent);
  }
  .ctl input[type=range]::-moz-range-track{ height:1px; background:var(--ink-faint); }
  .ctl input[type=range]::-moz-range-thumb{
    width:7px; height:7px; border-radius:50%;
    background:var(--bg); border:1px solid var(--accent);
  }
  .ctl.dim{ opacity:.35; pointer-events:none; }

  /* ボタン行 */
  .btn-row{ display:flex; border:1px solid var(--hairline); }
  .btn-row button{
    flex:1; padding:9px 0; background:transparent; border:none;
    border-right:1px solid var(--hairline);
    font-family:var(--sans); font-size:8.5px; letter-spacing:.22em;
    color:var(--ink-dim); cursor:pointer;
    transition:color .25s, background .25s, opacity .25s;
  }
  .btn-row button:last-child{ border-right:none; }
  .btn-row button:hover:not(:disabled){ color:var(--ink); background:rgba(128,160,190,.07); }
  .btn-row button:disabled{ opacity:.28; cursor:default; }
  #btnRec.recording{ color:var(--rec); }
  #btnRec.recording::before{
    content:"●"; font-size:7px; margin-right:5px;
    animation:pulse 1.6s ease-in-out infinite;
  }
  #btnCruise.running{ color:var(--accent); }
  #btnCruise.running::before{
    content:"●"; font-size:7px; margin-right:5px;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.25} }

  .keys{
    margin-top:14px; font-size:7.5px; letter-spacing:.16em;
    color:var(--ink-faint); text-align:center;
  }

  /* ---------- バッジ類 ---------- */
  #recBadge, #cruiseBadge{
    position:fixed; left:30px; z-index:20;
    font-size:9px; letter-spacing:.28em;
    font-variant-numeric:tabular-nums;
    opacity:0; transition:opacity .4s; pointer-events:none;
  }
  #recBadge{ bottom:26px; color:var(--rec); }
  #cruiseBadge{ bottom:48px; color:var(--accent); }
  #recBadge.on, #cruiseBadge.on{ opacity:1; }
  #recBadge::before, #cruiseBadge::before{
    content:"●"; font-size:7px; margin-right:8px;
    animation:pulse 1.6s ease-in-out infinite;
  }

  /* ---------- コードネーム / トースト ---------- */
  #chordName{
    position:fixed; right:30px; bottom:24px; z-index:20;
    font-family:var(--serif); font-size:14px; font-style:italic;
    letter-spacing:.22em; color:var(--ink-dim);
    opacity:0; transition:opacity .9s; pointer-events:none;
  }
  #chordName.on{ opacity:.85; transition:opacity .25s; }
  #toast{
    position:fixed; left:50%; bottom:84px; transform:translateX(-50%); z-index:20;
    font-family:var(--serif); font-style:italic; font-size:12px;
    letter-spacing:.3em; color:var(--ink-dim); white-space:nowrap;
    opacity:0; transition:opacity 1.2s; pointer-events:none;
  }
  #toast.on{ opacity:.9; transition:opacity .4s; }

  /* ---------- 誘い文・フッター ---------- */
  #hint{
    position:fixed; left:50%; bottom:52px; transform:translateX(-50%);
    font-size:9px; letter-spacing:.42em; color:var(--ink-dim);
    white-space:nowrap; pointer-events:none;
    animation:breathe 5s ease-in-out infinite;
    transition:opacity 1.6s;
  }
  #hint.gone{ animation:none; opacity:0; }
  @keyframes breathe{ 0%,100%{opacity:.55} 50%{opacity:.95} }

  #footerBtn{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:20;
    background:none; border:none; cursor:pointer;
    font-family:var(--sans); font-size:8.5px; letter-spacing:.3em;
    color:var(--ink-faint); transition:color .3s;
  }
  #footerBtn:hover{ color:var(--ink); }

  /* ---------- 版情報ダイアログ ---------- */
  #verModal, #modeConfirm{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.35);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  #verModal[hidden], #modeConfirm[hidden]{ display:none; }
  .vm-card{
    width:min(420px, calc(100vw - 48px));
    background:var(--panel-bg); border:1px solid var(--hairline);
    -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px);
    padding:28px 26px 22px; color:var(--ink);
  }
  .vm-card h3{
    font-family:var(--serif); font-style:italic; font-weight:400;
    font-size:16px; letter-spacing:.28em;
  }
  .vm-ver{ margin-top:8px; font-size:9px; letter-spacing:.24em; color:var(--ink-dim); }
  .vm-hist{ margin-top:18px; list-style:none; }
  .vm-hist li{
    padding:9px 0; border-top:1px solid var(--hairline);
    font-size:10.5px; line-height:1.8; color:var(--ink-dim); letter-spacing:.04em;
  }
  .vm-hist li b{ color:var(--ink); font-weight:500; letter-spacing:.12em; margin-right:8px; }
  .vm-close{
    margin-top:18px; width:100%; padding:9px 0;
    background:transparent; border:1px solid var(--hairline);
    font-family:var(--sans); font-size:8.5px; letter-spacing:.26em;
    color:var(--ink-dim); cursor:pointer; transition:color .25s;
  }
  .vm-close:hover{ color:var(--ink); }
  .vm-more{
    width:100%; padding:7px 0; background:transparent; border:none;
    font-family:var(--sans); font-size:8px; letter-spacing:.24em;
    color:var(--ink-faint); cursor:pointer; transition:color .25s;
  }
  .vm-more:hover{ color:var(--ink); }
  .mc-card{
    width:min(360px, calc(100vw - 48px));
    background:var(--panel-bg); border:1px solid var(--hairline);
    -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px);
    padding:25px 24px 20px; color:var(--ink);
  }
  .mc-card p{ font-size:12px; line-height:1.9; letter-spacing:.08em; text-align:center; }
  .mc-actions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:20px; }
  .mc-actions button{
    padding:9px 0; background:transparent; border:1px solid var(--hairline);
    font-family:var(--sans); font-size:9px; letter-spacing:.24em;
    color:var(--ink-dim); cursor:pointer; transition:color .25s, border-color .25s;
  }
  .mc-actions button:hover{ color:var(--ink); border-color:var(--ink-faint); }

  /* ---------- 読み物オーバーレイ（journal / about） ---------- */
  .reader{
    position:fixed; inset:0; z-index:15; overflow-y:auto;
    background:var(--reader-bg);
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    padding:112px 26px 90px;
    -webkit-user-select:text; user-select:text;
  }
  .reader[hidden]{ display:none; }
  .paper{ max-width:620px; margin:0 auto; }
  .paper h2{
    font-family:var(--serif); font-weight:400; font-size:17px;
    letter-spacing:.24em; color:var(--ink); margin:44px 0 16px;
  }
  .paper h2:first-child{ margin-top:0; }
  .paper p{
    font-size:12.5px; line-height:2.15; color:var(--ink);
    letter-spacing:.04em; margin-bottom:14px;
  }
  .paper .lead{
    font-family:var(--serif); font-style:italic; font-size:13.5px;
    color:var(--ink-dim); line-height:2.2;
  }
  .paper .note{ font-size:10.5px; color:var(--ink-dim); line-height:2; }
  .paper ul{ margin:0 0 14px 1.2em; }
  .paper li{
    font-size:12px; line-height:2.1; color:var(--ink); letter-spacing:.04em;
  }
  .paper a{ color:var(--accent); text-decoration:none; border-bottom:1px solid var(--hairline); }

  @media (max-width:640px){
    #brand{ top:18px; left:18px; }
    #brand h1{ font-size:13px; }
    #brand .sub{ display:none; }
    #tabs{ top:64px; gap:18px; }
    #tabs .tab{ font-size:9px; letter-spacing:.2em; }
    #panel{ width:202px; right:16px; top:100px; max-height:calc(100vh - 120px); max-height:calc(100dvh - 120px); }
    #panelToggle{ top:16px; right:16px; }
    #hint{ bottom:48px; letter-spacing:.3em; }
    #recBadge{ left:20px; bottom:18px; }
    #cruiseBadge{ left:20px; bottom:38px; }
    #chordName{ right:18px; bottom:16px; font-size:12px; }
    #footerBtn{ bottom:14px; }
    .reader{ padding:128px 20px 80px; }
  }
</style>
</head>
<body>

<canvas id="view"></canvas>
<div id="vignette"></div>

<button id="brand" aria-label="home">
  <h1>ripple-garden</h1>
  <span class="sub" id="brandSub">波紋の庭 — GENERATIVE WATER INSTRUMENT · V007</span>
</button>

<nav id="tabs">
  <button class="tab on" data-tabv="garden">garden</button>
  <button class="tab" data-tabv="journal">journal</button>
  <button class="tab" data-tabv="about">ripple-garden</button>
</nav>

<button id="panelToggle" aria-label="controls"><i></i></button>

<aside id="panel">
  <div class="sec">
    <div class="sec-label">MODE</div>
    <div class="mode-segments" role="group" aria-label="mode group">
      <button id="modeNormal" class="active" type="button">NORMAL</button>

    journal: `
<h2>journal — small notes on water & ambient sound</h2>
<p class="lead">Why do we leave rain sounds playing for hours? A short walk through the culture of endlessly sounding water behind ripple-garden.</p>
<h2>Noise has colours</h2>
<p>Sound containing all frequencies equally is white noise. Tilt the spectrum toward the lows and you get pink noise; sink it deeper and it becomes brown noise — the heavy, soft wash of waterfalls, downpours and aircraft cabins. The BOWL mode of ripple-garden feeds brown noise through high-resonance filters to create the voice of a rubbed glass bowl.</p>
<h2>Why ambient sound feels good</h2>
<p>Steady ambient sound is reported to mask sudden noises, which can help focus and sleep. Many natural sounds also live between order and chance — the so-called 1/f fluctuation — gently releasing attention. Effects vary from person to person; nothing here is universal. Yet the habit of filling a room with water sound exists everywhere.</p>
<h2>A chronicle of water sound</h2>
<ul>
<li>Edo period — shishi-odoshi and suikinkutsu in Japanese gardens: devices built to admire the echo of a drop.</li>
<li>1917 — Satie's “furniture music”: music to exist in, not to listen to.</li>
<li>1978 — Brian Eno, <i>Music for Airports</i>. Ambient gets its name.</li>
<li>1980s — Japanese kankyō ongaku; Hiroshi Yoshimura and quiet music for spaces.</li>
<li>2010s — eight-hour rain, ten-hour waves on YouTube. Long-form ambience becomes a companion.</li>
<li>2017 — lo-fi hip hop radio: music that never stops becomes everyday furniture.</li>
</ul>
<h2>The invention of length</h2>
<p>Ambient videos are valuable because they do not end. Not five beautiful minutes, but ninety minutes of presence. Cruise mode is a self-generating version of that: from five minutes to two hours, or forever, the water plays itself. Light up shuffle and modes and progressions slowly trade places.</p>
<p class="note">※ Keep the volume low. Effects vary; this is cultural history, not medical advice.</p>`,

<li><strong>BROWN (brun)</strong> — un « rrr » grave, une rumeur qui enveloppe. Au-delà de la concentration et du sommeil, il peut apaiser l'esprit quand l'anxiété ou un cœur qui s'emballe tire l'attention. Montez BASS pour amener le sub de 48 Hz et du corps (casque recommandé).</li>
</ul>
<p class="note">※ Choisir un mode de bruit abaisse automatiquement le volume à ~10 % (pour éviter la surprise depuis les modes normaux). Remontez-le avec VOLUME. Le mode aléatoire ne choisit jamais un bruit. Les effets varient selon les personnes.</p>
<h2>à propos de sirop</h2>
<p>sirop cultive un OS de mémoire externe et construit de petits terrains de jeu web avec quatre agents IA (Kou/Codex, Sol/Cursor, Kuu/Claude Code, Rabi/Antigravity). Une série de « petits mondes à toucher » en un seul fichier : gem-cosmos, shima-shima et ripple-garden. La première implémentation est de Kuu / Claude Code (Ultracode).</p>
<p class="note"><a href="https://github.com/sirop-d" target="_blank" rel="noopener">github.com/sirop-d</a></p>`,
  },
};

/* ---------- 共有状態 ---------- */
const state = {
  modeIdx: 0, genreIdx: 0, assist: true, sustain: false,
  life: 1, speed: 1, reflect: .75, volume: .75,
  lastTapTime: 0,
  tab: "garden",
  lang: "ja", theme: "system",
  cruiseMin: 30,
  // NOISE TONE: 持続ノイズベッドの3バンドつまみ（単位 dB）。低=体・中=厚み・高=シャー
  noiseBass: 4, noiseMid: 0, noiseTreble: -3,
  _volBeforeNoise: null, // 通常音→ノイズで音量を絞る前の値（戻すとき用）
  _shuffleBeforeNoise: null, // NOISEへ入る前のSHUFFLE状態（NORMAL復帰時に戻す）
  autoCleanMin: 120, // 長時間運用で蓄積を掃除する自動クリーンアップ間隔（分）。0で無効
};
const mode = () => MODES[state.modeIdx];
const genre = () => GENRES[state.genreIdx];
const T = () => I18N[state.lang];

/* ---------- 4. ハーモニーとアシスト ---------- */
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
const ladderCache = new Map();

/* FREE時: モード固有のペンタトニック梯子（2オクターブ） */
function modeLadder(m){
  const key = "mode:" + m.id;
  if (ladderCache.has(key)) return ladderCache.get(key);
  const out = [];
  for (let oct = 0; oct < 2; oct++)
    for (const s of m.scale) out.push(midiHz(m.root + s + oct * 12));
  out.push(midiHz(m.root + 24));
  ladderCache.set(key, out);
  return out;
}

/* 和声時: 画面X位置のコードを ±1オクターブに展開した梯子 */
function chordLadder(g, col, shift){
  const key = g.id + ":" + col + ":" + shift;
  if (ladderCache.has(key)) return ladderCache.get(key);
  const set = new Set();
  for (const o of [-12, 0, 12])
    for (const n of g.prog[col]) set.add(n + o + shift);
  const out = [...set].sort((a, b) => a - b).map(midiHz);
  ladderCache.set(key, out);
  return out;
}

function columnAt(x01){
  const g = genre();
  if (!g.prog) return -1;
  return Math.max(0, Math.min(g.prog.length - 1, Math.floor(x01 * g.prog.length)));
}

function currentLadder(x01){
  const g = genre();
  if (!g.prog) return modeLadder(mode());
  return chordLadder(g, columnAt(x01), mode().octShift);
}

/* 旋律メモリ: アシストONのとき直前の音から大跳躍しないように歩く */
const melody = { idx: null, t: 0 };

/* 音高決定。arpStep を渡すとストローク用に梯子を1段ずつ歩く（分散和音） */
function pitchAt(x01, y01, arpStep){
  const lad = currentLadder(x01);
  let idx;
  if (arpStep !== undefined && melody.idx !== null){
    idx = melody.idx + arpStep;
    if (idx >= lad.length) idx = lad.length - 2; // 端で折り返す
    if (idx < 0) idx = 1;
  } else {
    idx = Math.round((1 - y01) * (lad.length - 1));
    // アシスト: 4秒以内の連続入力は跳躍を±4段に抑え、旋律線をなめらかに
    if (state.assist && melody.idx !== null && performance.now() - melody.t < 4000){
      const J = 4;
      idx = Math.max(melody.idx - J, Math.min(melody.idx + J, idx));
    }
  }
  idx = Math.max(0, Math.min(lad.length - 1, idx));
  // 違和感の匙加減: ごく稀に隣の段へ滑る。完全な正しさは退屈の入口
  const fr = state.assist ? 0 : (genre().friction || 0); // ONでは違和感ゼロ
  if (fr && arpStep === undefined && Math.random() < fr){
    idx = Math.max(0, Math.min(lad.length - 1, idx + (Math.random() < .5 ? -1 : 1)));
  }
  melody.idx = idx; melody.t = performance.now();
  let f = lad[idx];
  const m = mode();
  if (!state.assist && m.jitter) f *= Math.pow(2, (Math.random() * 2 - 1) * m.jitter / 1200);
  return f;
}

/* 任意周波数を現在の梯子の最寄り音へ吸着（干渉音の濁り防止） */
function nearestTone(f, lad){
  let best = lad[0], d = Infinity;
  for (const t of lad){
    const dd = Math.abs(Math.log(t / f));
    if (dd < d){ d = dd; best = t; }
  }
  return best;
}

function resetMelody(){ melody.idx = null; melody.t = 0; }

/* ---------- 5. 水面シミュレーション ---------- */
const sim = { w:0, h:0, cell:4, cur:null, prev:null, canvas:null, ctx:null, img:null };
const view = document.getElementById("view");
const vctx = view.getContext("2d");
let DPR = 1, VW = 0, VH = 0;

function setupSim(){
  VW = window.innerWidth; VH = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  view.width = Math.round(VW * DPR);
  view.height = Math.round(VH * DPR);

  // セルサイズ: 端末負荷に合わせて格子数を約16万セル以下に抑える
  let cell = Math.min(VW, VH) > 760 ? 3 : 4;
  while ((VW / cell) * (VH / cell) > 160000) cell++;
  sim.cell = cell;
  sim.w = Math.max(8, Math.round(VW / cell));
  sim.h = Math.max(8, Math.round(VH / cell));
  sim.cur = new Float32Array(sim.w * sim.h);
  sim.prev = new Float32Array(sim.w * sim.h);
  sim.canvas = document.createElement("canvas");
  sim.canvas.width = sim.w; sim.canvas.height = sim.h;
  sim.ctx = sim.canvas.getContext("2d");
  sim.img = sim.ctx.createImageData(sim.w, sim.h);
  const d = sim.img.data;
  for (let i = 3; i < d.length; i += 4) d[i] = 255; // アルファ不透明固定
}

/* ガウス型の盛り上がりを水面に落とす（負方向 = 水を押し下げる） */
function injectImpulse(cssX, cssY, amp, radiusCells){
  const cx = cssX / sim.cell, cy = cssY / sim.cell;
  const r = radiusCells, r2 = r * r;
  const x0 = Math.max(1, Math.floor(cx - r)), x1 = Math.min(sim.w - 2, Math.ceil(cx + r));
  const y0 = Math.max(1, Math.floor(cy - r)), y1 = Math.min(sim.h - 2, Math.ceil(cy + r));
  for (let y = y0; y <= y1; y++){
    for (let x = x0; x <= x1; x++){
      const dx = x - cx, dy = y - cy, d2 = dx * dx + dy * dy;
      if (d2 < r2) sim.cur[y * sim.w + x] -= amp * Math.exp(-d2 / (r2 * .35));
    }
  }
}

/* フェードクリア: 光も音もゆっくり落としてから払う（バチッと暗転させない） */
const fadeClear = { active:false, t0:0, dur:1300 };
let lastAutoClean = 0; // 最後にクリーンアップした時刻（自動クリーンのタイマー基準）
function clearWater(){
  if (fadeClear.active) return;
  fadeClear.active = true; fadeClear.t0 = performance.now();
  lastAutoClean = performance.now(); // 手動・自動どちらのクリアでもタイマーを仕切り直す
  audio.fadeTo(0, .9);
}
function finishClear(){
  sim.cur.fill(0); sim.prev.fill(0);
  ripples.length = 0; glows.length = 0;
  resetMelody();
  fadeClear.active = false;
  audio.fadeTo(state.volume, 1.1); // 音を静かに戻す
}

/* 1ステップ進める。prevに次状態を書き込み、最後にバッファ交換 */
function stepField(){
  const W = sim.w, H = sim.h;
  const m = mode();
  const c2 = Math.min(.47, m.c2 * state.speed * state.speed);
  let damp = 1 - (m.k / state.life);
  if (fadeClear.active) damp *= .90; // 光のフェードアウト
  const cur = sim.cur, nxt = sim.prev;

  for (let y = 1; y < H - 1; y++){
    let i = y * W + 1;
    for (let x = 1; x < W - 1; x++, i++){
      const lap = cur[i-1] + cur[i+1] + cur[i-W] + cur[i+W] - 4 * cur[i];
      nxt[i] = (2 * cur[i] - nxt[i] + c2 * lap) * damp;
    }
  }

  // 端: ミラー境界（反射）。REFLECT が低いほど吸収帯で波を消す
  const refl = state.reflect;
  for (let x = 0; x < W; x++){
    nxt[x] = nxt[x + W] * refl;
    nxt[(H-1)*W + x] = nxt[(H-2)*W + x] * refl;
  }
  for (let y = 0; y < H; y++){
    nxt[y*W] = nxt[y*W + 1] * refl;
    nxt[y*W + W-1] = nxt[y*W + W-2] * refl;
  }
  const absorb = (1 - refl) * .32;
  if (absorb > .003){
    const B = 12;
    for (let b = 0; b < B; b++){
      const g = 1 - absorb * Math.pow(1 - b / B, 2);
      const yT = b * W, yB = (H-1-b) * W;
      for (let x = 0; x < W; x++){ nxt[yT + x] *= g; nxt[yB + x] *= g; }
      for (let y = 0; y < H; y++){ nxt[y*W + b] *= g; nxt[y*W + W-1-b] *= g; }
    }
  }

  sim.prev = cur; sim.cur = nxt;
}

/* ---------- 6. 描画 ---------- */
const glows = []; // {x, y, t0, str, col, life, r}

/* パレット補間 — モード切替やシャッフルで水の色がゆっくり変わる */
const pal = {
  base:[...MODES[0].base], crest:[...MODES[0].crest], trough:[...MODES[0].trough],
  lbase:[...MODES[0].lbase], hg:MODES[0].heightGain, sg:MODES[0].shadeGain,
};
function lerpPalette(){
  const m = mode(), k = .045;
  for (let i = 0; i < 3; i++){
    pal.base[i]   += (m.base[i]   - pal.base[i])   * k;
    pal.crest[i]  += (m.crest[i]  - pal.crest[i])  * k;
    pal.trough[i] += (m.trough[i] - pal.trough[i]) * k;
    pal.lbase[i]  += (m.lbase[i]  - pal.lbase[i])  * k;
  }
  pal.hg += (m.heightGain - pal.hg) * k;
  pal.sg += (m.shadeGain - pal.sg) * k;
}

function isLight(){ return document.documentElement.dataset.theme === "light"; }

function renderField(now){
  const W = sim.w, H = sim.h, cur = sim.cur, d = sim.img.data;
  const light = isLight();
  // ごく弱い時間揺らぎ — 水面の明度がゆっくり呼吸する
  const breathe = 1 + .04 * Math.sin(now * .00021);
  const hg = pal.hg * breathe, sg = pal.sg;
  const [bR, bG, bB] = pal.base, [cR, cG, cB] = pal.crest, [tR, tG, tB] = pal.trough;
  const [lR, lG, lB] = pal.lbase;

  let i = 0, p = 0;
  for (let y = 0; y < H; y++){
    const yu = y > 0 ? -W : 0, yd = y < H - 1 ? W : 0;
    for (let x = 0; x < W; x++, i++, p += 4){
      const h = cur[i];
      let v = h * hg + (cur[i + yu] - cur[i + yd]) * sg;
      v = v / (1 + Math.abs(v) * .0055); // ソフトクリップ
      if (light){
        // ライト: 明るい水面に波が青く影を落とす
        if (v > 0){
          const a = v * .0085;
          d[p] = lR - cR * a; d[p+1] = lG - cG * a; d[p+2] = lB - cB * a;
        } else {
          const a = v * -.004;
          d[p] = lR + (255 - lR) * a; d[p+1] = lG + (255 - lG) * a; d[p+2] = lB + (255 - lB) * a;
        }
      } else {
        if (v > 0){
          const a = v * .01;
          d[p] = bR + cR * a; d[p+1] = bG + cG * a; d[p+2] = bB + cB * a;
        } else {
          const a = v * .009;
          d[p] = bR + tR * a; d[p+1] = bG + tG * a; d[p+2] = bB + tB * a;
        }
      }
    }
  }
  sim.ctx.putImageData(sim.img, 0, 0);

  vctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  vctx.imageSmoothingEnabled = true;
  vctx.imageSmoothingQuality = "high";
  vctx.clearRect(0, 0, VW, VH);
  vctx.drawImage(sim.canvas, 0, 0, VW, VH);

  // 発光点（ダーク=加算で光る / ライト=乗算で青く滲む）
  vctx.globalCompositeOperation = light ? "multiply" : "lighter";
  for (let g = glows.length - 1; g >= 0; g--){
    const gl = glows[g];
    const age = (now - gl.t0) / 1000;
    if (age > gl.life){ glows.splice(g, 1); continue; }
    const k = 1 - age / gl.life;
    const rad = gl.r + (1 - k) * gl.r * 2.2;
    const colStr = light ? "70,105,150" : gl.col;
    const grad = vctx.createRadialGradient(gl.x, gl.y, 0, gl.x, gl.y, rad);
    grad.addColorStop(0, `rgba(${colStr}, ${(.28 * k * k * gl.str).toFixed(3)})`);
    grad.addColorStop(1, light ? "rgba(255,255,255,0)" : "rgba(0,0,0,0)");
    vctx.fillStyle = grad;
    vctx.beginPath();
    vctx.arc(gl.x, gl.y, rad, 0, Math.PI * 2);
    vctx.fill();
  }
  vctx.globalCompositeOperation = "source-over";
}

function addGlow(x, y, str, col, life, r){
  glows.push({ x, y, t0: performance.now(), str, col: col || "190,225,255", life: life || .7, r: r || 13 });
  if (glows.length > 48) glows.shift();
}

/* ---------- 7. 波紋イベント検出 ---------- */
let rippleSeq = 0;
const ripples = []; // {id, x, y, born, r, freq, e0, walls, met}

function registerRipple(x, y, freq, e0){
  ripples.push({ id: rippleSeq++, x, y, born: performance.now(), r: 0,
                 freq, e0, walls: [false, false, false, false], met: new Set() });
  if (ripples.length > 24) ripples.shift();
}

function updateRipples(dtMs, now){
  const m = mode();
  const c2 = Math.min(.47, m.c2 * state.speed * state.speed);
  const pxPerMs = Math.sqrt(c2) * m.sub * sim.cell * 60 / 1000;
  const tau = (m.decay + 1.6) * state.life * 1000;

  for (let i = ripples.length - 1; i >= 0; i--){
    const rp = ripples[i];
    rp.r += pxPerMs * dtMs;
    const age = now - rp.born;
    const e = rp.e0 * Math.exp(-age / tau);
    if (age > tau * 2.5 || e < .02){ ripples.splice(i, 1); continue; }

    const dists = [rp.x, VW - rp.x, rp.y, VH - rp.y];
    for (let w = 0; w < 4; w++){
      if (!rp.walls[w] && rp.r >= dists[w]){
        rp.walls[w] = true;
        if (state.reflect > .05) audio.reflect(rp, w, e);
      }
    }
  }

  for (let i = 0; i < ripples.length; i++){
    for (let j = i + 1; j < ripples.length; j++){
      const a = ripples[i], b = ripples[j];
      if (a.met.has(b.id)) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 1 && a.r + b.r >= dist){
        a.met.add(b.id);
        const k = a.r / (a.r + b.r);
        const px = a.x + dx * k, py = a.y + dy * k;
        const eA = a.e0 * Math.exp(-(now - a.born) / 4000);
        const eB = b.e0 * Math.exp(-(now - b.born) / 4000);
        const str = Math.min(1, eA * eB * 2);
        if (str > .05){
          audio.interfere(a.freq, b.freq, px / VW, str);
          addGlow(px, py, str * .8, "205,220,255", 1.1, 17);
        }
      }
    }
  }
}

/* ---------- 8. サウンドエンジン ---------- */
const audio = (() => {
  let ctx = null, master = null, limiter = null, dry = null, verb = null, wet = null;
  let recNode = null, noiseBuf = null, brownBuf = null, pinkBuf = null;
  let voices = 0; const MAXV = 40;
  let lastInter = 0;

  // 持続ノイズベッド（CRUISE中にノイズモードで鳴る連続ドローン）
  let bedLow = null, bedMid = null, bedHigh = null, bedGain = null;
  let bedSrcs = [], bedSub = null, bedColor = null;
  // 色ごとの基準音量（素材バッファのRMSが色で大きく違うため補正）。つまみと音量で微調整可
  const BED_LEVEL = { white: .42, pink: 1.5, brown: .7 };

  function ensure(){
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return true; }
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();

      master = ctx.createGain();
      master.gain.value = Math.pow(state.volume, 1.5);
      limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -14; limiter.knee.value = 18;
      limiter.ratio.value = 7; limiter.attack.value = .004; limiter.release.value = .24;

      dry = ctx.createGain(); dry.gain.value = 1;
      verb = ctx.createConvolver(); verb.buffer = makeIR(3.6, 2.4);
      wet = ctx.createGain(); wet.gain.value = .9;

      dry.connect(master);
      verb.connect(wet); wet.connect(master);
      master.connect(limiter); limiter.connect(ctx.destination);

      // ホワイトノイズ（飛沫・反射・持続ベッド）とブラウンノイズ（グラスボウル）の素材
      // ベッドで連続ループするため3秒に延ばし、ループの周期感を目立ちにくくする
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 3, ctx.sampleRate);
      const nd = noiseBuf.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

      brownBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const bd = brownBuf.getChannelData(0);
      let bv = 0;
      for (let i = 0; i < bd.length; i++){
        bv = (bv + .02 * (Math.random() * 2 - 1)) / 1.02;
        bd[i] = bv * 3.5;
      }

      // ピンクノイズ（Paul Kelletの近似フィルタ）
      pinkBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const pd = pinkBuf.getChannelData(0);
      let p0 = 0, p1 = 0, p2 = 0;
      for (let i = 0; i < pd.length; i++){
        const w = Math.random() * 2 - 1;
        p0 = .99765 * p0 + w * .0990460;
        p1 = .96300 * p1 + w * .2965164;
        p2 = .57000 * p2 + w * 1.0526913;
        pd[i] = (p0 + p1 + p2 + w * .1848) * .18;
      }

      // 持続ノイズベッドの3バンドEQ（低=ローシェルフ / 中=ピーキング / 高=ハイシェルフ）
      bedLow  = ctx.createBiquadFilter(); bedLow.type  = "lowshelf";  bedLow.frequency.value  = 220;
      bedMid  = ctx.createBiquadFilter(); bedMid.type  = "peaking";   bedMid.frequency.value  = 1000; bedMid.Q.value = .8;
      bedHigh = ctx.createBiquadFilter(); bedHigh.type = "highshelf"; bedHigh.frequency.value = 3500;
      bedGain = ctx.createGain(); bedGain.gain.value = .0001;
      bedLow.connect(bedMid); bedMid.connect(bedHigh); bedHigh.connect(bedGain);
      bedGain.connect(dry);
      noiseBedSetEQ();

      setupRecorderTap();
      return true;
    } catch(e){ console.warn("audio init failed:", e); return false; }
  }

  function makeIR(seconds, decayPow){
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++){
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++){
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decayPow);
      }
    }
    return buf;
  }

  /* マスター音量をなめらかに動かす（クリア・クルーズのフェード共用） */
  function fadeTo(vol01, sec){
    if (!ctx) return;
    const g = master.gain, now = ctx.currentTime;
    const target = Math.max(.0001, Math.pow(Math.max(0, vol01), 1.5));
    g.cancelScheduledValues(now);
    g.setValueAtTime(Math.max(.0001, g.value), now);
    if (sec <= 0) g.setValueAtTime(target, now);
    else g.linearRampToValueAtTime(target, now + sec);
  }

  function voiceOut(pan, send, lifeSec){
    const g = ctx.createGain();
    const chain = [g];
    let tail = g;
    if (ctx.createStereoPanner){
      const p = ctx.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, pan));
      g.connect(p); tail = p; chain.push(p);
    }
    tail.connect(dry);
    if (send > 0){
      const s = ctx.createGain(); s.gain.value = send;
      tail.connect(s); s.connect(verb); chain.push(s);
    }
    // 発音とリバーブ残響が完全に終わった後にノードを切断して解放する。
    // 長時間運用で voiceOut のゲイン/パンナーが dry へ繋ぎっぱなしに蓄積し、
    // メモリ/CPUを圧迫してページが固まるのを防ぐ。リバーブIRぶん（約3.6秒）＋余白を見込む。
    if (lifeSec > 0){
      setTimeout(() => { for (const n of chain){ try { n.disconnect(); } catch(e){} } },
                 (lifeSec + 5) * 1000);
    }
    return g;
  }

  function envGain(out, peak, attack, decay, t){
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(Math.max(.0001, peak), t + attack);
    g.gain.exponentialRampToValueAtTime(.0001, t + attack + decay);
    g.connect(out);
    return g;
  }

  function countVoice(node){
    voices++;
    node.onended = () => { voices = Math.max(0, voices - 1); };
  }

  function osc(type, freq, t, stopAt){
    const o = ctx.createOscillator();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    o.start(t); o.stop(stopAt);
    countVoice(o);
    return o;
  }

  /* グラスボウル声部: ブラウンノイズ → 高Q共鳴 = 擦られたガラスの鉢 */
  function bowlVoice(out, f, strength, decay, t, m){
    for (const [ratio, vol] of m.partials){
      const src = ctx.createBufferSource();
      src.buffer = brownBuf; src.loop = true;
      src.playbackRate.value = .96 + Math.random() * .08;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = Math.min(9000, f * ratio);
      bp.Q.value = 38;
      const dur = decay * (1 + ratio * .04);
      const g = envGain(out, vol * m.bellMix * strength * .6, .28, dur, t);
      src.connect(bp); bp.connect(g);
      src.start(t); src.stop(t + dur + .8);
      countVoice(src);
    }
    const g = envGain(out, .05 * strength, .005, .8, t);
    osc("sine", f, t, t + 1.2).connect(g);
  }

  /* ノイズ声部: 色付きノイズ → 共鳴フィルタ = 音程を持つ風 */
  function noiseVoice(out, f, strength, decay, t, m){
    const buf = m.noise === "pink" ? pinkBuf : m.noise === "brown" ? brownBuf : noiseBuf;
    for (const [ratio, vol, q] of [[1, 1, 24], [2, .3, 18]]){
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.playbackRate.value = .97 + Math.random() * .06;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = Math.min(9500, f * ratio);
      bp.Q.value = q;
      const g = envGain(out, vol * strength * .7, .04, decay, t);
      src.connect(bp); bp.connect(g);
      src.start(t); src.stop(t + decay + .6);
      countVoice(src);
    }
    // 空気のベッド: フィルタの外側をごく薄く
    const src2 = ctx.createBufferSource(); src2.buffer = buf; src2.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1200;
    const g2 = envGain(out, .025 * strength, .05, decay * .8, t);
    src2.connect(lp); lp.connect(g2);
    src2.start(t); src2.stop(t + decay);
    countVoice(src2);
  }

  /* ---------- 持続ノイズベッド ----------
     従来のノイズは波紋ごとに減衰する音程付きの帯域音で、音圧が出なかった。
     ここでは選択中のノイズ色を広帯域のまま連続ループさせ、3バンドEQと
     （ブラウンのみ）サブ低音で「お腹に届く」連続ドローンを作る。 */
  function noiseBedSetEQ(){
    if (!bedLow) return;
    const now = ctx.currentTime;
    bedLow.gain.setTargetAtTime(state.noiseBass, now, .05);
    bedMid.gain.setTargetAtTime(state.noiseMid, now, .05);
    bedHigh.gain.setTargetAtTime(state.noiseTreble, now, .05);
  }

  function noiseBedClearSrcs(delay){
    const t = ctx.currentTime + Math.max(0, delay || 0);
    bedSrcs.forEach(s => { try { s.stop(t); } catch(e){} });
    bedSrcs = [];
    if (bedSub){ try { bedSub.stop(t); } catch(e){} bedSub = null; }
  }

  function noiseBedStart(m){
    if (!ctx || !bedGain) return;
    const color = m.noise; // "white" | "pink" | "brown"
    if (bedColor === color && bedSrcs.length) return; // 同じ色で既に鳴っていれば何もしない
    noiseBedClearSrcs(0); // 色替え時は旧ソースを止める
    bedColor = color;
    const buf = color === "pink" ? pinkBuf : color === "brown" ? brownBuf : noiseBuf;
    // 左右をわずかにデチューンして広がり＋ループの周期感をぼかす
    for (const [rate, pan] of [[.991, -.6], [1.009, .6]]){
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.playbackRate.value = rate;
      let node = src;
      if (ctx.createStereoPanner){
        const p = ctx.createStereoPanner(); p.pan.value = pan;
        src.connect(p); node = p;
      }
      node.connect(bedLow);
      src.start();
      bedSrcs.push(src);
    }
    // ブラウンだけ48Hzのサブ低音を薄く重ねて芯を補強（お腹に届く成分）
    if (color === "brown"){
      bedSub = ctx.createOscillator(); bedSub.type = "sine"; bedSub.frequency.value = 48;
      const sg = ctx.createGain(); sg.gain.value = .12;
      bedSub.connect(sg); sg.connect(bedLow);
      bedSub.start();
    }
    // フェードイン
    const now = ctx.currentTime, target = BED_LEVEL[color] || .5;
    bedGain.gain.cancelScheduledValues(now);
    bedGain.gain.setValueAtTime(Math.max(.0001, bedGain.gain.value), now);
    bedGain.gain.linearRampToValueAtTime(target, now + 2.5);
  }

  function noiseBedStop(fadeSec){
    if (!ctx || !bedGain || !bedSrcs.length) return;
    const s = fadeSec || 2.5, now = ctx.currentTime;
    bedGain.gain.cancelScheduledValues(now);
    bedGain.gain.setValueAtTime(Math.max(.0001, bedGain.gain.value), now);
    bedGain.gain.linearRampToValueAtTime(.0001, now + s);
    noiseBedClearSrcs(s + .1);
    bedColor = null;
  }

  /* 再生状態と現在モードからベッドの入切を決める。
     active = CRUISE が動いているか。ノイズモード以外、または停止中は消す。 */
  function syncNoiseBed(active, fadeSec){
    if (!ctx) return;
    const m = mode();
    if (active && m.voice === "noise") noiseBedStart(m);
    else noiseBedStop(fadeSec);
  }

  /* 波紋の発生音。ジャンルの tweak で音色にメリハリを付ける */
  function tap(x01, y01, strength, freq, light){
    if (!ensure() || voices > MAXV) return;
    const m = mode();
    const tw = genre().tweak || {};
    const f = freq || 440;
    const t = ctx.currentTime + .005;
    const pan = (x01 * 2 - 1) * .75;
    let decay = m.decay * (tw.decay || 1) * (0.75 + Math.random() * .5) * Math.min(state.life, 1.6);
    if (light) decay *= .45;
    if (state.sustain) decay *= 2.6; // SUSTAIN: ロングトーン
    // voiceOut には decay を渡して発音終了後にノードを解放させる（decay 確定後に呼ぶ）
    const out = voiceOut(pan, m.send * (tw.send || 1) * (light ? .7 : 1), decay + 1);
    const atk = m.atkOver || tw.atk || .004;

    // ローファイ等: 声部全体を柔らかくするローパス
    let tapOut = out;
    if (tw.lp){
      const lpf = ctx.createBiquadFilter();
      lpf.type = "lowpass"; lpf.frequency.value = tw.lp; lpf.Q.value = .7;
      lpf.connect(out); tapOut = lpf;
    }

    if (m.voice === "bowl" && !light){
      bowlVoice(tapOut, f, strength, decay, t, m);
    } else if (m.voice === "noise" && !light){
      noiseVoice(tapOut, f, strength, decay, t, m);
    } else {
      const parts = light ? m.partials.slice(0, 1) : m.partials;
      const bellAmp = light ? .07 : .14;
      for (const [ratio, vol] of parts){
        const g = envGain(tapOut, vol * m.bellMix * strength * bellAmp, atk,
                          decay * (1 - .25 * Math.log2(Math.max(1, ratio))), t);
        osc("sine", f * ratio, t, t + decay + .6).connect(g);
        // デチューンの双子（ロック・シティポップの厚み）
        if (tw.det && ratio === 1 && !light){
          const g2 = envGain(tapOut, vol * m.bellMix * strength * bellAmp * .5, atk, decay, t);
          osc("sine", f * Math.pow(2, tw.det / 1200), t, t + decay + .6).connect(g2);
        }
      }
      // サブ低音（ハウス・DnBの土台）
      if (tw.sub && !light){
        const g = envGain(tapOut, .06 * tw.sub * strength, .006, decay * .6, t);
        osc("sine", f * .5, t, t + decay + .4).connect(g);
      }
      // バチの打撃音（木琴の「コッ」・鉄琴の「チン」）
      if (m.knock && !light){
        const src = ctx.createBufferSource(); src.buffer = noiseBuf;
        const bp = ctx.createBiquadFilter();
        bp.type = "bandpass"; bp.frequency.value = Math.min(9000, f * 2.2); bp.Q.value = 1.6;
        const g = envGain(tapOut, .07 * m.knock * strength, .001, .045, t);
        src.connect(bp); bp.connect(g);
        src.start(t); src.stop(t + .1);
      }
    }
    // 水滴成分: 周波数が短く上がる "plip"
    if (m.dropMix > 0){
      const o = ctx.createOscillator();
      o.type = "sine";
      o.frequency.setValueAtTime(f * .5, t);
      o.frequency.exponentialRampToValueAtTime(f * 1.04, t + .06);
      const g = envGain(tapOut, .13 * m.dropMix * (tw.drop || 1) * strength * (light ? .7 : 1), .003, .16, t);
      o.connect(g); o.start(t); o.stop(t + .35);
      countVoice(o);
    }
    // 飛沫: 帯域ノイズの短い吐息
    if (m.splash > 0 && !light){
      const src = ctx.createBufferSource(); src.buffer = noiseBuf;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = Math.min(8000, f * 3.5); bp.Q.value = 5;
      const g = envGain(tapOut, .05 * m.splash * strength, .002, .14, t);
      src.connect(bp); bp.connect(g);
      src.start(t); src.stop(t + .25);
    }
  }

  /* 反射音: 壁側にパンした微かなチック */
  function reflect(rp, wall, e){
    if (!ensure() || voices > MAXV) return;
    const m = mode();
    if (m.voice === "noise") return; // ノイズモード中は音程付きの反射音を鳴らさない（環境音の邪魔・負荷削減）
    const t = ctx.currentTime + .005;
    const vol = e * state.reflect * m.reflGain * .07;
    if (vol < .003) return;
    const pan = wall === 0 ? -.8 : wall === 1 ? .8 : (rp.x / VW * 2 - 1) * .6;
    // 反射音は「いまそこにあるコード」へ吸着して跳ね返る
    const wx01 = wall === 0 ? .02 : wall === 1 ? .98 : rp.x / VW;
    let rf = rp.freq * 2.01;
    if (state.assist) rf = nearestTone(rf, currentLadder(wx01)); // ONは必ず心地良い音へ
    const out = voiceOut(pan, m.send * .7, 1);
    const g = envGain(out, vol, .003, .5, t);
    osc("sine", rf, t, t + .9).connect(g);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const hp = ctx.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 3000;
    const g2 = envGain(out, vol * .5, .002, .08, t);
    src.connect(hp); hp.connect(g2);
    src.start(t); src.stop(t + .15);
  }

  /* 干渉音: 二つの波の音をひとつの和音に。アシストON時は梯子へ吸着 */
  function interfere(f1, f2, x01, strength){
    if (!ensure() || voices > MAXV - 4) return;
    const now = performance.now();
    if (now - lastInter < 130) return;
    lastInter = now;
    const m = mode();
    const t = ctx.currentTime + .005;
    const pan = (x01 * 2 - 1) * .6;
    const base = strength * m.interGain;

    if (m.id === "resonance"){
      const out = voiceOut(pan, .65, 3);
      let third = (f1 + f2) / 2 * 1.5;
      if (state.assist) third = nearestTone(third, currentLadder(x01));
      for (const [f, v] of [[f1, .05], [f2, .05], [third, .02]]){
        const g = envGain(out, v * base, .22, 2.4, t);
        osc("sine", f * Math.pow(2, (Math.random() * 4 - 2) / 1200), t, t + 3).connect(g);
      }
    } else {
      let fm = (f1 + f2) / 2;
      if (state.assist) fm = nearestTone(fm, currentLadder(x01));
      const out = voiceOut(pan, m.send, 2);
      const g = envGain(out, .035 * base, .12, 1.5, t);
      osc("sine", fm, t, t + 2).connect(g);
    }
  }

  /* 録音タップ: limiter後 = 実際に聴こえる音をそのまま捕まえる */
  function setupRecorderTap(){
    try{
      recNode = ctx.createScriptProcessor(4096, 2, 2);
      recNode.onaudioprocess = (e) => {
        if (!rec.active) return;
        rec.L.push(new Float32Array(e.inputBuffer.getChannelData(0)));
        rec.R.push(new Float32Array(e.inputBuffer.getChannelData(1)));
        rec.len += e.inputBuffer.length;
      };
      limiter.connect(recNode);
      const sink = ctx.createGain(); sink.gain.value = 0;
      recNode.connect(sink); sink.connect(ctx.destination);
    } catch(e){ console.warn("recorder tap failed:", e); }
  }

  function setVolume(v){ if (master) fadeTo(v, .12); }
  function sampleRate(){ return ctx ? ctx.sampleRate : 44100; }
  function running(){ return !!ctx && ctx.state === "running"; }
  function sounding(){ return running() && (voices > 0 || bedSrcs.length > 0); }

  /* ページ離脱時の保険: 持続ベッドを止め、AudioContextを停止して音を残さない。
     （通常タブを閉じれば破棄されるが、bfcache等で残るケースへの備え） */
  function teardown(){
    try { noiseBedStop(0); } catch(e){}
    try { if (ctx && ctx.state === "running") ctx.suspend(); } catch(e){}
  }

  return { ensure, tap, reflect, interfere, setVolume, sampleRate, fadeTo,
           noiseBedSetEQ, syncNoiseBed, teardown, running, sounding };
})();

// ページを閉じる / 離脱するときに音を確実に止める
window.addEventListener("pagehide", () => { try { audio.teardown(); } catch(e){} });

/* ---------- 9. 録音と WAV 書き出し ---------- */
const rec = { active: false, L: [], R: [], len: 0, startedAt: 0 };

function recStart(){
  if (!audio.ensure()) return;
  rec.L = []; rec.R = []; rec.len = 0;
  rec.active = true; rec.startedAt = performance.now();
  ui.recState();
}
function recStop(){
  rec.active = false;
  ui.recState();
}
function recSave(){
  if (rec.active) recStop();
  if (rec.len === 0) return;
  const blob = encodeWav(rec.L, rec.R, rec.len, audio.sampleRate());
  const a = document.createElement("a");
  const ts = new Date(), p = n => String(n).padStart(2, "0");
  a.download = `ripple-garden_take_${ts.getFullYear()}${p(ts.getMonth()+1)}${p(ts.getDate())}_${p(ts.getHours())}${p(ts.getMinutes())}${p(ts.getSeconds())}.wav`;
  a.href = URL.createObjectURL(blob);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* Float32のチャンク列を16bitステレオPCMのWAVに変換 */
function encodeWav(chunksL, chunksR, totalLen, sampleRate){
  const buf = new ArrayBuffer(44 + totalLen * 4);
  const dv = new DataView(buf);
  const wstr = (off, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(off + i, s.charCodeAt(i)); };
  wstr(0, "RIFF"); dv.setUint32(4, 36 + totalLen * 4, true); wstr(8, "WAVE");
  wstr(12, "fmt "); dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true);
  dv.setUint16(22, 2, true);
  dv.setUint32(24, sampleRate, true);
  dv.setUint32(28, sampleRate * 4, true);
  dv.setUint16(32, 4, true);
  dv.setUint16(34, 16, true);
  wstr(36, "data"); dv.setUint32(40, totalLen * 4, true);

  let off = 44;
  for (let c = 0; c < chunksL.length; c++){
    const L = chunksL[c], R = chunksR[c];
    for (let i = 0; i < L.length; i++){
      let l = Math.max(-1, Math.min(1, L[i])), r = Math.max(-1, Math.min(1, R[i]));
      dv.setInt16(off, l < 0 ? l * 0x8000 : l * 0x7FFF, true); off += 2;
      dv.setInt16(off, r < 0 ? r * 0x8000 : r * 0x7FFF, true); off += 2;
    }
  }
  return new Blob([buf], { type: "audio/wav" });
}

/* ---------- 10. クルーズエンジン ---------- */
/* YouTubeの長尺環境音のように、水面がひとりで演奏を続ける。
   ジャンルのリズムパターン（16分×16歩）を刻み、小節ごとにコード列が進む */
const cruise = {
  on:false, stopping:false, loop:false, shuffle:false,
  t0:0, endAt:Infinity, nextStep:0, step:0, bar:0,
  y01:.5, nextFree:0, lastShuffle:0, runQueue:[],
};

function cruiseStart(){
  if (!audio.ensure() || cruise.on) return;
  cruise.on = true; cruise.stopping = false;
  cruise.t0 = performance.now();
  cruise.endAt = cruise.loop ? Infinity : cruise.t0 + state.cruiseMin * 60000;
  cruise.step = 0; cruise.bar = 0; cruise.y01 = .45 + Math.random() * .2;
  cruise.nextStep = cruise.t0 + 500;
  cruise.nextFree = cruise.t0 + 500;
  cruise.lastShuffle = cruise.t0;
  cruise.runQueue.length = 0;
  lastAutoClean = cruise.t0; // 自動クリーンのタイマーをクルーズ開始から数える
  audio.fadeTo(0, 0);
  audio.fadeTo(state.volume, 3); // 音のフェードイン
  audio.syncNoiseBed(true); // ノイズモードなら持続ベッドを立ち上げる
  ui.cruiseState();
  ui.dismissHint();
}

function cruiseStop(fadeSec){
  if (!cruise.on || cruise.stopping) return;
  cruise.stopping = true;
  const sec = fadeSec || 2.5;
  audio.fadeTo(0, sec); // 音のフェードアウト
  audio.syncNoiseBed(false, sec); // 持続ベッドも同じ長さで看取る
  setTimeout(() => {
    cruise.on = false; cruise.stopping = false;
    audio.fadeTo(state.volume, 1.5); // 手弾き用に音を戻す
    ui.cruiseState();
  }, sec * 1000);
}

/* クルーズの一滴: コード列の帯の中に落とし、旋律は上下にゆっくり散歩する */
function cruiseDrop(vel, light){
  const g = genre();
  let x;
  if (g.prog){
    const col = cruise.bar % g.prog.length; // 小節ごとにコードが進む
    x = (col + .14 + Math.random() * .72) * (VW / g.prog.length);
  } else {
    x = (0.08 + Math.random() * .84) * VW;
  }
  cruise.y01 = Math.max(.08, Math.min(.92, cruise.y01 + (Math.random() - .5) * .2));
  const y = cruise.y01 * VH;
  spawnDrop(x, y, (.5 + vel * .45) * (.85 + Math.random() * .3), { light }); // 強さも人間的に揺らす
  // 強拍ではときどき分散和音の駆け上がり
  if (!light && vel >= .8 && Math.random() < .18 && g.prog){
    const stepDur = 60000 / g.bpm / 4;
    for (let n = 1; n <= 3; n++){
      cruise.runQueue.push({ t: performance.now() + stepDur * n, x: x + n * 14, y: y - n * 10 });
    }
  }
}

function cruiseTick(now){
  if (!cruise.on || cruise.stopping) return;

  // タイマー満了 → 8秒かけて光と音を看取る
  if (now >= cruise.endAt){
    cruiseStop(8);
    ui.toast(T().cruiseEnd);
    return;
  }

  const g = genre();
  if (g.pattern){
    const stepDur = 60000 / g.bpm / 4;
    while (now >= cruise.nextStep){
      const v = g.pattern[cruise.step % 16];
      if (v > 0 && Math.random() < .94) cruiseDrop(v, v < .5);
      cruise.step++;
      if (cruise.step % 16 === 0) cruise.bar++;
      // スウィング: 裏の16分を後ろへもたれさせる
      const swing = (cruise.step % 2 === 1) ? g.swing * stepDur : -((g.swing * stepDur) * .5);
      const human = state.assist ? 0 : (Math.random() - .5) * (g.friction || 0) * 120; // 刻みの人間的なよれ
      cruise.nextStep += stepDur + swing + human;
    }
  } else {
    // 拍を持たないジャンル（FREE / AMBIENT）はポアソン的に
    if (now >= cruise.nextFree){
      cruiseDrop(.5 + Math.random() * .5, Math.random() < .4);
      const density = g.density || 1;
      cruise.nextFree = now + (1600 + Math.random() * 3800) / density;
      if (cruise.step++ % 4 === 3) cruise.bar++;
    }
  }

  // 駆け上がりキュー
  while (cruise.runQueue.length && cruise.runQueue[0].t <= now){
    const q = cruise.runQueue.shift();
    const f = pitchAt(q.x / VW, q.y / VH, 1);
    spawnDrop(q.x, q.y, .4, { light: true, freq: f });
  }

  // シャッフル: 40〜70秒ごとにジャンルかモードがゆっくり入れ替わる
  if (cruise.shuffle && now - cruise.lastShuffle > 40000 + Math.random() * 30000){
    cruise.lastShuffle = now;
    if (Math.random() < .6){
      const next = 1 + Math.floor(Math.random() * (GENRES.length - 1));
      ui.setGenre(next);
      ui.toast(GENRES[next].label[state.lang].split("—")[0].trim());
    } else {
      // ノイズ3モードはシャッフル対象から除外（楽器音と質感が違いすぎて驚くため）
      const pool = MODES.map((_, i) => i).filter(i => MODES[i].voice !== "noise");
      const next = pool[Math.floor(Math.random() * pool.length)];
      ui.setMode(next);
      ui.toast(MODES[next].name + " · " + MODES[next].jp);
    }
  }
}

/* ---------- 11. UI と入力 ---------- */
let spawnDrop = () => {}; // 入力セクションで実体を与える（クルーズと共有）

const ui = (() => {
  const normalModeIndices = MODES.map((m, i) => m.voice === "noise" ? -1 : i).filter(i => i >= 0);
  const noiseModeIndices = ["white", "pink", "brown"].map(id => MODES.findIndex(m => m.id === id));
  const modeNormal = document.getElementById("modeNormal");
  const modeNoise = document.getElementById("modeNoise");
  const normalModeWrap = document.getElementById("normalModeWrap");
  const noiseModeWrap = document.getElementById("noiseModeWrap");
  const selNormalMode = document.getElementById("selNormalMode");
  const selNoiseMode = document.getElementById("selNoiseMode");
  const badge = document.getElementById("recBadge");
  const cruiseBadge = document.getElementById("cruiseBadge");
  const hint = document.getElementById("hint");
  const chordEl = document.getElementById("chordName");
  const toastEl = document.getElementById("toast");
  const btnRec = document.getElementById("btnRec");
  const btnStop = document.getElementById("btnStop");
  const btnWav = document.getElementById("btnWav");
  const btnCruise = document.getElementById("btnCruise");
  const selGenre = document.getElementById("selGenre");
  const selTheme = document.getElementById("selTheme");
  const selLang = document.getElementById("selLang");
  let chordTimer = null, toastTimer = null;

  /* --- モード: グループ境界と個別音色を分けて扱う --- */
  let lastNormalMode = normalModeIndices[0];
  let lastNoiseMode = noiseModeIndices[0];
  const fillModeSelect = (select, indices) => {
    indices.forEach(i => {
      const m = MODES[i], op = document.createElement("option");
      op.value = String(i); op.textContent = `${m.name} — ${m.jp}`;
      select.appendChild(op);
    });
  };
  fillModeSelect(selNormalMode, normalModeIndices);
  fillModeSelect(selNoiseMode, noiseModeIndices);

  function updateModeUI(){
    const isNoise = mode().voice === "noise";
    modeNormal.classList.toggle("active", !isNoise);
    modeNoise.classList.toggle("active", isNoise);
    modeNormal.setAttribute("aria-pressed", isNoise ? "false" : "true");
    modeNoise.setAttribute("aria-pressed", isNoise ? "true" : "false");
    normalModeWrap.classList.toggle("disabled", isNoise);
    noiseModeWrap.classList.toggle("disabled", !isNoise);
    selNormalMode.disabled = isNoise;
    selNoiseMode.disabled = !isNoise;
    selNormalMode.value = String(lastNormalMode);
    selNoiseMode.value = String(lastNoiseMode);
  }

  function updateShuffleUI(){
    const isNoise = mode().voice === "noise";
    shuffleEl.classList.toggle("dim", isNoise);
    shuffleEl.setAttribute("aria-disabled", isNoise ? "true" : "false");
    shuffleEl.classList.toggle("off", !cruise.shuffle);
    shuffleEl.querySelector(".a-state").textContent = cruise.shuffle ? "ON" : "OFF";
  }

  const modeConfirm = document.getElementById("modeConfirm");
  const modeConfirmText = document.getElementById("modeConfirmText");
  const modeConfirmYes = document.getElementById("modeConfirmYes");
  const modeConfirmNo = document.getElementById("modeConfirmNo");
  let pendingMode = null;

  function applyMode(nextIdx){
    const wasNoise = MODES[state.modeIdx].voice === "noise";
    const nowNoise = MODES[nextIdx].voice === "noise";
    state.modeIdx = nextIdx;
    if (nowNoise) lastNoiseMode = nextIdx; else lastNormalMode = nextIdx;
    // 通常音→ノイズは爆音になりやすいので音量を約10%へ強制的に絞る。
    // ノイズ→通常音へ戻るときは、絞る前の音量へ復帰する。
    if (nowNoise && !wasNoise){
      state._volBeforeNoise = state.volume;
      applyVolume(.1);
      state._shuffleBeforeNoise = cruise.shuffle;
      cruise.shuffle = false;
    } else if (!nowNoise && wasNoise){
      if (state._volBeforeNoise != null) applyVolume(state._volBeforeNoise);
      state._volBeforeNoise = null;
      if (state._shuffleBeforeNoise != null) cruise.shuffle = state._shuffleBeforeNoise;
      state._shuffleBeforeNoise = null;
      cruise.lastShuffle = performance.now();
    }
    updateModeUI();
    updateShuffleUI();
    resetMelody();
    audio.syncNoiseBed(cruise.on); // CRUISE中にノイズへ/から切り替えたらベッドも追従
    return true;
  }

  function setMode(i){
    const nextIdx = Math.max(0, Math.min(MODES.length - 1, i));
    const crossing = MODES[state.modeIdx].voice !== MODES[nextIdx].voice;
    if (crossing && (cruise.on || audio.sounding())){
      pendingMode = nextIdx;
      modeConfirmText.textContent = MODES[nextIdx].voice === "noise"
        ? "ノイズ再生モードに変更しますか？"
        : "ノイズ再生が止まりますがいいですか？";
      modeConfirm.hidden = false;
      modeConfirmNo.focus();
      return false;
    }
    return applyMode(nextIdx);
  }

  function closeModeConfirm(apply){
    const nextIdx = pendingMode;
    pendingMode = null;
    modeConfirm.hidden = true;
    if (apply && nextIdx != null) applyMode(nextIdx);
    else updateModeUI();
  }
  modeConfirmYes.addEventListener("click", () => closeModeConfirm(true));
  modeConfirmNo.addEventListener("click", () => closeModeConfirm(false));
  modeConfirm.addEventListener("click", (e) => { if (e.target === modeConfirm) closeModeConfirm(false); });

  modeNormal.addEventListener("click", () => { setMode(lastNormalMode); modeNormal.blur(); });
  modeNoise.addEventListener("click", () => { setMode(lastNoiseMode); modeNoise.blur(); });
  selNormalMode.addEventListener("change", () => { setMode(parseInt(selNormalMode.value, 10)); selNormalMode.blur(); });
  selNoiseMode.addEventListener("change", () => { setMode(parseInt(selNoiseMode.value, 10)); selNoiseMode.blur(); });

  /* 音量を state・スライダーUI・実音へまとめて反映（モード切替の自動調整で共用） */
  function applyVolume(v){
    state.volume = v;
    const el = document.getElementById("sVolume");
    if (el) el.value = String(v);
    if (!cruise.stopping && !fadeClear.active) audio.setVolume(v);
  }

  /* --- ジャンル --- */
  function buildGenres(){
    selGenre.innerHTML = "";
    GENRES.forEach((g, i) => {
      const op = document.createElement("option");
      op.value = i; op.textContent = g.label[state.lang] || g.label.ja;
      selGenre.appendChild(op);
    });
    selGenre.value = String(state.genreIdx);
  }
  function setGenre(i){
    state.genreIdx = Math.max(0, Math.min(GENRES.length - 1, i));
    selGenre.value = String(state.genreIdx);
    resetMelody();
  }
  selGenre.addEventListener("change", () => {
    setGenre(parseInt(selGenre.value, 10) || 0);
    selGenre.blur(); // スペース奏法がセレクトに食われないように
  });

  /* --- アシスト --- */
  const assistEl = document.getElementById("assistToggle");
  assistEl.addEventListener("click", () => {
    state.assist = !state.assist;
    assistEl.classList.toggle("off", !state.assist);
    assistEl.querySelector(".a-state").textContent = state.assist ? "ON" : "OFF";
    resetMelody();
  });

  /* --- SUSTAIN（ロングトーン） --- */
  const sustainEl = document.getElementById("sustainToggle");
  sustainEl.addEventListener("click", () => {
    state.sustain = !state.sustain;
    sustainEl.classList.toggle("off", !state.sustain);
    sustainEl.querySelector(".a-state").textContent = state.sustain ? "ON" : "OFF";
  });

  /* --- スライダー --- */
  const bind = (id, key, fn) => {
    const el = document.getElementById(id);
    el.addEventListener("input", () => { state[key] = parseFloat(el.value); if (fn) fn(state[key]); });
  };
  bind("sLife", "life");
  bind("sSpeed", "speed");
  bind("sReflect", "reflect");
  bind("sVolume", "volume", v => { if (!cruise.stopping && !fadeClear.active) audio.setVolume(v); });
  // NOISE TONE: 持続ノイズベッドの3バンドつまみ
  bind("sNoiseBass", "noiseBass", () => audio.noiseBedSetEQ());
  bind("sNoiseMid", "noiseMid", () => audio.noiseBedSetEQ());
  bind("sNoiseHigh", "noiseTreble", () => audio.noiseBedSetEQ());

  /* --- クルーズ --- */
  const sCruise = document.getElementById("sCruise");
  const cruiseVal = document.getElementById("cruiseVal");
  const cruiseTimeRow = document.getElementById("cruiseTimeRow");
  const loopEl = document.getElementById("loopToggle");
  const shuffleEl = document.getElementById("shuffleToggle");
  sCruise.addEventListener("input", () => {
    state.cruiseMin = parseInt(sCruise.value, 10);
    cruiseVal.textContent = state.cruiseMin + "m";
  });
  loopEl.addEventListener("click", () => {
    cruise.loop = !cruise.loop;
    loopEl.classList.toggle("off", !cruise.loop);
    loopEl.querySelector(".a-state").textContent = cruise.loop ? "ON" : "OFF";
    cruiseTimeRow.classList.toggle("dim", cruise.loop);
    if (cruise.on) cruise.endAt = cruise.loop ? Infinity : cruise.t0 + state.cruiseMin * 60000;
  });
  shuffleEl.addEventListener("click", () => {
    if (mode().voice === "noise") return;
    cruise.shuffle = !cruise.shuffle;
    updateShuffleUI();
  });
  btnCruise.addEventListener("click", () => { cruise.on ? cruiseStop() : cruiseStart(); });

  function cruiseState(){
    btnCruise.classList.toggle("running", cruise.on);
    btnCruise.textContent = cruise.on ? "STOP" : "START";
    cruiseBadge.classList.toggle("on", cruise.on);
  }

  /* --- 録音 --- */
  btnRec.addEventListener("click", recStart);
  btnStop.addEventListener("click", recStop);
  btnWav.addEventListener("click", recSave);
  document.getElementById("btnClear").addEventListener("click", clearWater);

  // ボタンにフォーカスが残るとスペースキーが誤爆するので外す
  document.getElementById("panel").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b) b.blur();
  });

  function recState(){
    btnRec.classList.toggle("recording", rec.active);
    btnRec.disabled = rec.active;
    btnStop.disabled = !rec.active;
    btnWav.disabled = rec.active || rec.len === 0;
    badge.classList.toggle("on", rec.active);
  }

  const fmt = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : String(m).padStart(2, "0")) + ":" + String(ss).padStart(2, "0");
  };

  function badges(now){
    if (rec.active) badge.textContent = "REC " + fmt(now - rec.startedAt);
    if (cruise.on){
      cruiseBadge.textContent = cruise.loop
        ? "CRUISE " + fmt(now - cruise.t0) + " ∞"
        : "CRUISE −" + fmt(cruise.endAt - now);
    }
  }

  /* --- コードネーム / トースト --- */
  function showChord(x01){
    const g = genre();
    if (!g.names) return;
    chordEl.textContent = g.names[columnAt(x01)];
    chordEl.classList.add("on");
    clearTimeout(chordTimer);
    chordTimer = setTimeout(() => chordEl.classList.remove("on"), 1400);
  }
  function toast(text){
    toastEl.textContent = text;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("on"), 2600);
  }

  /* --- タブ --- */
  const readers = { journal: document.getElementById("readerJournal"), about: document.getElementById("readerAbout") };
  const tabBtns = [...document.querySelectorAll("#tabs .tab")];
  function switchTab(v){
    state.tab = v;
    tabBtns.forEach(b => b.classList.toggle("on", b.dataset.tabv === v));
    readers.journal.hidden = v !== "journal";
    readers.about.hidden = v !== "about";
    if (v === "journal") document.getElementById("artJournal").innerHTML = T().journal;
    if (v === "about") document.getElementById("artAbout").innerHTML = T().about;
  }
  tabBtns.forEach(b => b.addEventListener("click", () => { switchTab(b.dataset.tabv); b.blur(); }));
  document.getElementById("brand").addEventListener("click", () => switchTab("garden"));

  /* --- テーマ --- */
  const media = window.matchMedia("(prefers-color-scheme: light)");
  function buildThemes(){
    const names = T().themes;
    selTheme.innerHTML = "";
    ["light", "dark", "system"].forEach((v, i) => {
      const op = document.createElement("option");
      op.value = v; op.textContent = names[i];
      selTheme.appendChild(op);
    });
    selTheme.value = state.theme;
  }
  function applyTheme(){
    const resolved = state.theme === "system" ? (media.matches ? "light" : "dark") : state.theme;
    document.documentElement.dataset.theme = resolved;
  }
  selTheme.addEventListener("change", () => {
    state.theme = selTheme.value;
    try{ localStorage.setItem("ripple-garden_theme", state.theme); }catch(e){}
    applyTheme(); selTheme.blur();
  });
  media.addEventListener("change", () => { if (state.theme === "system") applyTheme(); });

  /* --- 言語 --- */
  function applyLang(){
    document.documentElement.lang = state.lang;
    hint.textContent = T().hint;
    document.getElementById("brandSub").textContent = T().brandSub + " · " + VERSION.toUpperCase();
    buildGenres();
    buildThemes();
    buildModal();
    if (state.tab === "journal") document.getElementById("artJournal").innerHTML = T().journal;
    if (state.tab === "about") document.getElementById("artAbout").innerHTML = T().about;
  }
  selLang.addEventListener("change", () => {
    state.lang = selLang.value;
    try{ localStorage.setItem("ripple-garden_lang", state.lang); }catch(e){}
    applyLang(); selLang.blur();
  });

  /* --- 版情報ダイアログ --- */
  const verModal = document.getElementById("verModal");
  function buildModal(){
    document.getElementById("vmVer").textContent = VERSION + " · " + VERSION_DATE + " · by sirop";
    const hist = T().hist;
    const li = ([v, txt]) => `<li><b>${v}</b>${txt}</li>`;
    const el = document.getElementById("vmHist");
    el.innerHTML = hist.slice(0, 5).map(li).join(""); // 最新5件（shima-shima踏襲）
    if (hist.length > 5){
      const wrap = document.createElement("li");
      const more = document.createElement("button");
      more.className = "vm-more";
      more.textContent = T().histAll;
      more.addEventListener("click", () => { el.innerHTML = hist.map(li).join(""); });
      wrap.appendChild(more);
      el.appendChild(wrap);
    }
    document.getElementById("vmClose").textContent = T().close;
  }
  document.getElementById("footerBtn").addEventListener("click", () => { verModal.hidden = false; });
  document.getElementById("vmClose").addEventListener("click", () => { verModal.hidden = true; });
  verModal.addEventListener("click", (e) => { if (e.target === verModal) verModal.hidden = true; });

  /* --- 設定の復元 --- */
  try{
    const sv = localStorage.getItem("ripple-garden_theme");
    if (sv === "light" || sv === "dark" || sv === "system") state.theme = sv;
    const sl = localStorage.getItem("ripple-garden_lang");
    if (sl && I18N[sl]) state.lang = sl;
  }catch(e){}
  selLang.value = state.lang;
  applyTheme();
  applyLang();
  updateModeUI();
  updateShuffleUI();
  cruiseState();

  /* --- パネル開閉 --- */
  const toggle = document.getElementById("panelToggle");
  toggle.addEventListener("click", () => document.body.classList.toggle("panel-open"));
  if (window.innerWidth > 700) document.body.classList.add("panel-open");

  /* --- キーボード: 1–6 モード / C クリア / Esc で水面へ --- */
  window.addEventListener("keydown", (e) => {
    if (!modeConfirm.hidden){
      if (e.key === "Escape") closeModeConfirm(false);
      return;
    }
    if (e.key === "Escape"){ switchTab("garden"); return; }
    if (state.tab !== "garden") return;
    const d = parseInt(e.key, 10);
    if (d >= 1 && d <= Math.min(9, MODES.length)) setMode(d - 1);
    else if (e.key === "c" || e.key === "C") clearWater();
  });

  let hintGone = false;
  function dismissHint(){ if (!hintGone){ hintGone = true; hint.classList.add("gone"); } }

  return { setMode, setGenre, recState, cruiseState, badges, dismissHint, showChord, toast, switchTab };
})();

/* 入力: クリック / ドラッグ / スペース奏法（クルーズとも共有する spawnDrop を定義） */
(() => {
  let lastDrag = { x: -999, y: -999, t: 0 };
  let lastSpawnT = 0;
  let spaceHeld = false;
  const pointerPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  const stroke = { x: 0, y: 0 };

  /* 共通の一滴。opt.freq で音高上書き、opt.light で軽い声部 */
  function spawn(x, y, strength, opt = {}){
    const m = mode();
    const now = performance.now();
    // アシスト: 連打時は少しずつ音量を抑え、耳あたりを保つ
    if (state.assist && !opt.light && now - lastSpawnT < 140) strength *= .85;
    lastSpawnT = now;

    const f = opt.freq != null ? opt.freq : pitchAt(x / VW, y / VH);
    injectImpulse(x, y, m.amp * strength * (opt.light ? .45 : 1), 3.6);
    audio.tap(x / VW, y / VH, strength, f, !!opt.light);
    registerRipple(x, y, f, strength);
    addGlow(x, y, strength, "190,225,255", .7, opt.light ? 8 : 13);
    ui.showChord(x / VW);
    ui.dismissHint();
  }
  spawnDrop = spawn; // クルーズエンジンへ共有

  view.addEventListener("pointerdown", (e) => {
    if (state.tab !== "garden") return;
    e.preventDefault();
    audio.ensure();
    const now = performance.now();
    let strength = 1;
    // Zenモード: 連打を静かに受け流す（間が美をつくる）
    if (mode().id === "zen" && now - state.lastTapTime < 320) strength = .35;
    state.lastTapTime = now;
    spawn(e.clientX, e.clientY, strength);
    lastDrag = { x: e.clientX, y: e.clientY, t: now };
  });

  view.addEventListener("pointermove", (e) => {
    if (state.tab !== "garden" || spaceHeld) return;
    if (e.buttons === 0 || mode().id === "zen") return; // 禅は撫でても応えない
    const now = performance.now();
    const d = Math.hypot(e.clientX - lastDrag.x, e.clientY - lastDrag.y);
    if (d > 30 && now - lastDrag.t > 70){
      spawn(e.clientX, e.clientY, .45);
      lastDrag = { x: e.clientX, y: e.clientY, t: now };
    }
  });

  /* ポインタ位置の常時追跡（スペース奏法の照準） */
  window.addEventListener("pointermove", (e) => {
    pointerPos.x = e.clientX; pointerPos.y = e.clientY;
    if (!spaceHeld || state.tab !== "garden") return;

    // スペース押し込み + 移動 = 弓奏ストローク
    const dx = e.clientX - stroke.x, dy = e.clientY - stroke.y;
    const d = Math.hypot(dx, dy);
    if (d < 26) return;
    stroke.x = e.clientX; stroke.y = e.clientY;
    const step = Math.abs(dy) > Math.abs(dx) ? (dy < 0 ? 1 : -1) : (dx > 0 ? 1 : -1);
    const f = pitchAt(e.clientX / VW, e.clientY / VH, step);
    spawn(e.clientX, e.clientY, .42, { freq: f, light: true });
    addGlow(e.clientX, e.clientY, .35, "190,225,255", .5, 7); // 航跡の燐光
  });

  /* スペースキー = クリック代用。連打でリズム（OSのキーリピートは無視） */
  window.addEventListener("keydown", (e) => {
    if (e.code !== "Space") return;
    if (state.tab !== "garden") return; // 読み物中はスクロールに譲る
    e.preventDefault();
    if (e.repeat) return;
    audio.ensure();
    spaceHeld = true;
    stroke.x = pointerPos.x; stroke.y = pointerPos.y;
    spawn(pointerPos.x, pointerPos.y, 1);
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "Space"){ spaceHeld = false; }
  });
  window.addEventListener("blur", () => { spaceHeld = false; });

  view.addEventListener("contextmenu", e => e.preventDefault());
})();

/* リサイズ: 少し待ってから水面を張り直す */
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { setupSim(); ripples.length = 0; }, 220);
});

/* ---------- 12. メインループ ---------- */
let lastT = performance.now();
function frame(now){
  const dt = Math.min(50, now - lastT);
  lastT = now;
  const m = mode();

  // 水面の自然な揺らぎ: ごく小さな雫を時折落とす（音は鳴らさない）
  if (Math.random() < m.shimmer * (dt / 16.7)){
    injectImpulse(Math.random() * VW, Math.random() * VH, .022 + Math.random() * .025, 3.5);
  }

  cruiseTick(now);

  // 長時間運用の自動クリーンアップ: 一定時間ごとに clearWater を発火し、
  // フェードアウト→掃除→フェードインで聴感を途切れさせずに蓄積をリセットする。
  // 演奏中の急なクリアを避けるため、手弾きが4秒以上途切れている時だけ実行する
  // （クルーズ中は手弾きしないので常に対象になる）。
  if (audio.running()){
    if (!lastAutoClean) lastAutoClean = now;
    else if (state.autoCleanMin > 0 && now - lastAutoClean > state.autoCleanMin * 60000
             && !fadeClear.active && now - state.lastTapTime > 4000){
      clearWater();
    }
  }

  if (fadeClear.active && now - fadeClear.t0 > fadeClear.dur) finishClear();

  const steps = m.sub * Math.max(1, Math.round(dt / 16.7));
  for (let s = 0; s < Math.min(steps, 4); s++) stepField();

  lerpPalette();
  updateRipples(dt, now);
  renderField(now);
  ui.badges(now);
  requestAnimationFrame(frame);
}

setupSim();
requestAnimationFrame(frame);
</script>
