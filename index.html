  } else {
    idx = Math.round((1 - y01) * (lad.length - 1));
    // アシスト: 4秒以内の連続入力は跳躍を±4段に抑え、旋律線をなめらかに
    if (state.assist && melody.idx !== null && performance.now() - melody.t < 4000){
      const J = 4;
      idx = Math.max(melody.idx - J, Math.min(melody.idx + J, idx));
    }
  }
  idx = Math.max(0, Math.min(lad.length - 1, idx));
  // 違和感の匙加減: ごく稀に隣の段へ滑る。完全な正しさは退屈の入口
  const fr = state.assist ? 0 : (genre().friction || 0); // ONでは違和感ゼロ
  if (fr && arpStep === undefined && Math.random() < fr){
    idx = Math.max(0, Math.min(lad.length - 1, idx + (Math.random() < .5 ? -1 : 1)));
  }
  melody.idx = idx; melody.t = performance.now();
  let f = lad[idx];
  const m = mode();
  if (!state.assist && m.jitter) f *= Math.pow(2, (Math.random() * 2 - 1) * m.jitter / 1200);
  return f;
}

/* 任意周波数を現在の梯子の最寄り音へ吸着（干渉音の濁り防止） */
function nearestTone(f, lad){
  let best = lad[0], d = Infinity;
  for (const t of lad){
    const dd = Math.abs(Math.log(t / f));
    if (dd < d){ d = dd; best = t; }
  }
  return best;
}

function resetMelody(){ melody.idx = null; melody.t = 0; }

/* ---------- 5. 水面シミュレーション ---------- */
const sim = { w:0, h:0, cell:4, cur:null, prev:null, canvas:null, ctx:null, img:null };
const view = document.getElementById("view");
const vctx = view.getContext("2d");
let DPR = 1, VW = 0, VH = 0;
let collisionGrid = null;

function setupSim(){
  VW = window.innerWidth; VH = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  view.width = Math.round(VW * DPR);
  view.height = Math.round(VH * DPR);

  // セルサイズ: 端末負荷に合わせて格子数を約16万セル以下に抑える
  let cell = Math.min(VW, VH) > 760 ? 3 : 4;
  while ((VW / cell) * (VH / cell) > 160000) cell++;
  sim.cell = cell;
  sim.w = Math.max(8, Math.round(VW / cell));
  sim.h = Math.max(8, Math.round(VH / cell));
  sim.cur = new Float32Array(sim.w * sim.h);
  sim.prev = new Float32Array(sim.w * sim.h);
  sim.canvas = document.createElement("canvas");
  sim.canvas.width = sim.w; sim.canvas.height = sim.h;
  sim.ctx = sim.canvas.getContext("2d");
  sim.img = sim.ctx.createImageData(sim.w, sim.h);
  collisionGrid = new Float32Array(sim.w * sim.h);
  const d = sim.img.data;
  for (let i = 3; i < d.length; i += 4) d[i] = 255; // アルファ不透明固定
}

/* ガウス型の盛り上がりを水面に落とす（負方向 = 水を押し下げる） */
function injectImpulse(cssX, cssY, amp, radiusCells){
  const cx = cssX / sim.cell, cy = cssY / sim.cell;
  const r = radiusCells, r2 = r * r;
  const x0 = Math.max(1, Math.floor(cx - r)), x1 = Math.min(sim.w - 2, Math.ceil(cx + r));
  const y0 = Math.max(1, Math.floor(cy - r)), y1 = Math.min(sim.h - 2, Math.ceil(cy + r));
  for (let y = y0; y <= y1; y++){
    for (let x = x0; x <= x1; x++){
      const dx = x - cx, dy = y - cy, d2 = dx * dx + dy * dy;
      if (d2 < r2) sim.cur[y * sim.w + x] -= amp * Math.exp(-d2 / (r2 * .35));
    }
  }
}

function injectEllipticImpulse(cssX, cssY, amp, rxCells, ryCells, driftX){
  const cx = cssX / sim.cell, cy = cssY / sim.cell;
  const rx = Math.max(.8, rxCells), ry = Math.max(.8, ryCells);
  const x0 = Math.max(1, Math.floor(cx - rx)), x1 = Math.min(sim.w - 2, Math.ceil(cx + rx));
  const y0 = Math.max(1, Math.floor(cy - ry)), y1 = Math.min(sim.h - 2, Math.ceil(cy + ry));
  for (let y = y0; y <= y1; y++){
    for (let x = x0; x <= x1; x++){
      const dx = (x - cx) / rx, dy = (y - cy) / ry, d2 = dx * dx + dy * dy;
      if (d2 < 1){
        const i = y * sim.w + x;
        const w = Math.exp(-d2 / .36);
        sim.cur[i] -= amp * w;
        if (driftX) sim.cur[i + (driftX > 0 ? 1 : -1)] -= amp * w * Math.min(.45, Math.abs(driftX));
      }
    }
  }
}

function injectBandImpulse(cssY, amp, widthCells, phase){
  const cy = cssY / sim.cell, ry = Math.max(1, widthCells);
  const y0 = Math.max(1, Math.floor(cy - ry)), y1 = Math.min(sim.h - 2, Math.ceil(cy + ry));
  for (let y = y0; y <= y1; y++){
    const dy = (y - cy) / ry;
    const wY = Math.exp(-(dy * dy) / .45);
    const row = y * sim.w;
    for (let x = 1; x < sim.w - 1; x++){
      const chop = .72 + .28 * Math.sin(x * .21 + phase);
      sim.cur[row + x] -= amp * wY * chop;
    }
  }
}

function injectSceneImpulse(cssX, cssY, amp, radiusCells, opt = {}){
  const sc = scene(), eng = sc.engine || {};
  if (eng.kind === "rain"){
    const n = opt.light ? 1 : 3;
    for (let k = 0; k < n; k++){
      const off = (k - (n - 1) / 2) * 9;
      injectEllipticImpulse(cssX + off * .25, cssY + off, amp * (k === 1 ? 1 : .58), radiusCells * .45, radiusCells * 2.7, .12);
    }
    return;
  }
  if (eng.kind === "shore"){
    injectEllipticImpulse(cssX, cssY, amp * 1.05, radiusCells * 5.8, radiusCells * 1.05, 0);
    injectBandImpulse(Math.max(cssY, VH * .62), amp * .36, radiusCells * 1.6, performance.now() * .003);
    return;
  }
  if (eng.kind === "deep"){
    injectEllipticImpulse(cssX, cssY, amp * .72, radiusCells * 3.6, radiusCells * 3.6, 0);
    injectImpulse(cssX, cssY, -amp * .20, radiusCells * 1.4);
    return;
  }
  if (eng.kind === "ink"){
    injectEllipticImpulse(cssX, cssY, amp * .82, radiusCells * 1.7, radiusCells * 2.5, .18);
    return;
  }
  if (eng.kind === "silver"){
    injectEllipticImpulse(cssX, cssY, amp * .18, radiusCells * 2.5, radiusCells * 2.5, 0);
    return;
  }
  if (eng.kind === "stream"){
    injectEllipticImpulse(cssX, cssY, amp, radiusCells * 2.4, radiusCells * 1.1, .35);
    return;
  }
  injectImpulse(cssX, cssY, amp, radiusCells);
}

/* フェードクリア: 光も音もゆっくり落としてから払う（バチッと暗転させない） */
const fadeClear = { active:false, t0:0, dur:1300 };
let lastAutoClean = 0; // 最後にクリーンアップした時刻（自動クリーンのタイマー基準）
function clearWater(){
  if (fadeClear.active) return;
  fadeClear.active = true; fadeClear.t0 = performance.now();
  lastAutoClean = performance.now(); // 手動・自動どちらのクリアでもタイマーを仕切り直す
  audio.fadeTo(0, .9);
}
function finishClear(){
  sim.cur.fill(0); sim.prev.fill(0);
  ripples.length = 0; glows.length = 0;
  resetMelody();
  fadeClear.active = false;
  audio.fadeTo(state.volume, 1.1); // 音を静かに戻す
}

/* 1ステップ進める。prevに次状態を書き込み、最後にバッファ交換 */
function stepField(){
  const W = sim.w, H = sim.h;
  const m = mode();
  const sf = scene();
  const eng = sf.engine || {};
  const now = performance.now();
  if (eng.kind === "silver"){
    const cur = sim.cur, nxt = sim.prev;
    for (let y = 1; y < H - 1; y++){
      const y01 = y / (H - 1);
      for (let x = 1; x < W - 1; x++){
        const i = y * W + x, x01 = x / (W - 1);
        const caustic =
          Math.sin(x * .095 + now * .0011 + Math.sin(y * .025 + now * .00025) * 1.8) +
          Math.sin((x + y) * .047 - now * .00085) * .7 +
          Math.sin(Math.hypot(x01 - .5, y01 - .5) * 18 - now * .0014) * .45;
        nxt[i] = cur[i] * .78 + caustic * 1.7;
      }
    }
    for (let x = 0; x < W; x++){ nxt[x] *= .6; nxt[(H-1)*W + x] *= .6; }
    for (let y = 0; y < H; y++){ nxt[y*W] *= .6; nxt[y*W + W-1] *= .6; }
    sim.prev = cur; sim.cur = nxt;
    return;
  }
  const c2 = Math.min(.47, m.c2 * sf.phys.cMul * state.speed * state.speed);
  let damp = 1 - (m.k * sf.phys.dampMul / state.life);
  if (fadeClear.active) damp *= .90; // 光のフェードアウト
  const cur = sim.cur, nxt = sim.prev;
  const ax = eng.anisotropyX || 1, ay = eng.anisotropyY || 1;

  for (let y = 1; y < H - 1; y++){
    let i = y * W + 1;
    for (let x = 1; x < W - 1; x++, i++){
      const lapX = cur[i-1] + cur[i+1] - 2 * cur[i];
      const lapY = cur[i-W] + cur[i+W] - 2 * cur[i];
      let v = (2 * cur[i] - nxt[i] + c2 * (lapX * ax + lapY * ay)) * damp;
      if (eng.kind === "rain"){
        v = v * (1 - eng.drip) + cur[i-W] * eng.drip - Math.max(0, cur[i]) * .018;
      } else if (eng.kind === "shore"){
        const y01 = y / (H - 1);
        const tide = Math.sin((y01 * 7.5 - now * .00042) * 6.2832 + Math.sin(x * .035) * .35);
        const band = Math.exp(-Math.pow((y01 - (.70 + .09 * Math.sin(now * .00018))) / .105, 2));
        v += tide * band * (eng.tide || 0);
        v += cur[i+W] * .025; // 下から押し寄せる浅瀬の流れ
      } else if (eng.kind === "deep"){
        const under = Math.sin(x * .025 + now * .00022) * Math.sin(y * .018 - now * .00016);
        v = v * .988 + under * (eng.undercurrent || 0);
      } else if (eng.kind === "stream"){
        v += (cur[i-1] - cur[i+1]) * (eng.advectX || 0);
      } else if (eng.kind === "ink"){
        v = v * (eng.viscosity || .6) + cur[i-1] * (eng.advectX || 0) - Math.abs(lapX + lapY) * .003;
      }
      nxt[i] = v;
    }
  }

  // 端: ミラー境界（反射）。REFLECT が低いほど吸収帯で波を消す
  const refl = Math.min(1, state.reflect * sf.phys.reflMul);
  for (let x = 0; x < W; x++){
    nxt[x] = nxt[x + W] * refl;
    nxt[(H-1)*W + x] = nxt[(H-2)*W + x] * refl;
  }
  for (let y = 0; y < H; y++){
    nxt[y*W] = nxt[y*W + 1] * refl;
    nxt[y*W + W-1] = nxt[y*W + W-2] * refl;
  }
  const absorb = (1 - refl) * .32;
  if (absorb > .003){
    const B = 12;
    for (let b = 0; b < B; b++){
      const g = 1 - absorb * Math.pow(1 - b / B, 2);
      const yT = b * W, yB = (H-1-b) * W;
      for (let x = 0; x < W; x++){ nxt[yT + x] *= g; nxt[yB + x] *= g; }
      for (let y = 0; y < H; y++){ nxt[y*W + b] *= g; nxt[y*W + W-1-b] *= g; }
    }
  }

  sim.prev = cur; sim.cur = nxt;
}

/* ---------- 6. 描画 ---------- */
const glows = []; // {x, y, t0, str, col, life, r}

/* パレット補間 — モード切替やシャッフルで水の色がゆっくり変わる */
const pal = {
  base:[...MODES[0].base], crest:[...MODES[0].crest], trough:[...MODES[0].trough],
  lbase:[...MODES[0].lbase], hg:MODES[0].heightGain, sg:MODES[0].shadeGain,
};
function lerpPalette(){
  const m = mode(), k = .045;
  for (let i = 0; i < 3; i++){
    pal.base[i]   += (m.base[i]   - pal.base[i])   * k;
    pal.crest[i]  += (m.crest[i]  - pal.crest[i])  * k;
    pal.trough[i] += (m.trough[i] - pal.trough[i]) * k;
    pal.lbase[i]  += (m.lbase[i]  - pal.lbase[i])  * k;
  }
  pal.hg += (m.heightGain - pal.hg) * k;
  pal.sg += (m.shadeGain - pal.sg) * k;
}

function isLight(){ return document.documentElement.dataset.theme === "light"; }

function renderField(now){
  const W = sim.w, H = sim.h, cur = sim.cur, d = sim.img.data;
  const light = isLight();
  // ごく弱い時間揺らぎ — 水面の明度がゆっくり呼吸する
  const sf = scene(), R = sf.rend, A = sf.amb;
  const breathe = 1 + A.breathAmp * Math.sin(now * A.breathSpeed);
  const hg = pal.hg * breathe, sg = pal.sg;
  const shimOn = R.shimmer > .001, shS = R.shimScale, shAmp = R.shimmer * 26;
  const shPh = now * .001 * (1 + A.driftX), shPhY = now * .0007;
  const crestBoost = 1 + R.highlight * .85, troughBoost = 1 + R.depth * 2.2;
  const warmR = R.warm * 46, warmG = R.warm * 20, inkOn = R.ink > .5;
  const [bR, bG, bB] = pal.base, [cR, cG, cB] = pal.crest, [tR, tG, tB] = pal.trough;
  const [lR, lG, lB] = pal.lbase;
  // v018: シーン背景（dark時のみ）/ 波頭の白化(foam) / 擬似normal方向光(nrm)
  const foam = R.foam || 0, nrm = R.normal || 0;
  const bgKindStr = (sf.bg && sf.bg.kind) || "flat";
  const bgMode = (bgKindStr === "deep" ? 1 : bgKindStr === "shore" ? 2 : bgKindStr === "rain" ? 3 : bgKindStr === "tank" ? 4 : 0);
  const sceneEnv = bgMode > 0; // 明示背景を持つシーンはUIテーマ(light/dark)に依らず自前の環境を描く
  const bgT = now * .001, invW = 1 / W, invH = 1 / (H - 1);

  let i = 0, p = 0;
  for (let y = 0; y < H; y++){
    const yu = y > 0 ? -W : 0, yd = y < H - 1 ? W : 0;
    const y01 = y * invH;
    for (let x = 0; x < W; x++, i++, p += 4){
      const h = cur[i];
      const gv = cur[i + yu] - cur[i + yd];
      let v = h * hg + gv * sg;
      v = v / (1 + Math.abs(v) * .0055); // ソフトクリップ
      if (shimOn) v += Math.sin(x * shS + shPh) * Math.sin(y * shS * .9 - shPhY) * shAmp;
      if (light && !sceneEnv){
        // ライト: 明るい水面に波が青く影を落とす（環境シーンは下のelseで自前背景を描く）
        if (v > 0){
          const a = v * .0085 * crestBoost;
          d[p] = lR - cR * a; d[p+1] = lG - cG * a; d[p+2] = lB - cB * a;
        } else {
          const a = v * -.004 * troughBoost;
          d[p] = lR + (255 - lR) * a; d[p+1] = lG + (255 - lG) * a; d[p+2] = lB + (255 - lB) * a;
        }
      } else {
        // シーン背景の基調色（bgMode 0=従来単色 / 1=深海 / 2=岸辺 / 3=雨窓 / 4=水槽）
        let aR = bR, aG = bG, aB = bB;
        if (bgMode === 1){            // DEEP: 上=水面寄り→下=深淵へ暗く、淡いエメラルド
          const u = 1 - y01;
          aR = 2 + u * 6; aG = 5 + u * 20; aB = 10 + u * 33;
        } else if (bgMode === 2){     // SHORE: 上=深いターコイズ→下=浅瀬の砂、上へ流れる波帯
          const band = Math.max(0, Math.sin((y01 * 7 - bgT * .7) * 6.2832)) * 13;
          aR = 10 + y01 * 52 + band; aG = 58 + y01 * 92 + band; aB = 78 + y01 * 66 + band;
          if (y01 > .86){ const fb = (y01 - .86) * 6.5; aR += fb * 90; aG += fb * 80; aB += fb * 70; }
        } else if (bgMode === 3){     // RAIN: 暗い夜窓＋縦の滲み筋
          const st = (Math.sin(x * .5) + Math.sin(x * .17 + y01 * .9)) * 1.6;
          aR = 7 + st; aG = 12 + st; aB = 22 + st * 1.4;
        } else if (bgMode === 4){     // TANK: 深い藍緑＋周辺減光（水槽の奥行き）
          const cx = x * invW - .5, cy = y01 - .5, vig = 1 - (cx * cx + cy * cy) * 1.15;
          aR = 3 + 6 * vig; aG = 14 + 22 * vig; aB = 16 + 24 * vig;
        }
        let rr, gg2, bb2;
        if (v > 0){
          const a = v * .01 * crestBoost;
          rr = aR + cR * a + warmR * a; gg2 = aG + cG * a + warmG * a; bb2 = aB + cB * a;
        } else {
          const a = v * .009 * troughBoost;
          rr = aR + tR * a; gg2 = aG + tG * a; bb2 = aB + tB * a;
        }
        // 擬似normal方向光: 横勾配で波頭に方向性ハイライト（左上光源）
        if (nrm){
          const gh = cur[i + (x > 0 ? -1 : 0)] - cur[i + (x < W - 1 ? 1 : 0)];
          const sp = nrm * Math.max(0, gh * .5 + gv * .22) * 1.3;
          rr += sp; gg2 += sp; bb2 += sp * 1.06;
        }
        // 波頭の白化(foam): エネルギーが高い場所だけ白い泡・筋へ
        if (foam && v > 44){
          const fw = Math.min(1, (v - 44) / 120) * foam;
          rr += (255 - rr) * fw; gg2 += (255 - gg2) * fw; bb2 += (255 - bb2) * fw;
        }
        if (inkOn){ const lm = (rr + gg2 + bb2) * .333; rr += (lm - rr) * .55; gg2 += (lm - gg2) * .55; bb2 += (lm - bb2) * .5; }
        d[p] = rr; d[p+1] = gg2; d[p+2] = bb2;
      }
    }
  }
  sim.ctx.putImageData(sim.img, 0, 0);

  vctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  vctx.imageSmoothingEnabled = true;
  vctx.imageSmoothingQuality = "high";
  vctx.clearRect(0, 0, VW, VH);
  vctx.drawImage(sim.canvas, 0, 0, VW, VH);

  // 発光点（ダーク=加算で光る / ライト=乗算で青く滲む）
  vctx.globalCompositeOperation = light ? "multiply" : "lighter";
  for (let g = glows.length - 1; g >= 0; g--){
    const gl = glows[g];
    const age = (now - gl.t0) / 1000;
    if (age > gl.life){ glows.splice(g, 1); continue; }
    const k = 1 - age / gl.life;
    const rad = gl.r + (1 - k) * gl.r * 2.2;
    const colStr = light ? "70,105,150" : gl.col;
    const grad = vctx.createRadialGradient(gl.x, gl.y, 0, gl.x, gl.y, rad);
    grad.addColorStop(0, `rgba(${colStr}, ${(.28 * k * k * gl.str).toFixed(3)})`);
    grad.addColorStop(1, light ? "rgba(255,255,255,0)" : "rgba(0,0,0,0)");
    vctx.fillStyle = grad;
    vctx.beginPath();
    vctx.arc(gl.x, gl.y, rad, 0, Math.PI * 2);
    vctx.fill();
  }
  vctx.globalCompositeOperation = "source-over";
}

function addGlow(x, y, str, col, life, r){
  glows.push({ x, y, t0: performance.now(), str, col: col || "190,225,255", life: life || .7, r: r || 13 });
  if (glows.length > 48) glows.shift();
}

/* 水面テーマの自律演出（音は鳴らさない・視覚のみ）。frame は ECO 中は呼ばない。 */
function sceneAmbient(now, dt){
  const A = scene().amb, R = scene().rend, k = dt / 16.7, light = isLight();
  // 自然ドロップ（SHORE は下辺寄りに打ち寄せる）
  if (A.dropRate > 0 && Math.random() < A.dropRate * k){
    const dx = Math.random() * VW;
    const dy = A.edge === "bottom" ? VH * (.7 + Math.random() * .3) : Math.random() * VH;
    injectSceneImpulse(dx, dy, A.dropSize, 4.2, { ambient:true });
  }
  // 雨粒（RAIN GLASS）: 小さく頻繁
  if (A.rainRate > 0){
    let n = A.rainRate * k; n = Math.floor(n) + (Math.random() < (n % 1) ? 1 : 0);
    for (let r = 0; r < n; r++) injectSceneImpulse(Math.random() * VW, Math.random() * VH, .016 + Math.random() * .02, 3.0, { ambient:true });
  }
  if (light) return; // 加算発光はダークのみ（ライトは乗算で濁るため）
  // 煌めき（glint）: 明るく小さい短命のスパーク
  if (R.glint > 0 && Math.random() < R.glint * k){
    const col = R.warm > .3 ? "255,212,150" : "208,232,255";
    addGlow(Math.random() * VW, Math.random() * VH * .92, .5 + Math.random() * .5, col, .35, 4 + Math.random() * 5);
  }
  // 前ボケ（bokeh）: 大きく柔らかい発光体（暖色＝オレンジ / 寒色）
  if (A.bokehRate > 0 && Math.random() < A.bokehRate * k){
    const warm = Math.random() < A.bokehWarm;
    const col = warm ? "255,176,116" : "150,200,255";
    addGlow(Math.random() * VW, Math.random() * VH, .22 + Math.random() * .28, col, 1.7 + Math.random() * 1.2, A.bokehSize * (.6 + Math.random() * .7));
  }
}

/* ---------- 6b. シーン粒子・群泳・衝突FX（v018: 長尺環境映像シーン） ---------- */
/* 視覚のみ・発音しない。背景(renderField) → 水面 → 粒子/群泳(drawScene) の順で重ねる。
   個数上限・再利用・ECO停止でメモリと負荷を抑える（2時間耐久前提）。 */
const sceneParts = [];                 // 泡/雨/浮遊粒 {x,y,vx,vy,age,life,kind,size,rot,hit}
const PART_CAP = 1400;
const fish = [];                       // 群泳(underwater) {x,y,a,sp,ph}
let fishBuilt = -1;                    // 構築済みVW（リサイズ再構築判定）
const fishDisturb = { x: 0, y: 0, t: -9999 }; // タップで群れを割る
const _flow = { vx: 0, vy: 0 };

// 弱い流れ場。silver=大きな渦 / deep=ゆっくり上昇 / shore=上方向へ押し寄せ
function sceneFlow(id, x01, y01, now, out){
  let vx = 0, vy = -.05;
  if (id === "silver"){
    const cx = .5 + .07 * Math.sin(now * .00009), cy = .5 + .05 * Math.cos(now * .00013);
    const dx = x01 - cx, dy = y01 - cy, r = Math.hypot(dx, dy) + .001, tang = .9 / (r + .25);
    vx = (-dy / r) * tang - dx * .12 + .12 * Math.sin(now * .0003 + y01 * 6);
    vy = ( dx / r) * tang - dy * .12;
  } else if (id === "deep"){
    vy = -.18 + .08 * Math.sin(now * .0002 + x01 * 5); vx = .10 * Math.sin(now * .00017 + y01 * 4);
  } else if (id === "shore"){
    vy = -.5; vx = .12 * Math.sin(now * .0004 + y01 * 5);
  } else { vx = .03 * Math.sin(now * .0002 + y01 * 4); }
  out.vx = vx; out.vy = vy;
}

function ensureFish(){
  const n = (scene().particles && scene().particles.count) || 0;
  if (fishBuilt === Math.round(VW) && fish.length === n) return;
  fish.length = 0;
  for (let k = 0; k < n; k++){
    const ang = Math.random() * 6.2832, rad = .08 + Math.random() * .42;
    fish.push({ x: VW * (.5 + Math.cos(ang) * rad * .8), y: VH * (.5 + Math.sin(ang) * rad * .8),
                a: ang, sp: 26 + Math.random() * 26, ph: Math.random() * 6.28 });
  }
  fishBuilt = Math.round(VW);
}

function updateFish(now, dt){
  const k = Math.min(2.5, dt / 16.7), dist = (now - fishDisturb.t < 1800);
  for (let f = 0; f < fish.length; f++){
    const fi = fish[f];
    sceneFlow("silver", fi.x / VW, fi.y / VH, now, _flow);
    let vx = _flow.vx * 60, vy = _flow.vy * 60;
    if (dist){
      const dx = fi.x - fishDisturb.x, dy = fi.y - fishDisturb.y, d2 = dx * dx + dy * dy;
      if (d2 < 26000){ const d = Math.sqrt(d2) + 1, push = (1 - (now - fishDisturb.t) / 1800) * 950 / d; vx += dx / d * push; vy += dy / d * push; }
    }
    fi.x += vx * k * .5; fi.y += vy * k * .5;
    if (fi.x < -20) fi.x = VW + 10; else if (fi.x > VW + 20) fi.x = -10;
    if (fi.y < -20) fi.y = VH + 10; else if (fi.y > VH + 20) fi.y = -10;
    fi.a = Math.atan2(vy, vx);
  }
}

function drawFish(now){
  vctx.lineCap = "round"; vctx.lineWidth = 1.6;
  for (let f = 0; f < fish.length; f++){
    const fi = fish[f], a = fi.a + Math.sin(now * .006 + fi.ph) * .35, len = 6 + fi.sp * .12;
    const cx = Math.cos(a), sy = Math.sin(a), sh = .55 + .45 * Math.sin(now * .004 + fi.ph * 2);
    vctx.strokeStyle = `rgba(${200 + sh * 40 | 0},${214 + sh * 30 | 0},${228 + sh * 27 | 0},${(.42 + sh * .42).toFixed(2)})`;
    vctx.beginPath();
    vctx.moveTo(fi.x - cx * len, fi.y - sy * len);
    vctx.lineTo(fi.x + cx * len * .5, fi.y + sy * len * .5);
    vctx.stroke();
  }
}

function spawnPart(kind){
  if (sceneParts.length >= PART_CAP) return;
  let x, y, vx = 0, vy = 0, life, size;
  if (kind === "rain"){ x = Math.random() * VW; y = -10 - Math.random() * VH * .3; vy = 7 + Math.random() * 6; vx = .5; life = 2400; size = 8 + Math.random() * 10; }
  else if (kind === "foam"){ x = Math.random() * VW; y = VH * (.72 + Math.random() * .28); vy = -.5 - Math.random(); vx = (Math.random() - .5) * .6; life = 2600 + Math.random() * 1800; size = 1.5 + Math.random() * 2.6; }
  else if (kind === "mote"){ x = Math.random() * VW; y = Math.random() * VH; vy = -.2; vx = (Math.random() - .5) * .3; life = 9000 + Math.random() * 8000; size = .8 + Math.random() * 1.8; }
  else return;
  sceneParts.push({ x, y, vx, vy, age: 0, life, kind, size, rot: Math.random(), hit: 0 });
}

// タップのシーン反応: underwater=群れを割る / shore=しぶき
function sceneTap(x, y){
  const sc = scene();
  if (sc.type === "underwater"){ fishDisturb.x = x; fishDisturb.y = y; fishDisturb.t = performance.now(); return; }
  if (sc.collision === "foam"){
    for (let i = 0; i < 4; i++) sceneParts.push({ x: x + (Math.random()-.5)*18, y: y + (Math.random()-.5)*14, vx:(Math.random()-.5)*1.6, vy:-Math.random()*1.8, age:0, life:1200, kind:"foam", size:1.4+Math.random()*2.2, rot:0, hit:0 });
  }
}

function updateScene(now, dt){
  const sc = scene(), k = dt / 16.7;
  if (sc.type === "underwater") ensureFish(); else if (fish.length){ fish.length = 0; fishBuilt = -1; }
  const P = sc.particles;
  if (P && P.kind !== "silver"){
    const cap = P.max || 200;
    if (P.kind === "mote"){ if (sceneParts.length < cap && Math.random() < P.rate * k) spawnPart("mote"); }
    else { let want = P.rate * k, n = Math.floor(want) + (Math.random() < (want % 1) ? 1 : 0); for (let s = 0; s < n && sceneParts.length < cap; s++) spawnPart(P.kind); }
  }
  for (let s = sceneParts.length - 1; s >= 0; s--){
    const pt = sceneParts[s];
    pt.age += dt;
    if (pt.kind === "mote"){ sceneFlow("deep", pt.x / VW, pt.y / VH, now, _flow); pt.x += _flow.vx * k * 26 + pt.vx * k; pt.y += _flow.vy * k * 26 + pt.vy * k; }
    else if (pt.kind === "foam"){ sceneFlow("shore", pt.x / VW, pt.y / VH, now, _flow); pt.x += (_flow.vx * 10 + pt.vx) * k; pt.y += (_flow.vy * 10 + pt.vy) * k; }
    else { pt.x += pt.vx * k; pt.y += pt.vy * k; } // rain
    if (pt.kind === "rain" && !pt.hit && pt.y >= VH * (.25 + pt.rot * .65)){
      sceneParts.push({ x: pt.x, y: pt.y, vx:(Math.random()-.5)*.5, vy:-.4, age:0, life:520, kind:"foam", size:1.1+Math.random()*1.4, rot:0, hit:1 });
      sceneParts.splice(s, 1); continue;
    }
    if (pt.age > pt.life || pt.y > VH + 16 || pt.x < -24 || pt.x > VW + 24) sceneParts.splice(s, 1);
  }
  if (sc.type === "underwater") updateFish(now, dt);
}

function drawScene(now){
  if (fish.length) drawFish(now);
  if (!sceneParts.length) return;
  vctx.globalCompositeOperation = "lighter";
  for (let s = 0; s < sceneParts.length; s++){
    const pt = sceneParts[s], kk = 1 - pt.age / pt.life;
    if (pt.kind === "rain"){
      vctx.strokeStyle = `rgba(200,224,255,${(.16 * kk).toFixed(2)})`; vctx.lineWidth = 1;
      vctx.beginPath(); vctx.moveTo(pt.x, pt.y); vctx.lineTo(pt.x - pt.vx * 2, pt.y - pt.size); vctx.stroke();
    } else {
      const al = pt.kind === "foam" ? .5 * kk : .30 * kk, col = pt.kind === "foam" ? "230,244,255" : "150,205,235";
      vctx.fillStyle = `rgba(${col},${al.toFixed(2)})`;
      vctx.beginPath(); vctx.arc(pt.x, pt.y, pt.size, 0, 6.2832); vctx.fill();
    }
  }
  vctx.globalCompositeOperation = "source-over";
}

// 衝突FX: 波の干渉点でシーン別の見せ場（泡/光粒/滲み/群れの分離）
function spawnCollision(x, y, str){
  const c = scene().collision;
  if (c === "foam"){ for (let i = 0; i < 3; i++) sceneParts.push({ x: x+(Math.random()-.5)*16, y: y+(Math.random()-.5)*12, vx:(Math.random()-.5)*1.2, vy:-Math.random()*1.4, age:0, life:1300, kind:"foam", size:1.4+Math.random()*2, rot:0, hit:1 }); addGlow(x, y, str * .6, "235,248,255", .7, 12); }
  else if (c === "raindrop"){ addGlow(x, y, str * .7, "210,232,255", .5, 8); }
  else if (c === "lightdust"){ addGlow(x, y, str * .9, "150,235,205", 1.6, 14); }
  else if (c === "split"){ fishDisturb.x = x; fishDisturb.y = y; fishDisturb.t = performance.now(); addGlow(x, y, str * .5, "200,220,240", .8, 12); }
  else addGlow(x, y, str * .8, "205,220,255", 1.1, 17);
}

function clearScene(){ sceneParts.length = 0; if (fish.length){ fish.length = 0; fishBuilt = -1; } }

function resetSceneVisuals(){
  sim.cur.fill(0); sim.prev.fill(0);
  if (collisionGrid) collisionGrid.fill(0);
  ripples.length = 0; glows.length = 0;
  clearScene();
  const sc = scene(), now = performance.now();
  if (sc.engine && sc.engine.kind === "shore"){
    for (let i = 0; i < 3; i++) injectBandImpulse(VH * (.66 + i * .08), .09 + i * .025, 7 + i * 3, now * .002 + i);
  } else if (sc.engine && sc.engine.kind === "deep"){
    injectEllipticImpulse(VW * .5, VH * .48, .05, 38, 28, 0);
  } else if (sc.engine && sc.engine.kind === "rain"){
    for (let i = 0; i < 18; i++) injectSceneImpulse(Math.random() * VW, Math.random() * VH, .011 + Math.random() * .012, 2.4, { ambient:true });
  } else if (sc.engine && sc.engine.kind === "silver"){
    ensureFish();
  }
  renderField(now);
  drawScene(now);
}

function detectFieldCollisions(now){
  const sc = scene(), eng = sc.engine || {};
  const threshold = eng.collisionThreshold || 32;
  if (threshold > 900 || !collisionGrid || !sim.cur) return;
  const W = sim.w, H = sim.h, cur = sim.cur, prev = sim.prev;
  let hits = 0;
  const stride = eng.kind === "rain" ? 5 : 4;
  for (let y = stride; y < H - stride && hits < 7; y += stride){
    for (let x = stride; x < W - stride && hits < 7; x += stride){
      const i = y * W + x;
      if (collisionGrid[i] > now) continue;
      const h = cur[i], dx = cur[i-1] - cur[i+1], dy = cur[i-W] - cur[i+W];
      const energy = Math.abs(h - prev[i]) * .85 + Math.abs(dx) * .75 + Math.abs(dy) * .75 + Math.abs(h) * .18;
      if (energy < threshold) continue;
      const e2 = Math.abs(cur[i-2] - cur[i+2]) + Math.abs(cur[i-W*2] - cur[i+W*2]);
      if (energy < e2 * .34) continue;
      const cool = 700 + Math.random() * 900;
      for (let yy = -stride; yy <= stride; yy += stride){
        for (let xx = -stride; xx <= stride; xx += stride){
          const ci = i + yy * W + xx;
          if (ci >= 0 && ci < collisionGrid.length) collisionGrid[ci] = now + cool;
        }
      }
      spawnCollision(x * sim.cell, y * sim.cell, Math.min(1, energy / (threshold * 2.4)));
      hits++;
    }
  }
}

/* ---------- 7. 波紋イベント検出 ---------- */
let rippleSeq = 0;
const ripples = []; // {id, x, y, born, r, freq, e0, walls, met}

function registerRipple(x, y, freq, e0){
  ripples.push({ id: rippleSeq++, x, y, born: performance.now(), r: 0,
                 freq, e0, walls: [false, false, false, false], met: new Set() });
  if (ripples.length > 24) ripples.shift();
}

function updateRipples(dtMs, now){
  const m = mode();
  const c2 = Math.min(.47, m.c2 * scene().phys.cMul * state.speed * state.speed);
  const pxPerMs = Math.sqrt(c2) * m.sub * sim.cell * 60 / 1000;
  const tau = (m.decay + 1.6) * state.life * 1000;

  for (let i = ripples.length - 1; i >= 0; i--){
    const rp = ripples[i];
    rp.r += pxPerMs * dtMs;
    const age = now - rp.born;
    const e = rp.e0 * Math.exp(-age / tau);
    if (age > tau * 2.5 || e < .02){ ripples.splice(i, 1); continue; }

    const dists = [rp.x, VW - rp.x, rp.y, VH - rp.y];
    for (let w = 0; w < 4; w++){
      if (!rp.walls[w] && rp.r >= dists[w]){
        rp.walls[w] = true;
        if (state.reflect > .05) audio.reflect(rp, w, e);
      }
    }
  }

  for (let i = 0; i < ripples.length; i++){
    for (let j = i + 1; j < ripples.length; j++){
      const a = ripples[i], b = ripples[j];
      if (a.met.has(b.id)) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 1 && a.r + b.r >= dist){
        a.met.add(b.id);
        const k = a.r / (a.r + b.r);
        const px = a.x + dx * k, py = a.y + dy * k;
        const eA = a.e0 * Math.exp(-(now - a.born) / 4000);
        const eB = b.e0 * Math.exp(-(now - b.born) / 4000);
        const str = Math.min(1, eA * eB * 2);
        if (str > .05){
          audio.interfere(a.freq, b.freq, px / VW, str);
          spawnCollision(px, py, str);
        }
      }
    }
  }
}

/* ---------- 8. サウンドエンジン ---------- */
const audio = (() => {
  let ctx = null, master = null, limiter = null, dry = null, verb = null, wet = null;
  let toneLow = null, toneMid = null, toneHigh = null; // 共通TONE EQ（NORMAL/BOWL声部用）
  let recNode = null, noiseBuf = null, brownBuf = null, pinkBuf = null;
  let voices = 0; const MAXV = 40;
  let lastInter = 0;

  // 持続ノイズベッド（CRUISE中にノイズモードで鳴る連続ドローン）
  let bedLow = null, bedMid = null, bedHigh = null, bedGain = null;
  let bedSrcs = [], bedSub = null, bedColor = null;
  // BOWL超低音ドローン（打鍵トリガーで立ち上がる持続低音。同時数を制限して低音飽和を防ぐ）
  let bowlDrones = []; const BOWL_DRONE_MAX = 3;
  // 色ごとの基準音量（素材バッファのRMSが色で大きく違うため補正）。つまみと音量で微調整可
  const BED_LEVEL = { white: .42, pink: 1.5, brown: .7 };

  function ensure(){
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return true; }
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();

      master = ctx.createGain();
      master.gain.value = Math.pow(state.volume, 1.5);
      limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -14; limiter.knee.value = 18;
      limiter.ratio.value = 7; limiter.attack.value = .004; limiter.release.value = .24;

      dry = ctx.createGain(); dry.gain.value = 1;
      verb = ctx.createConvolver(); verb.buffer = makeIR(3.6, 2.4);
      wet = ctx.createGain(); wet.gain.value = .9;

      // NORMAL/BOWL声部用の共通TONE EQ（3バンド）。dry を必ずこのEQに通してから master へ。
      // これで BOWL の重低音を音割れ寸前まで TONE BASS で追い込める。ノイズベッドは別系統(bedEQ)でmaster直結。
      toneLow  = ctx.createBiquadFilter(); toneLow.type  = "lowshelf";  toneLow.frequency.value  = 120;
      toneMid  = ctx.createBiquadFilter(); toneMid.type  = "peaking";   toneMid.frequency.value  = 1000; toneMid.Q.value = .8;
      toneHigh = ctx.createBiquadFilter(); toneHigh.type = "highshelf"; toneHigh.frequency.value = 3500;
      dry.connect(toneLow); toneLow.connect(toneMid); toneMid.connect(toneHigh); toneHigh.connect(master);

      verb.connect(wet); wet.connect(master);
      master.connect(limiter); limiter.connect(ctx.destination);
      toneSetEQ();

      // ホワイトノイズ（飛沫・反射・持続ベッド）とブラウンノイズ（グラスボウル）の素材
      // ベッドで連続ループするため3秒に延ばし、ループの周期感を目立ちにくくする
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 3, ctx.sampleRate);
      const nd = noiseBuf.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

      brownBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const bd = brownBuf.getChannelData(0);
      let bv = 0;
      for (let i = 0; i < bd.length; i++){
        bv = (bv + .02 * (Math.random() * 2 - 1)) / 1.02;
        bd[i] = bv * 3.5;
      }

      // ピンクノイズ（Paul Kelletの近似フィルタ）
      pinkBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const pd = pinkBuf.getChannelData(0);
      let p0 = 0, p1 = 0, p2 = 0;
      for (let i = 0; i < pd.length; i++){
        const w = Math.random() * 2 - 1;
        p0 = .99765 * p0 + w * .0990460;
        p1 = .96300 * p1 + w * .2965164;
        p2 = .57000 * p2 + w * 1.0526913;
        pd[i] = (p0 + p1 + p2 + w * .1848) * .18;
      }

      // 持続ノイズベッドの3バンドEQ（低=ローシェルフ / 中=ピーキング / 高=ハイシェルフ）
      bedLow  = ctx.createBiquadFilter(); bedLow.type  = "lowshelf";  bedLow.frequency.value  = 220;
      bedMid  = ctx.createBiquadFilter(); bedMid.type  = "peaking";   bedMid.frequency.value  = 1000; bedMid.Q.value = .8;
      bedHigh = ctx.createBiquadFilter(); bedHigh.type = "highshelf"; bedHigh.frequency.value = 3500;
      bedGain = ctx.createGain(); bedGain.gain.value = .0001;
      bedLow.connect(bedMid); bedMid.connect(bedHigh); bedHigh.connect(bedGain);
      bedGain.connect(master); // ベッドは共通TONE EQを通さず master 直結（NOISE TONE二重がけ回避）
      noiseBedSetEQ();

      setupRecorderTap();
      return true;
    } catch(e){ console.warn("audio init failed:", e); return false; }
  }

  function makeIR(seconds, decayPow){
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++){
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++){
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decayPow);
      }
    }
    return buf;
  }

  /* マスター音量をなめらかに動かす（クリア・クルーズのフェード共用） */
  function fadeTo(vol01, sec){
    if (!ctx) return;
    const g = master.gain, now = ctx.currentTime;
    const target = Math.max(.0001, Math.pow(Math.max(0, vol01), 1.5));
    g.cancelScheduledValues(now);
    g.setValueAtTime(Math.max(.0001, g.value), now);
    if (sec <= 0) g.setValueAtTime(target, now);
    else g.linearRampToValueAtTime(target, now + sec);
  }

  function voiceOut(pan, send, lifeSec){
    const g = ctx.createGain();
    const chain = [g];
    let tail = g;
    if (ctx.createStereoPanner){
      const p = ctx.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, pan));
      g.connect(p); tail = p; chain.push(p);
    }
    tail.connect(dry);
    if (send > 0){
      const s = ctx.createGain(); s.gain.value = send;
      tail.connect(s); s.connect(verb); chain.push(s);
    }
    // 発音とリバーブ残響が完全に終わった後にノードを切断して解放する。
    // 長時間運用で voiceOut のゲイン/パンナーが dry へ繋ぎっぱなしに蓄積し、
    // メモリ/CPUを圧迫してページが固まるのを防ぐ。リバーブIRぶん（約3.6秒）＋余白を見込む。
    if (lifeSec > 0){
      setTimeout(() => { for (const n of chain){ try { n.disconnect(); } catch(e){} } },
                 (lifeSec + 5) * 1000);
    }
    return g;
  }

  function envGain(out, peak, attack, decay, t){
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(Math.max(.0001, peak), t + attack);
    g.gain.exponentialRampToValueAtTime(.0001, t + attack + decay);
    g.connect(out);
    return g;
  }

  function countVoice(node){
    voices++;
    node.onended = () => { voices = Math.max(0, voices - 1); };
  }

  function osc(type, freq, t, stopAt){
    const o = ctx.createOscillator();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    o.start(t); o.stop(stopAt);
    countVoice(o);
    return o;
  }

  /* グラスボウル声部: ブラウンノイズ → 高Q共鳴 = 擦られたガラスの鉢 */
  function bowlVoice(out, f, strength, decay, t, m){
    for (const [ratio, vol] of m.partials){
      const src = ctx.createBufferSource();
      src.buffer = brownBuf; src.loop = true;
      src.playbackRate.value = .96 + Math.random() * .08;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = Math.min(9000, f * ratio);
      bp.Q.value = 38;
      const dur = decay * (1 + ratio * .04);
      const g = envGain(out, vol * m.bellMix * strength * .6, .28, dur, t);
      src.connect(bp); bp.connect(g);
      src.start(t); src.stop(t + dur + .8);
      countVoice(src);
    }
    const g = envGain(out, .05 * strength, .005, .8, t);
    osc("sine", f, t, t + 1.2).connect(g);
    // 芯（マレットの「コン…」）: ごく短い帯域ノイズのアタックで打音に心地よい芯を作る
    const mg = envGain(out, .06 * strength, .001, .05, t);
    const ms = ctx.createBufferSource(); ms.buffer = noiseBuf;
    const mbp = ctx.createBiquadFilter();
    mbp.type = "bandpass"; mbp.frequency.value = Math.min(2600, f * 6); mbp.Q.value = 1.2;
    ms.connect(mbp); mbp.connect(mg);
    ms.start(t); ms.stop(t + .12);
  }

  /* BOWL超低音ドローン: 打鍵でふわりと立ち上がり（0.5s）、約10秒リッチに持続し、
     約10秒かけてゆっくりしたビブラートを伴い減衰する。デチューンした複数sineのうねり
     ＋LFOでローパスのカットオフを揺らした濃密な空気感。同時数を制限して低音飽和と
     クリッピングを防ぐ（最古をクロスフェードで押し出す）。 */
  function bowlDroneVoice(out, f, strength, t){
    if (!ctx) return;
    while (bowlDrones.length >= BOWL_DRONE_MAX){
      const old = bowlDrones.shift();
      try { old.release(ctx.currentTime, 1.5); } catch(e){}
    }
    const base = Math.max(28, f * 0.5); // 1オクターブ下の超低音（28Hz下限でサブソニック保護）
    const g = ctx.createGain(); g.gain.value = 0;
    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 22; // DC/サブソニック除去
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 300; lp.Q.value = .6;
    // うねり用LFO（ぶわんぶわん）: カットオフをゆっくり揺らす
    const lfo = ctx.createOscillator(); lfo.type = "sine"; lfo.frequency.value = .16;
    const lfoG = ctx.createGain(); lfoG.gain.value = 95;
    lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start(t);
    g.connect(hp); hp.connect(lp); lp.connect(out);
    // デチューンした複数オシレータ（うねり＝バイノーラル風ビート）
    const oscs = [];
    const def = [[1, .9, -3.5], [1, .9, 3.5], [2, .32, 0], [0.5, .45, 0]]; // [周波数比, 音量, デチューンcent]
    for (const [mul, vol, cent] of def){
      const o = ctx.createOscillator(); o.type = "sine";
      o.frequency.value = base * mul; o.detune.value = cent;
      const og = ctx.createGain(); og.gain.value = vol;
      o.connect(og); og.connect(g);
      o.start(t); oscs.push(o);
    }
    // ゆっくりビブラート（減衰期に効く揺らぎ）: 全oscのdetuneを薄く揺らす
    const vib = ctx.createOscillator(); vib.type = "sine"; vib.frequency.value = .11;
    const vibG = ctx.createGain(); vibG.gain.value = 7; // ±7cent
    vib.connect(vibG); oscs.forEach(o => vibG.connect(o.detune)); vib.start(t);
    // a案エンベロープ: 0.5s立ち上がり → 約10s持続 → 約10s減衰
    const peak = Math.min(.2, .12 * strength + .055);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + 0.5);
    g.gain.setValueAtTime(peak, t + 10.5);
    g.gain.linearRampToValueAtTime(.0001, t + 20.5);
    const stopAt = t + 21;
    const allOsc = [...oscs, lfo, vib];
    allOsc.forEach(o => o.stop(stopAt));
    const rec = {
      release(now, sec){
        try{
          g.gain.cancelScheduledValues(now);
          g.gain.setValueAtTime(Math.max(.0001, g.gain.value), now);
          g.gain.linearRampToValueAtTime(.0001, now + sec);
          const s = now + sec + .1;
          allOsc.forEach(o => { try { o.stop(s); } catch(e){} });
        }catch(e){}
      }
    };
    bowlDrones.push(rec);
    setTimeout(() => { const i = bowlDrones.indexOf(rec); if (i >= 0) bowlDrones.splice(i, 1); }, 21500);
  }

  /* ノイズ声部: 色付きノイズ → 共鳴フィルタ = 音程を持つ風 */
  function noiseVoice(out, f, strength, decay, t, m){
    const buf = m.noise === "pink" ? pinkBuf : m.noise === "brown" ? brownBuf : noiseBuf;
    for (const [ratio, vol, q] of [[1, 1, 24], [2, .3, 18]]){
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.playbackRate.value = .97 + Math.random() * .06;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = Math.min(9500, f * ratio);
      bp.Q.value = q;
      const g = envGain(out, vol * strength * .7, .04, decay, t);
      src.connect(bp); bp.connect(g);
      src.start(t); src.stop(t + decay + .6);
      countVoice(src);
    }
    // 空気のベッド: フィルタの外側をごく薄く
    const src2 = ctx.createBufferSource(); src2.buffer = buf; src2.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1200;
    const g2 = envGain(out, .025 * strength, .05, decay * .8, t);
    src2.connect(lp); lp.connect(g2);
    src2.start(t); src2.stop(t + decay);
    countVoice(src2);
  }

  /* ---------- 持続ノイズベッド ----------
     従来のノイズは波紋ごとに減衰する音程付きの帯域音で、音圧が出なかった。
     ここでは選択中のノイズ色を広帯域のまま連続ループさせ、3バンドEQと
     （ブラウンのみ）サブ低音で「お腹に届く」連続ドローンを作る。 */
  function noiseBedSetEQ(){
    if (!bedLow) return;
    const now = ctx.currentTime;
    bedLow.gain.setTargetAtTime(state.noiseBass, now, .05);
    bedMid.gain.setTargetAtTime(state.noiseMid, now, .05);
    bedHigh.gain.setTargetAtTime(state.noiseTreble, now, .05);
  }

  /* 共通TONE EQ（NORMAL/BOWL声部）。BOWLの重低音をBASSで追い込むときの主役 */
  function toneSetEQ(){
    if (!toneLow) return;
    const now = ctx.currentTime;
    toneLow.gain.setTargetAtTime(state.toneBass, now, .05);
    toneMid.gain.setTargetAtTime(state.toneMid, now, .05);
    toneHigh.gain.setTargetAtTime(state.toneTreble, now, .05);
  }

  function noiseBedClearSrcs(delay){
    const t = ctx.currentTime + Math.max(0, delay || 0);
    bedSrcs.forEach(s => { try { s.stop(t); } catch(e){} });
    bedSrcs = [];
    if (bedSub){ try { bedSub.stop(t); } catch(e){} bedSub = null; }
  }

  function noiseBedStart(m){
    if (!ctx || !bedGain) return;
    const color = m.noise; // "white" | "pink" | "brown"
    if (bedColor === color && bedSrcs.length) return; // 同じ色で既に鳴っていれば何もしない
    noiseBedClearSrcs(0); // 色替え時は旧ソースを止める
    bedColor = color;
    const buf = color === "pink" ? pinkBuf : color === "brown" ? brownBuf : noiseBuf;
    // 左右をわずかにデチューンして広がり＋ループの周期感をぼかす
    for (const [rate, pan] of [[.991, -.6], [1.009, .6]]){
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.playbackRate.value = rate;
      let node = src;
      if (ctx.createStereoPanner){
        const p = ctx.createStereoPanner(); p.pan.value = pan;
        src.connect(p); node = p;
      }
      node.connect(bedLow);
      src.start();
      bedSrcs.push(src);
    }
    // ブラウンだけ48Hzのサブ低音を薄く重ねて芯を補強（お腹に届く成分）
    if (color === "brown"){
      bedSub = ctx.createOscillator(); bedSub.type = "sine"; bedSub.frequency.value = 48;
      const sg = ctx.createGain(); sg.gain.value = .12;
      bedSub.connect(sg); sg.connect(bedLow);
      bedSub.start();
    }
    // フェードイン
    const now = ctx.currentTime, target = BED_LEVEL[color] || .5;
    bedGain.gain.cancelScheduledValues(now);
    bedGain.gain.setValueAtTime(Math.max(.0001, bedGain.gain.value), now);
    bedGain.gain.linearRampToValueAtTime(target, now + 2.5);
  }

  function noiseBedStop(fadeSec){
    if (!ctx || !bedGain || !bedSrcs.length) return;
    const s = fadeSec || 2.5, now = ctx.currentTime;
    bedGain.gain.cancelScheduledValues(now);
    bedGain.gain.setValueAtTime(Math.max(.0001, bedGain.gain.value), now);
    bedGain.gain.linearRampToValueAtTime(.0001, now + s);
    noiseBedClearSrcs(s + .1);
    bedColor = null;
  }

  /* 再生状態と現在モードからベッドの入切を決める。
     active = CRUISE が動いているか。ノイズモード以外、または停止中は消す。 */
  function syncNoiseBed(active, fadeSec){
    if (!ctx) return;
    const m = mode();
    if (active && m.voice === "noise") noiseBedStart(m);
    else noiseBedStop(fadeSec);
  }

  /* 波紋の発生音。ジャンルの tweak で音色にメリハリを付ける */
  function tap(x01, y01, strength, freq, light){
    if (!ensure() || voices > MAXV) return;
    const m = mode();
    const tw = genre().tweak || {};
    const f = freq || 440;
    const t = ctx.currentTime + .005;
    const pan = (x01 * 2 - 1) * .75;
    let decay = m.decay * (tw.decay || 1) * (0.75 + Math.random() * .5) * Math.min(state.life, 1.6);
    if (light) decay *= .45;
    if (state.sustain) decay *= 2.6; // SUSTAIN: ロングトーン
    // voiceOut には発音寿命を渡して終了後にノードを解放させる。
    // BOWLのドローンは約21秒鳴るため、通常打音のdecay基準で接続が先に切れないよう寿命を確保する。
    const voiceLife = (m.voice === "bowl" && !light) ? Math.max(decay + 1, 22) : decay + 1;
    const out = voiceOut(pan, m.send * (tw.send || 1) * (light ? .7 : 1), voiceLife);
    const atk = m.atkOver || tw.atk || .004;

    // ローファイ等: 声部全体を柔らかくするローパス
    let tapOut = out;
    if (tw.lp){
      const lpf = ctx.createBiquadFilter();
      lpf.type = "lowpass"; lpf.frequency.value = tw.lp; lpf.Q.value = .7;
      lpf.connect(out); tapOut = lpf;
    }

    if (m.voice === "bowl" && !light){
      bowlVoice(tapOut, f, strength, decay, t, m);
      bowlDroneVoice(tapOut, f, strength, t); // お腹に響く超低音ドローン（打鍵トリガー）
    } else if (m.voice === "noise" && !light){
      noiseVoice(tapOut, f, strength, decay, t, m);
    } else {
      const parts = light ? m.partials.slice(0, 1) : m.partials;
      const bellAmp = light ? .07 : .14;
      for (const [ratio, vol] of parts){
        const g = envGain(tapOut, vol * m.bellMix * strength * bellAmp, atk,
                          decay * (1 - .25 * Math.log2(Math.max(1, ratio))), t);
        osc("sine", f * ratio, t, t + decay + .6).connect(g);
        // デチューンの双子（ロック・シティポップの厚み）
        if (tw.det && ratio === 1 && !light){
          const g2 = envGain(tapOut, vol * m.bellMix * strength * bellAmp * .5, atk, decay, t);
          osc("sine", f * Math.pow(2, tw.det / 1200), t, t + decay + .6).connect(g2);
        }
      }
      // サブ低音（ハウス・DnBの土台）
      if (tw.sub && !light){
        const g = envGain(tapOut, .06 * tw.sub * strength, .006, decay * .6, t);
        osc("sine", f * .5, t, t + decay + .4).connect(g);
      }
      // バチの打撃音（木琴の「コッ」・鉄琴の「チン」）
      if (m.knock && !light){
        const src = ctx.createBufferSource(); src.buffer = noiseBuf;
        const bp = ctx.createBiquadFilter();
        bp.type = "bandpass"; bp.frequency.value = Math.min(9000, f * 2.2); bp.Q.value = 1.6;
        const g = envGain(tapOut, .07 * m.knock * strength, .001, .045, t);
        src.connect(bp); bp.connect(g);
        src.start(t); src.stop(t + .1);
      }
    }
    // 水滴成分: 周波数が短く上がる "plip"
    if (m.dropMix > 0){
      const o = ctx.createOscillator();
      o.type = "sine";
      o.frequency.setValueAtTime(f * .5, t);
      o.frequency.exponentialRampToValueAtTime(f * 1.04, t + .06);
      const g = envGain(tapOut, .13 * m.dropMix * (tw.drop || 1) * strength * (light ? .7 : 1), .003, .16, t);
      o.connect(g); o.start(t); o.stop(t + .35);
      countVoice(o);
    }
    // 飛沫: 帯域ノイズの短い吐息
    if (m.splash > 0 && !light){
      const src = ctx.createBufferSource(); src.buffer = noiseBuf;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = Math.min(8000, f * 3.5); bp.Q.value = 5;
      const g = envGain(tapOut, .05 * m.splash * strength, .002, .14, t);
      src.connect(bp); bp.connect(g);
      src.start(t); src.stop(t + .25);
    }
  }

  /* 反射音: 壁側にパンした微かなチック */
  function reflect(rp, wall, e){
    if (!ensure() || voices > MAXV) return;
    const m = mode();
    if (m.voice === "noise") return; // ノイズモード中は音程付きの反射音を鳴らさない（環境音の邪魔・負荷削減）
    const t = ctx.currentTime + .005;
    const vol = e * state.reflect * m.reflGain * .07;
    if (vol < .003) return;
    const pan = wall === 0 ? -.8 : wall === 1 ? .8 : (rp.x / VW * 2 - 1) * .6;
    // 反射音は「いまそこにあるコード」へ吸着して跳ね返る
    const wx01 = wall === 0 ? .02 : wall === 1 ? .98 : rp.x / VW;
    let rf = rp.freq * 2.01;
    if (state.assist) rf = nearestTone(rf, currentLadder(wx01)); // ONは必ず心地良い音へ
    const out = voiceOut(pan, m.send * .7, 1);
    const g = envGain(out, vol, .003, .5, t);
    osc("sine", rf, t, t + .9).connect(g);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const hp = ctx.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 3000;
    const g2 = envGain(out, vol * .5, .002, .08, t);
    src.connect(hp); hp.connect(g2);
    src.start(t); src.stop(t + .15);
  }

  /* 干渉音: 二つの波の音をひとつの和音に。アシストON時は梯子へ吸着 */
  function interfere(f1, f2, x01, strength){
    if (!ensure() || voices > MAXV - 4) return;
    const now = performance.now();
    if (now - lastInter < 130) return;
    lastInter = now;
    const m = mode();
    const t = ctx.currentTime + .005;
    const pan = (x01 * 2 - 1) * .6;
    const base = strength * m.interGain;

    if (m.id === "resonance"){
      const out = voiceOut(pan, .65, 3);
      let third = (f1 + f2) / 2 * 1.5;
      if (state.assist) third = nearestTone(third, currentLadder(x01));
      for (const [f, v] of [[f1, .05], [f2, .05], [third, .02]]){
        const g = envGain(out, v * base, .22, 2.4, t);
        osc("sine", f * Math.pow(2, (Math.random() * 4 - 2) / 1200), t, t + 3).connect(g);
      }
    } else {
      let fm = (f1 + f2) / 2;
      if (state.assist) fm = nearestTone(fm, currentLadder(x01));
      const out = voiceOut(pan, m.send, 2);
      const g = envGain(out, .035 * base, .12, 1.5, t);
      osc("sine", fm, t, t + 2).connect(g);
    }
  }

  /* 録音タップ: limiter後 = 実際に聴こえる音をそのまま捕まえる */
  function setupRecorderTap(){
    try{
      recNode = ctx.createScriptProcessor(4096, 2, 2);
      recNode.onaudioprocess = (e) => {
        if (!rec.active) return;
        rec.L.push(new Float32Array(e.inputBuffer.getChannelData(0)));
        rec.R.push(new Float32Array(e.inputBuffer.getChannelData(1)));
        rec.len += e.inputBuffer.length;
      };
      limiter.connect(recNode);
      const sink = ctx.createGain(); sink.gain.value = 0;
      recNode.connect(sink); sink.connect(ctx.destination);
    } catch(e){ console.warn("recorder tap failed:", e); }
  }

  function setVolume(v){ if (master) fadeTo(v, .12); }
  function sampleRate(){ return ctx ? ctx.sampleRate : 44100; }
  function running(){ return !!ctx && ctx.state === "running"; }
  function sounding(){ return running() && (voices > 0 || bedSrcs.length > 0 || bowlDrones.length > 0); }

  /* ページ離脱時の保険: 持続ベッドを止め、AudioContextを停止して音を残さない。
     （通常タブを閉じれば破棄されるが、bfcache等で残るケースへの備え） */
  function teardown(){
    try { noiseBedStop(0); } catch(e){}
    try { const now = ctx ? ctx.currentTime : 0; bowlDrones.forEach(d => { try { d.release(now, .3); } catch(e){} }); bowlDrones = []; } catch(e){}
    try { if (ctx && ctx.state === "running") ctx.suspend(); } catch(e){}
  }

  return { ensure, tap, reflect, interfere, setVolume, sampleRate, fadeTo,
           noiseBedSetEQ, toneSetEQ, syncNoiseBed, teardown, running, sounding };
})();

// ページを閉じる / 離脱するときに音を確実に止める
window.addEventListener("pagehide", () => { try { audio.teardown(); } catch(e){} });

/* ---------- 9. 録音と WAV 書き出し ---------- */
const rec = { active: false, L: [], R: [], len: 0, startedAt: 0 };

function recStart(){
  if (!audio.ensure()) return;
  rec.L = []; rec.R = []; rec.len = 0;
  rec.active = true; rec.startedAt = performance.now();
  ui.recState();
}
function recStop(){
  rec.active = false;
  ui.recState();
}
function recSave(){
  if (rec.active) recStop();
  if (rec.len === 0) return;
  const blob = encodeWav(rec.L, rec.R, rec.len, audio.sampleRate());
  const a = document.createElement("a");
  const ts = new Date(), p = n => String(n).padStart(2, "0");
  a.download = `ripple-garden_take_${ts.getFullYear()}${p(ts.getMonth()+1)}${p(ts.getDate())}_${p(ts.getHours())}${p(ts.getMinutes())}${p(ts.getSeconds())}.wav`;
  a.href = URL.createObjectURL(blob);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* Float32のチャンク列を16bitステレオPCMのWAVに変換 */
function encodeWav(chunksL, chunksR, totalLen, sampleRate){
  const buf = new ArrayBuffer(44 + totalLen * 4);
  const dv = new DataView(buf);
  const wstr = (off, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(off + i, s.charCodeAt(i)); };
  wstr(0, "RIFF"); dv.setUint32(4, 36 + totalLen * 4, true); wstr(8, "WAVE");
  wstr(12, "fmt "); dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true);
  dv.setUint16(22, 2, true);
  dv.setUint32(24, sampleRate, true);
  dv.setUint32(28, sampleRate * 4, true);
  dv.setUint16(32, 4, true);
  dv.setUint16(34, 16, true);
  wstr(36, "data"); dv.setUint32(40, totalLen * 4, true);

  let off = 44;
  for (let c = 0; c < chunksL.length; c++){
    const L = chunksL[c], R = chunksR[c];
    for (let i = 0; i < L.length; i++){
      let l = Math.max(-1, Math.min(1, L[i])), r = Math.max(-1, Math.min(1, R[i]));
      dv.setInt16(off, l < 0 ? l * 0x8000 : l * 0x7FFF, true); off += 2;
      dv.setInt16(off, r < 0 ? r * 0x8000 : r * 0x7FFF, true); off += 2;
    }
  }
  return new Blob([buf], { type: "audio/wav" });
}

/* ---------- 10. クルーズエンジン ---------- */
/* YouTubeの長尺環境音のように、水面がひとりで演奏を続ける。
   ジャンルのリズムパターン（16分×16歩）を刻み、小節ごとにコード列が進む */
const cruise = {
  on:false, stopping:false, loop:false, shuffle:false,
  t0:0, endAt:Infinity, nextStep:0, step:0, bar:0,
  y01:.5, nextFree:0, lastShuffle:0, runQueue:[],
};

function cruiseStart(){
  if (!audio.ensure() || cruise.on) return;
  cruise.on = true; cruise.stopping = false;
  cruise.t0 = performance.now();
  cruise.endAt = cruise.loop ? Infinity : cruise.t0 + state.cruiseMin * 60000;
  cruise.step = 0; cruise.bar = 0; cruise.y01 = .45 + Math.random() * .2;
  cruise.nextStep = cruise.t0 + 500;
  cruise.nextFree = cruise.t0 + 500;
  cruise.lastShuffle = cruise.t0;
  cruise.runQueue.length = 0;
  lastAutoClean = cruise.t0; // 自動クリーンのタイマーをクルーズ開始から数える
  audio.fadeTo(0, 0);
  audio.fadeTo(state.volume, 3); // 音のフェードイン
  audio.syncNoiseBed(true); // ノイズモードなら持続ベッドを立ち上げる
  ui.cruiseState();
  ui.dismissHint();
}

function cruiseStop(fadeSec){
  if (!cruise.on || cruise.stopping) return;
  cruise.stopping = true;
  const sec = fadeSec || 2.5;
  audio.fadeTo(0, sec); // 音のフェードアウト
  audio.syncNoiseBed(false, sec); // 持続ベッドも同じ長さで看取る
  setTimeout(() => {
    cruise.on = false; cruise.stopping = false;
    audio.fadeTo(state.volume, 1.5); // 手弾き用に音を戻す
    ui.cruiseState();
  }, sec * 1000);
}

/* クルーズの一滴: コード列の帯の中に落とし、旋律は上下にゆっくり散歩する */
function cruiseDrop(vel, light){
  const g = genre();
  let x;
  if (g.prog){
    const col = cruise.bar % g.prog.length; // 小節ごとにコードが進む
    x = (col + .14 + Math.random() * .72) * (VW / g.prog.length);
  } else {
    x = (0.08 + Math.random() * .84) * VW;
  }
  cruise.y01 = Math.max(.08, Math.min(.92, cruise.y01 + (Math.random() - .5) * .2));
  const y = cruise.y01 * VH;
  spawnDrop(x, y, (.5 + vel * .45) * (.85 + Math.random() * .3), { light }); // 強さも人間的に揺らす
  // 強拍ではときどき分散和音の駆け上がり
  if (!light && vel >= .8 && Math.random() < .18 && g.prog){
    const stepDur = 60000 / g.bpm / 4;
    for (let n = 1; n <= 3; n++){
      cruise.runQueue.push({ t: performance.now() + stepDur * n, x: x + n * 14, y: y - n * 10 });
    }
  }
}

function cruiseTick(now){
  if (!cruise.on || cruise.stopping) return;

  // タイマー満了 → 8秒かけて光と音を看取る
  if (now >= cruise.endAt){
    cruiseStop(8);
    ui.toast(T().cruiseEnd);
    return;
  }

  const g = genre();
  if (g.pattern){
    const stepDur = 60000 / g.bpm / 4;
    while (now >= cruise.nextStep){
      const v = g.pattern[cruise.step % 16];
      if (v > 0 && Math.random() < .94) cruiseDrop(v, v < .5);
      cruise.step++;
      if (cruise.step % 16 === 0) cruise.bar++;
      // スウィング: 裏の16分を後ろへもたれさせる
      const swing = (cruise.step % 2 === 1) ? g.swing * stepDur : -((g.swing * stepDur) * .5);
      const human = state.assist ? 0 : (Math.random() - .5) * (g.friction || 0) * 120; // 刻みの人間的なよれ
      cruise.nextStep += stepDur + swing + human;
    }
  } else {
    // 拍を持たないジャンル（FREE / AMBIENT）はポアソン的に
    if (now >= cruise.nextFree){
      cruiseDrop(.5 + Math.random() * .5, Math.random() < .4);
      const density = g.density || 1;
      cruise.nextFree = now + (1600 + Math.random() * 3800) / density;
      if (cruise.step++ % 4 === 3) cruise.bar++;
    }
  }

  // 駆け上がりキュー
  while (cruise.runQueue.length && cruise.runQueue[0].t <= now){
    const q = cruise.runQueue.shift();
    const f = pitchAt(q.x / VW, q.y / VH, 1);
    spawnDrop(q.x, q.y, .4, { light: true, freq: f });
  }

  // シャッフル: 40〜70秒ごとにジャンルかモードがゆっくり入れ替わる
  if (cruise.shuffle && now - cruise.lastShuffle > 40000 + Math.random() * 30000){
    cruiseShuffleNow();
  }
}

/* シャッフルの一手: ジャンルかモード（ノイズ除外）をひとつ切り替える。
   クルーズの定期シャッフルと、③「次の曲」ボタンの能動発火で共用する。 */
function cruiseShuffleNow(){
  cruise.lastShuffle = performance.now();
  if (Math.random() < .6){
    const next = 1 + Math.floor(Math.random() * (GENRES.length - 1));
    ui.setGenre(next);
    ui.toast(GENRES[next].label[state.lang].split("—")[0].trim());
  } else {
    // 音浴(BATH)グループ（ノイズ3色＋BOWL）はシャッフル対象から除外（性格が違いすぎて驚くため）
    const pool = MODES.map((_, i) => i).filter(i => !inNoiseGroup(MODES[i]));
    const next = pool[Math.floor(Math.random() * pool.length)];
    ui.setMode(next);
    ui.toast(MODES[next].name + " · " + MODES[next].jp);
  }
}

  }
  document.getElementById("footerBtn").addEventListener("click", () => { verModal.hidden = false; });
  document.getElementById("vmClose").addEventListener("click", () => { verModal.hidden = true; });
  verModal.addEventListener("click", (e) => { if (e.target === verModal) verModal.hidden = true; });

  /* --- 設定の復元 --- */
  try{
    const sv = localStorage.getItem("ripple-garden_theme");
    if (sv === "light" || sv === "dark" || sv === "system") state.theme = sv;
    const sl = localStorage.getItem("ripple-garden_lang");
    if (sl && I18N[sl]) state.lang = sl;
    const ss = parseInt(localStorage.getItem("ripple-garden_scene"), 10);
    if (!isNaN(ss) && ss >= 0 && ss < SCENES.length) state.sceneIdx = ss;
  }catch(e){}
  selLang.value = state.lang;
  applyTheme();
  applyLang();
  updateModeUI();
  updateShuffleUI();
  cruiseState();
  applyWater();

  /* --- パネル開閉 --- */
  const toggle = document.getElementById("panelToggle");
  toggle.addEventListener("click", () => document.body.classList.toggle("panel-open"));
  if (window.innerWidth > 700) document.body.classList.add("panel-open");

  /* --- キーボード: 1–6 モード / C クリア / Esc で水面へ --- */
  window.addEventListener("keydown", (e) => {
    if (!modeConfirm.hidden){
      if (e.key === "Escape") closeModeConfirm(false);
      return;
    }
    if (e.key === "Escape"){ switchTab("garden"); return; }
    if (state.tab !== "garden") return;
    const d = parseInt(e.key, 10);
    if (d >= 1 && d <= Math.min(9, MODES.length)) setMode(d - 1);
    else if (e.key === "c" || e.key === "C") clearWater();
  });

  let hintGone = false;
  function dismissHint(){ if (!hintGone){ hintGone = true; hint.classList.add("gone"); } }

  return { setMode, setGenre, recState, cruiseState, badges, dismissHint, showChord, toast, switchTab };
})();

/* 入力: クリック / ドラッグ / スペース奏法（クルーズとも共有する spawnDrop を定義） */
(() => {
  let lastDrag = { x: -999, y: -999, t: 0 };
  let lastSpawnT = 0;
  let spaceHeld = false;
  const pointerPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  const stroke = { x: 0, y: 0 };

  /* 共通の一滴。opt.freq で音高上書き、opt.light で軽い声部 */
  function spawn(x, y, strength, opt = {}){
    const m = mode();
    const now = performance.now();
    // アシスト: 連打時は少しずつ音量を抑え、耳あたりを保つ
    if (state.assist && !opt.light && now - lastSpawnT < 140) strength *= .85;
    lastSpawnT = now;

    const f = opt.freq != null ? opt.freq : pitchAt(x / VW, y / VH);
    injectSceneImpulse(x, y, m.amp * strength * (opt.light ? .45 : 1), 3.6, opt);
    audio.tap(x / VW, y / VH, strength, f, !!opt.light);
    registerRipple(x, y, f, strength);
    addGlow(x, y, strength, "190,225,255", .7, opt.light ? 8 : 13);
    if (!opt.light) sceneTap(x, y);
    ui.showChord(x / VW);
    ui.dismissHint();
  }
  spawnDrop = spawn; // クルーズエンジンへ共有

  view.addEventListener("pointerdown", (e) => {
    if (state.tab !== "garden") return;
    e.preventDefault();
    audio.ensure();
    const now = performance.now();
    let strength = 1;
    // Zenモード: 連打を静かに受け流す（間が美をつくる）
    if (mode().id === "zen" && now - state.lastTapTime < 320) strength = .35;
    state.lastTapTime = now;
    spawn(e.clientX, e.clientY, strength);
    lastDrag = { x: e.clientX, y: e.clientY, t: now };
  });

  view.addEventListener("pointermove", (e) => {
    if (state.tab !== "garden" || spaceHeld) return;
    if (e.buttons === 0 || mode().id === "zen") return; // 禅は撫でても応えない
    const now = performance.now();
    const d = Math.hypot(e.clientX - lastDrag.x, e.clientY - lastDrag.y);
    if (d > 30 && now - lastDrag.t > 70){
      spawn(e.clientX, e.clientY, .45);
      lastDrag = { x: e.clientX, y: e.clientY, t: now };
    }
  });

  /* ポインタ位置の常時追跡（スペース奏法の照準） */
  window.addEventListener("pointermove", (e) => {
    pointerPos.x = e.clientX; pointerPos.y = e.clientY;
    if (!spaceHeld || state.tab !== "garden") return;

    // スペース押し込み + 移動 = 弓奏ストローク
    const dx = e.clientX - stroke.x, dy = e.clientY - stroke.y;
    const d = Math.hypot(dx, dy);
    if (d < 26) return;
    stroke.x = e.clientX; stroke.y = e.clientY;
    const step = Math.abs(dy) > Math.abs(dx) ? (dy < 0 ? 1 : -1) : (dx > 0 ? 1 : -1);
    const f = pitchAt(e.clientX / VW, e.clientY / VH, step);
    spawn(e.clientX, e.clientY, .42, { freq: f, light: true });
    addGlow(e.clientX, e.clientY, .35, "190,225,255", .5, 7); // 航跡の燐光
  });

  /* スペースキー = クリック代用。連打でリズム（OSのキーリピートは無視） */
  window.addEventListener("keydown", (e) => {
    if (e.code !== "Space") return;
    if (state.tab !== "garden") return; // 読み物中はスクロールに譲る
    e.preventDefault();
    if (e.repeat) return;
    audio.ensure();
    spaceHeld = true;
    stroke.x = pointerPos.x; stroke.y = pointerPos.y;
    spawn(pointerPos.x, pointerPos.y, 1);
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "Space"){ spaceHeld = false; }
  });
  window.addEventListener("blur", () => { spaceHeld = false; });

  view.addEventListener("contextmenu", e => e.preventDefault());
})();

/* リサイズ: 少し待ってから水面を張り直す */
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { setupSim(); ripples.length = 0; }, 220);
});

/* ---------- 12. メインループ ---------- */
let lastT = performance.now();
function frame(now){
  const dt = Math.min(50, now - lastT);
  lastT = now;
  const m = mode();
  // ⑤ 低電力ECO: WATER OFF か タブ非表示のとき、描画・波面計算・反射/干渉/きらめきを止める
  // （音・クルーズ・自動クリーンは継続する）。コウのv011設計どおりrAF自体は止めない。
  const eco = !state.water || document.hidden;

  // 水面の自然な揺らぎ: ごく小さな雫を時折落とす（音は鳴らさない）。ECO中は止める。
  if (!eco && Math.random() < m.shimmer * (dt / 16.7)){
    injectSceneImpulse(Math.random() * VW, Math.random() * VH, .022 + Math.random() * .025, 3.5, { ambient:true });
  }

  cruiseTick(now);

  // 長時間運用の自動クリーンアップ: 一定時間ごとに clearWater を発火し、
  // フェードアウト→掃除→フェードインで聴感を途切れさせずに蓄積をリセットする。
  // 演奏中の急なクリアを避けるため、手弾きが4秒以上途切れている時だけ実行する
  // （クルーズ中は手弾きしないので常に対象になる）。
  if (audio.running()){
    if (!lastAutoClean) lastAutoClean = now;
    else if (state.autoCleanMin > 0 && now - lastAutoClean > state.autoCleanMin * 60000
             && !fadeClear.active && now - state.lastTapTime > 4000){
      clearWater();
    }
  }

  if (fadeClear.active && now - fadeClear.t0 > fadeClear.dur) finishClear();

  if (!eco){
    const steps = m.sub * Math.max(1, Math.round(dt / 16.7));
    for (let s = 0; s < Math.min(steps, 4); s++) stepField();
    sceneAmbient(now, dt);
    updateScene(now, dt);
    lerpPalette();
    updateRipples(dt, now);
    detectFieldCollisions(now);
    renderField(now);
    drawScene(now);
  } else {
    // ECO中は重い波面計算・描画・反射/干渉を止め、波紋/光の蓄積だけ防ぐ
    if (ripples.length) ripples.length = 0;
    if (glows.length) glows.length = 0;
    clearScene();
  }
  ui.badges(now);
  requestAnimationFrame(frame);
}

// タブ復帰時の再基準化: 非表示中に進んだ時間でクルーズが一気に発音しないようにする
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  const now = performance.now();
  lastT = now;
  if (cruise.on && !cruise.stopping){
    cruise.nextStep = now + 200;
    cruise.nextFree = now + 200;
    cruise.runQueue.length = 0;
  }
});

setupSim();
requestAnimationFrame(frame);
</script>
